function taskModalHtml(id){
  const t = findTask(S.plan, id); if(!t) return '';
  return `<div class="card-h"><h2 id="dlg-h">${esc(t.title)}</h2><button class="btn small ghost" data-act="close">Close</button></div>
    ${t.who==='h' ? neededBy(dueOf(S.plan,t), isDone(t)) : ''}
    <div class="tasks">${taskRow(t, {forceOpen:true, withDay:true})}</div>`;
}
let toastTimer;
function toast(msg){ const el = document.getElementById('toast'); el.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.innerHTML=''; }, 3200); }

/* ============ NAVIGATION ============ */
function go(v, force){
  closeModal();
  const editorViews = ['editRecipe','kitchen','dinner','schedule'];
  if(!force && editorViews.includes(S.view) && S.draft && (dirty() || S.draft.mode === 'new') && S.draft.mode !== 'review' && v !== S.view){ openModal('leave', v); return; }
  if(v === 'kitchen'){ startDraft('kitchen'); }
  else if(v === 'dinner'){ startDraft('dinner', {shift:true}); }
  else if(v === 'schedule'){ startDraft('schedule'); }
  else if(!editorViews.includes(v)) S.draft = null;
  if(v === 'addDish') S.add = null;
  S.view = v; render(); window.scrollTo(0,0);
}
function openRecipeEditor(k){
  closeModal();
  if(['editRecipe','kitchen','dinner','schedule'].includes(S.view) && dirty() && !(S.view==='editRecipe' && S.draft.recipeId===k)){ S.pendingRecipe = k; openModal('leave', 'editRecipe'); return; }
  startDraft('recipe', {recipeId:k}); S.openTask = null; S.view = 'editRecipe'; render(); window.scrollTo(0,0);
}

/* ============ DRAFT BINDING ============ */
function setPath(obj, parts, val){
  let o = obj;
  for(let i=0;i<parts.length-1;i++){ const p = parts[i]; if(o[p] == null) o[p] = /^\d+$/.test(parts[i+1]) ? [] : {}; o = o[p]; }
  o[parts[parts.length-1]] = val;
}
function applyBind(el){
  const d = S.draft; if(!d) return false;
  const path = el.dataset.b, type = el.dataset.type;
  let val = el.type === 'checkbox' ? el.checked : el.value;
  if(type === 'num'){ val = Number(val); if(!isFinite(val)) return false; }
  if(type === 'lines') val = String(val).split('\n').map(s=>s.trim()).filter(Boolean);
  const plan = d.plan, parts = path.split('.');
  if(parts[0] === 'r'){ setPath(plan.recipes[d.recipeId], parts.slice(1), val); }
  else if(parts[0] === 'ing'){ setPath(plan.recipes[d.recipeId].ingredients, parts.slice(1), val); }
  else if(parts[0] === 'step'){ setPath(plan.recipes[d.recipeId].steps, parts.slice(1), val); }
  else if(parts[0] === 'k'){ setPath(plan.kitchen, parts.slice(1), val); }
  else if(parts[0] === 'tool'){ setPath(plan.kitchen.tools, parts.slice(1), val); }
  else if(parts[0] === 't'){
    const t = findTask(plan, parts[1]); if(!t) return false;
    const f = parts.slice(2);
    if(f[0] === 'ovenOn'){ if(val){ t.oven = {temp:350, slots:1, min: t.dur||30, max:(t.dur||30)+5, check:''}; } else { t.dur = t.oven ? t.oven.min : t.dur; delete t.oven; } }
    else if(f[0] === 'who'){
      if(val === 'h' && t.who !== 'h'){ t.who = 'h'; delete t.oven; t.uses = {}; t.from = t.from || [t.day, '08:00']; if(!t.for && !t.due) t.due = [t.day, t.t]; }
      else if(val === 'mm' && t.who !== 'mm'){ const d0 = dueOf(plan, t) - (t.dur||5)*60000; t.who = 'mm'; t.day = dayOf(d0); t.t = hm(d0); }
    }
    else if(f[0] === 'for' && f[1] === 'id'){ if(val){ t.for = {id: val, before: (t.for && t.for.before) || 0}; delete t.due; } else { const due = dueOf(plan,t); t.due = [dayOf(due), hm(due)]; delete t.for; } }
    else if(f[0] === 'due'){ t.due = [t.due ? t.due[0] : t.day, val]; }
    else if(f[0] === 'oven' && (f[1] === 'min' || f[1] === 'max')){ setPath(t, f, val); if(t.oven.max < t.oven.min) t.oven[f[1]==='min'?'max':'min'] = val; t.dur = t.oven.min; }
    else setPath(t, f, val);
  }
  return true;
}

/* ============ EVENTS ============ */
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset && el.dataset.b && !el.dataset.struct){ if(applyBind(el)) refreshImpact(); }
  if(el.dataset && el.dataset.dinner){ applyDinner(); refreshImpact(); }
  if(el.id === 'land-name') S.landingName = el.value;
  if(el.name === 'role'){ S.landingRole = el.value; render(); }
  if(el.name === 'dish'){ S.landingDishes = [...document.querySelectorAll('input[name="dish"]:checked')].map(x => x.value); el.closest('.dish').classList.toggle('on', el.checked); }
  if(el.name === 'newdish'){ S.landingNew = el.checked; el.closest('.dish').classList.toggle('on', el.checked); }
  if(el.id === 'add-text' && S.add) S.add.text = el.value;
  if(el.id === 'import-code' && S.add) S.add.code = el.value;
  if(el.id === 'add-own' && S.add) S.add.own = el.checked;
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'add-files' && S.add){ S.add.files = [...el.files].slice(0,4); S.add.error = ''; render(); return; }
  if(el.id === 'owner-sel' && S.draft){ S.draft.ownerKey = el.value || null; S.draft.ownerChanged = true; refreshImpact(); return; }
  if(el.dataset && el.dataset.b && (el.dataset.struct || el.tagName === 'SELECT')){ if(applyBind(el)) render(); }
});
document.addEventListener('submit', e => {
  if(e.target.id !== 'land-form') return;
  e.preventDefault();
  const role = (document.querySelector('input[name="role"]:checked') || {}).value;
  const name = document.getElementById('land-name').value.trim().slice(0,30);
  const err = document.getElementById('land-err');
  if(!name){ err.textContent = 'Enter your name so others know who\'s who.'; document.getElementById('land-name').focus(); return; }
  if(!role){ err.textContent = 'Choose how you\'re pitching in.'; return; }
  const dishes = role === 'owner' ? [...document.querySelectorAll('input[name="dish"]:checked')].map(x => x.value) : [];
  const addNew = role === 'owner' && !!(document.querySelector('input[name="newdish"]') || {}).checked;
  if(role === 'owner' && !dishes.length && !addNew){ err.textContent = 'Pick at least one dish, or choose "Add a new dish".'; return; }
  S.key = keyFor(name);
  S.me = {key: S.key, name, role}; lsSet('tg-me', S.me);
  savePerson(S.key, {name, role, dishes, joinedAt: (S.people[S.key] && S.people[S.key].joinedAt) || Date.now()});
  S.landingRole = null; S.landingName = null; S.landingDishes = null; S.landingNew = false;
  if(addNew){ S.add = null; S.view = 'addDish'; } else S.view = homeView();
  render(); window.scrollTo(0,0);
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if(act === 'scrim'){ if(e.target === el) closeModal(); return; }
  const plan = S.plan;
  switch(act){
    case 'go': go(v); break;
    case 'menu': openModal('menu'); break;
    case 'switch': closeModal(); S.view = 'landing'; S.draft = null; render(); window.scrollTo(0,0); break;
    case 'recipeTab': S.recipeTab = v; render(); break;
    case 'planDay': S.planDay = v; render(); break;
    case 'planMode': S.planMode = v; lsSet('tg-planmode', v); render(); break;
    case 'taskModal': openModal('task', id); break;
    case 'hjFilter': S.hjFilter = v; render(); break;
    case 'expand': { const set = el.dataset.auto ? S.collapsed : S.expanded; set.has(id) ? set.delete(id) : set.add(id); render(); break; }
    case 'toggle': {
      const t = findTask(plan, id), s = prog(id);
      if(s.done) saveTask(id, {done:false, doneAt:null, outAt:null});
      else saveTask(id, Object.assign({done:true, doneAt:now(), doneBy:S.key}, t && t.oven ? {outAt: now()} : {}));
      break;
    }
    case 'start': saveTask(id, {startedAt: now()}); break;
    case 'unstart': saveTask(id, {startedAt: null}); break;
    case 'ovenTime': openModal('ovenTime', id); break;
    case 'saveOven': { const val = document.getElementById('oven-time').value; closeModal(); if(val){ const [h,m] = val.split(':').map(Number); const d = new Date(now()); d.setHours(h, m, 0, 0); saveTask(id, {inOvenAt: d.getTime(), done:false}); } break; }
    case 'unoven': saveTask(id, {inOvenAt:null, midDone:false}); break;
    case 'out': saveTask(id, {done:true, outAt:now(), doneAt:now(), doneBy:S.key}); break;
    case 'mid': saveTask(id, {midDone:true}); break;
    case 'claim': { const a = prog(id).assignee; if(a && a !== S.key){ toast(`${personName(a)} already took that one.`); break; } saveTask(id, {assignee:S.key}); toast('It\'s yours. The steps are under "Your jobs".'); break; }
    case 'release': saveTask(id, {assignee:null}); break;
    case 'toMM': { const p = clone(plan), t = findTask(p, id); const d0 = dueOf(p, t) - (t.dur||5)*60000; t.wasHelper = {from:t.from||null, for:t.for||null, due:t.due||null}; t.who = 'mm'; t.day = dayOf(d0); t.t = hm(d0); savePlan(p); if(prog(id).assignee) saveTask(id, {assignee:null}); toast('Moved to your plan.'); break; }
    case 'toHelper': { const p = clone(plan), t = findTask(p, id); const w = t.wasHelper || {}; t.who = 'h'; delete t.oven; t.uses = {}; t.from = w.from || [t.day, '08:00']; if(w.for) t.for = w.for; else t.due = w.due || [t.day, t.t]; delete t.wasHelper; savePlan(p); toast('Back on the helper list.'); break; }
    case 'editTask': { const t = findTask(plan, id); if(t){ openRecipeEditor(plan.recipes[t.r] ? t.r : 'general'); if(S.view === 'editRecipe'){ S.openTask = id; render(); } } break; }
    case 'editRecipe': openRecipeEditor(id); break;
    case 'addRecipe': go('addDish'); break;
    case 'askRemoveRecipe': openModal('removeRecipe', id); break;
    case 'removeRecipe': { const p = clone(plan); delete p.recipes[id]; p.recipeOrder = p.recipeOrder.filter(k=>k!==id); p.tasks = p.tasks.filter(t=>t.r!==id); for(const t of p.tasks){ if(t.for && !findTask(p, t.for.id)){ const d = dueOf(plan, t); t.due = [dayOf(d), hm(d)]; delete t.for; } if(t.needs) t.needs = t.needs.filter(n => findTask(p, n)); } S.draft = null; savePlan(p); closeModal(); S.view = 'recipesAdmin'; render(); toast('Recipe removed.'); break; }
    case 'openTask': S.openTask = S.openTask === id ? null : id; render(); break;
    case 'addTask': { const t = {id: rid('x-'), r: S.draft.recipeId, day:'thu', t:'12:00', dur:15, who:'mm', title:'New step', steps:[], uses:{}}; S.draft.plan.tasks.push(t); S.openTask = t.id; render(); break; }
    case 'delTask': S.draft.plan.tasks = S.draft.plan.tasks.filter(t => t.id !== id); render(); break;
    case 'addGroup': S.draft.plan.recipes[S.draft.recipeId].ingredients.push({g:'New group', items:[]}); render(); break;
    case 'delGroup': S.draft.plan.recipes[S.draft.recipeId].ingredients.splice(Number(el.dataset.i),1); render(); break;
    case 'addMethod': S.draft.plan.recipes[S.draft.recipeId].steps.push({h:'New step', x:''}); render(); break;
    case 'delMethod': S.draft.plan.recipes[S.draft.recipeId].steps.splice(Number(el.dataset.i),1); render(); break;
    case 'addTool': S.draft.plan.kitchen.tools.push({id: rid('tool-'), name:'New tool', count:1}); render(); break;
    case 'delTool': S.draft.plan.kitchen.tools.splice(Number(el.dataset.i),1); render(); break;
    case 'schedDay': S.schedDay = v; render(); break;
    case 'editTime': openModal('editTime', id); break;
    case 'applyTime': { const t = findTask(S.draft.plan, id); t.day = document.getElementById('et-day').value; const tv = document.getElementById('et-time').value; if(tv) t.t = tv; const du = document.getElementById('et-dur'); if(du) t.dur = Math.max(0, Number(du.value)||0); closeModal(); if(t.day !== S.schedDay) toast(`Moved to ${t.day==='wed'?'Wednesday':'Thursday'}.`); render(); break; }
    case 'discard': if(S.draft){ if(S.draft.mode === 'new'){ S.draft = null; go(isHost() ? 'recipes' : homeView(), true); toast('Dish not added.'); break; } S.draft.plan = clone(S.draft.base); if(S.draft.kind==='dinner') S.draft.shift = true; render(); toast('Changes discarded.'); } break;
    case 'saveDraft': { if(!S.draft) break; const nv = commitDraft(); if(nv){ S.view = nv; window.scrollTo(0,0); } render(); break; }
    case 'saveAndGo': if(S.draft && (dirty() || S.draft.mode === 'new')) commitDraft(); S.draft = null; afterLeave(v); break;
    case 'declineSub': if(S.draft && S.draft.subId){ removeSub(S.draft.subId); S.draft = null; toast('Declined. It won\'t be added.'); go('recipes', true); } break;
    case 'reviewSub': openReview(id); break;
    case 'addMode': if(S.add){ const ta = document.getElementById('add-text'); if(ta) S.add.text = ta.value; S.add.mode = v; S.add.error = ''; render(); } break;
    case 'readRecipe': readRecipe(); break;
    case 'importDish': importDish(); break;
    case 'showPrompt': if(S.add){ const c = document.getElementById('import-code'); if(c) S.add.code = c.value; S.add.showPrompt = !S.add.showPrompt; render(); } break;
    case 'copyPrompt': { const c = document.getElementById('import-code'); if(c && S.add) S.add.code = c.value;
      const txt = importPrompt();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied. Paste it into Claude, then add your recipe.'), () => { if(S.add){ S.add.showPrompt = true; render(); } toast('Copy didn\'t work here. Select the prompt below and copy it.'); });
      break; }
    case 'stopRead': if(S.add && S.add.ctl) S.add.ctl.abort(); break;
    case 'manualRecipe': manualRecipe(); break;
    case 'fixAI': fixWithAI(); break;
    case 'zoom': S.zoom = v; render(); break;
    case 'addOvenStep': { const t = {id: rid('x-'), r: S.draft.recipeId, day:'thu', t:'15:00', dur:30, who:'mm', title:'Bake', steps:[], uses:{}, oven:{temp:350, slots:1, min:30, max:35, check:''}}; S.draft.plan.tasks.push(t); render(); break; }
    case 'discardAndGo': S.draft = null; afterLeave(v); break;
    case 'pretend': openModal('pretend'); break;
    case 'savePretend': { const val = document.getElementById('pretend-time').value; if(val){ S.pretend = {at:new Date(val).getTime(), setAt:Date.now()}; lsSet('tg-pretend', S.pretend); } closeModal(); render(); break; }
    case 'realtime': S.pretend = null; lsSet('tg-pretend', null); closeModal(); render(); break;
    case 'askReset': openModal('reset'); break;
    case 'doReset': resetAll(); closeModal(); break;
    case 'close': closeModal(); break;
  }
});
function afterLeave(v){ closeModal(); if(v === 'editRecipe' && S.pendingRecipe){ const k = S.pendingRecipe; S.pendingRecipe = null; startDraft('recipe', {recipeId:k}); S.view = 'editRecipe'; render(); } else go(v, true); }
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
  const g = e.target.closest && e.target.closest('[data-grip]');
  if(g && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){
    e.preventDefault();
    const t = findTask(S.draft.plan, g.dataset.grip); t.t = fromMin(toMin(t.t) + (e.key==='ArrowUp' ? -5 : 5));
    render(); const ng = document.querySelector(`[data-grip="${CSS.escape(t.id)}"]`); if(ng) ng.focus();
  }
});

/* Drag on the schedule timeline */
let drag = null, raf = 0;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('[data-grip]'); if(!g || !S.draft) return;
  e.preventDefault();
  const blk = g.closest('.blk'), t = findTask(S.draft.plan, g.dataset.grip);
  drag = {t, blk, y0: e.clientY, m0: toMin(t.t), top0: parseFloat(blk.style.top), pid: e.pointerId};
  try{ g.setPointerCapture(e.pointerId); }catch(_){}
  blk.classList.add('dragging');
});
document.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.pid) return;
  const delta = Math.round((e.clientY - drag.y0) / PPM / 5) * 5;
  const m = Math.max(0, Math.min(23*60+55, drag.m0 + delta));
  drag.blk.style.top = (drag.top0 + (m - drag.m0) * PPM) + 'px';
  drag.t.t = fromMin(m);
  const lbl = drag.blk.querySelector('.blk-time'); if(lbl) lbl.textContent = fmtTime(at(drag.t.day, drag.t.t));
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    refreshImpact();
    const bad = new Set(planIssues(S.draft.plan).flatMap(i => i.ids));
    document.querySelectorAll('.blk').forEach(b => b.classList.toggle('bad', bad.has(b.dataset.id)));
  });
});
function endDrag(e){ if(!drag || (e && e.pointerId !== drag.pid)) return; drag = null; render(); }
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

async function resetAll(){
  const ids = Object.keys(S.tasks); S.tasks = {}; render();
  if(!db){ lsSet('tg-local2', {tasks:{}, people:S.people, plan:S.plan}); return; }
  for(const id of ids){ try{ await db.doc('tasks/'+id).delete(); }catch(e){} }
  toast('Progress cleared.');
}

/* ============ BOOT ============ */
function localKey(){ let k = lsGet('tg-helper-key'); if(!k){ k = 'local-' + Math.random().toString(36).slice(2,10); lsSet('tg-helper-key', k); } return k; }
function validPlan(p){ return p && p.v === 2 && Array.isArray(p.tasks) && p.recipes && p.kitchen && Array.isArray(p.recipeOrder); }
async function boot(){
  render();
  setInterval(() => { if(document.getElementById('modal').innerHTML || drag) return; const a = document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { document.querySelectorAll('.nowtxt').forEach(n => n.textContent = nowText()); return; } render(); }, 15000);
  const C = window.claude;
  const finishLocal = () => {
    S.conn = 'local'; if(!S.key) S.key = localKey();
    const l = lsGet('tg-local2'); if(l){ S.tasks = l.tasks || {}; S.people = l.people || {}; if(validPlan(l.plan)) S.plan = l.plan; }
    S.subs = lsGet('tg-subs') || {};
    afterIdentity(); S.ready = true; render();
  };
  let u = null, d = null;
  if(C && typeof C.use === 'function'){ try{ [u, d] = await Promise.all([C.use('user'), C.use('db')]); }catch(e){} }
  else {
    S.noAI = true;
    if(FIREBASE_CONFIG && window.firebase){ try{ if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); d = firebase.firestore(); }catch(e){ d = null; } }
  }
  userCap = u; db = d;
  if(u){ try{ const me = await u.me(); S.key = me.id || null; S.suggestedName = (me.name || '').split(' ')[0]; }catch(e){} }
  if(!S.key) S.key = localKey();
  if(!db) return finishLocal();
  S.conn = 'loading';
  let gotTasks = false, gotPlan = false;
  const loaded = () => { if(gotTasks && gotPlan && !S.ready){ S.ready = true; afterIdentity(); } };
  const loadTimer = setTimeout(() => { if(!S.ready){ S.ready = true; afterIdentity(); } if(S.conn === 'loading'){ S.conn = 'stale'; } render(); }, 10000);
  db.doc('plan/current').onSnapshot(snap => {
    if(snap.exists && validPlan((snap.data()||{}).plan)) S.plan = snap.data().plan;
    if(!snap.metadata.fromCache) gotPlan = true;
    loaded(); render();
  }, () => { gotPlan = true; loaded(); render(); });
  db.collection('tasks').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(x => { if(x.exists) m[x.id] = x.data(); }); S.tasks = m;
    if(!snap.metadata.fromCache){ gotTasks = true; clearTimeout(loadTimer); if(S.conn === 'loading' || S.conn === 'stale') S.conn = 'live'; }
    loaded(); render();
  }, () => { clearTimeout(loadTimer); S.conn = 'stale'; gotTasks = true; loaded(); render(); });
  db.collection('submissions').onSnapshot(snap => { const m = {}; snap.docs.forEach(x => { if(x.exists) m[x.id] = x.data(); }); S.subs = m; render(); }, () => {});
  db.collection('people').onSnapshot(snap => { const m = {}; snap.docs.forEach(x => { if(x.exists) m[x.id] = x.data(); }); S.people = m; render(); }, () => {});
}
function afterIdentity(){
  S.baseKey = S.baseKey || S.key;
  if(S.me && !(S.me.key && S.me.key.startsWith(S.baseKey + '-'))) S.me = null;   // saved identity from another account
  if(S.me) S.key = S.me.key;
  S.view = S.me ? homeView() : 'landing';
}
boot();
