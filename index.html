<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanksgiving Game Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  /* Layout: yellow header band, light content sheet with rounded top corners, fixed orange bottom nav (Mastermind), orange slide-in menu */
  --yellow:#F5CB58; --yellow2:#F3E9B5; --orange:#E95322; --orange2:#FFDECF;
  --orange-ink:#B23C12; --ink:#391713; --ink2:#252525; --cream:#F8F8F8; --white:#FFFFFF;
  --bg:#F5F5F5; --muted:#76615C; --line:#EADFD8;
  --good:#2C7A4B; --good-soft:#E1F1E6; --warn:#9A5800; --warn-soft:#FCEBC6; --crit:#C02D19; --crit-soft:#FDE0D8;
  --font:"League Spartan","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--yellow);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font);line-height:1.1;text-wrap:balance;margin:0;color:var(--ink)}
h2{font-size:1.25rem;font-weight:500}
h3{font-size:1.02rem;font-weight:600}
.tnum,.time{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
svg{flex:0 0 auto}

/* Header band */
.top{background:var(--yellow)}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px 40px;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.brand{display:grid;gap:4px;min-width:0}
.app-name{font-size:.85rem;font-weight:600;color:var(--ink);opacity:.8;letter-spacing:.02em}
.view-t{font-size:2rem;font-weight:700;color:var(--white);line-height:1;text-shadow:0 1px 0 rgba(57,23,19,.12)}
.nowpill{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;font-weight:600;color:var(--orange-ink)}
.nowpill svg{width:16px;height:16px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--cream);color:var(--orange);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 rgba(57,23,19,.08)}
.iconbtn svg{width:24px;height:24px}

/* Content sheet */
.sheet-main{background:var(--bg);border-radius:30px 30px 0 0;margin-top:-30px;min-height:calc(100dvh - 120px);padding-bottom:110px;position:relative}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px;display:grid;gap:16px}
@media (min-width:900px){ .wrap.split{grid-template-columns:minmax(0,1fr) 360px;align-items:start} }
.rail,.col{display:grid;gap:16px;min-width:0}
.card{background:var(--white);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;box-shadow:0 1px 2px rgba(57,23,19,.05)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:.9rem;font-weight:400}
.empty{color:var(--muted);font-size:.95rem;margin:0}
.banner{max-width:1100px;margin:0 auto;padding:16px 16px 0}
.banner div{border-radius:14px;padding:10px 14px;font-size:.92rem;background:var(--orange2);color:var(--ink)}

/* Buttons */
.btn{border:0;background:var(--orange2);color:var(--orange-ink);border-radius:999px;padding:9px 18px;min-height:42px;cursor:pointer;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(.97)}
.btn.primary,.btn.heat{background:var(--orange);color:var(--white);font-weight:600;font-size:1.02rem}
.btn.ghost{background:transparent;color:var(--orange-ink)}
.btn.small{min-height:36px;padding:6px 14px;font-size:.88rem}
.btn.primary.small,.btn.heat.small{font-size:.92rem}
.btn.link{background:none;padding:2px 0;min-height:0;color:var(--orange-ink);font-weight:600}
.btn.big{min-height:52px;font-size:1.3rem;font-weight:500;padding:10px 40px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Hero banner */
.hero{background:var(--orange);color:var(--white);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border:16px solid var(--yellow);border-radius:50%;opacity:.9}
.hero h2,.hero .eta,.hero .eta-label{color:var(--white)}
.hero-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;position:relative;z-index:1}
.eta-label{font-size:1rem;font-weight:400}
.eta{font-weight:700;font-size:2.8rem;line-height:1;letter-spacing:-.01em}
.hero .prog{background:rgba(255,255,255,.3)}
.hero .prog i{background:var(--yellow)}
.hero .prog-row{color:var(--cream)}
.hero .pill.good{background:var(--white);color:var(--good)}
.hero .pill.warn{background:var(--yellow);color:var(--ink)}
.hero .pill.crit{background:var(--white);color:var(--crit)}
.hero .mini{background:rgba(255,255,255,.16)}
.hero .mini span,.hero .mini b{color:var(--white)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.heat{background:var(--orange2);color:var(--orange-ink)}
.pill.neutral{background:var(--yellow2);color:var(--ink)}
.prog{height:10px;border-radius:999px;background:var(--yellow2);overflow:hidden;position:relative;z-index:1}
.prog i{display:block;height:100%;background:var(--orange);border-radius:999px;transition:width .4s}
.prog.thin{height:6px;margin:4px 0}
.prog-row{display:flex;justify-content:space-between;font-size:.92rem;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.daysplit{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.mini{border-radius:14px;padding:10px 12px}
.mini b{display:block;font-size:1.2rem;font-weight:700}
.mini span{font-size:.85rem}
.mini .prog{height:6px;margin-top:6px}

/* Alerts */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;font-size:.95rem}
.alert.crit{background:var(--crit-soft)}
.alert.warn{background:var(--warn-soft)}
.alert.info{background:var(--yellow2)}
.alert p{margin:0;flex:1}
.alert.crit p::before,.alert.warn p::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;background:var(--warn)}
.alert.crit p::before{background:var(--crit)}
.newtag{background:var(--crit);color:#fff;border-radius:6px;padding:1px 6px;font-size:.72rem;margin-right:4px;font-weight:600}

/* Oven */
.slots{display:grid;gap:8px}
.slot{border:2px dashed var(--line);border-radius:14px;min-height:56px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;font-size:.88rem;color:var(--muted)}
.slot.full{border:0;background:var(--orange2);color:var(--ink)}
.slot.over{background:var(--crit-soft)}
.slot b{font-size:.95rem;font-weight:600}
.ovenitem{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.timer{font-weight:700;font-size:1.4rem;color:var(--orange-ink);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:999px;background:var(--yellow2);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--orange)}
.meter i.over{background:var(--crit)}

/* Steps */
.tasks{display:grid}
.group-h{font-size:1.05rem;font-weight:500;color:var(--orange-ink);padding:14px 0 4px}
.task{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task.nocheck{grid-template-columns:minmax(0,1fr)}
.check{width:40px;height:40px;border-radius:12px;border:2px solid var(--orange);background:var(--white);color:var(--white);display:grid;place-items:center;cursor:pointer;padding:0}
.check svg{width:22px;height:22px;opacity:0}
.check[aria-pressed="true"]{background:var(--orange)}
.check[aria-pressed="true"] svg{opacity:1}
.check.inoven{background:var(--orange2);color:var(--orange)}
.check.inoven svg{opacity:1}
.tmain{display:grid;gap:6px;min-width:0}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.time{font-weight:700;color:var(--orange-ink)}
.ttitle{font-weight:500;font-size:1.08rem;line-height:1.25}
.task.done .ttitle{color:var(--muted);text-decoration:line-through}
.task.done .time{color:var(--muted)}
.chip{border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--yellow2);color:var(--ink)}
.chip.helper{background:var(--orange2);color:var(--orange-ink)}
.chip.ovenchip{background:var(--orange);color:var(--white)}
.chip.late{background:var(--warn-soft);color:var(--warn)}
.plus{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--yellow2);color:var(--orange);font-size:1.4rem;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center}
.plus[aria-expanded="true"]{background:var(--orange);color:var(--white)}
.detail{display:grid;gap:8px;font-size:.95rem;background:var(--bg);border-radius:14px;padding:12px 14px}
.detail ol{margin:0;padding-left:20px;display:grid;gap:4px}
.uses{font-size:.85rem;color:var(--muted)}
.note{background:var(--orange2);padding:10px 12px;border-radius:14px;font-size:.92rem}
.note ul{margin:0;padding-left:18px;display:grid;gap:4px}

.seg{display:inline-flex;background:var(--yellow2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:600;font-size:.9rem;border-radius:999px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--white)}

/* People */
.hlist{display:grid;gap:12px}
.hrow{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:1.1rem}
.hrow p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}

/* Recipes */
.subtabs{display:flex;gap:14px;overflow-x:auto;padding:20px 16px 4px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:0 0 auto;border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:6px;padding:0;width:68px}
.subtab .tile{width:52px;height:64px;border-radius:30px;background:var(--yellow2);color:var(--orange);display:grid;place-items:center;font-weight:700;font-size:1.35rem}
.subtab .lbl{font-size:.82rem;font-weight:500;color:var(--ink);text-align:center;line-height:1.1}
.subtab[aria-current="page"] .tile{background:var(--orange);color:var(--white)}
.subtab[aria-current="page"] .lbl{font-weight:700}
.rhead h1{font-size:1.7rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ing{display:grid;gap:14px}
.ing ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.steps{margin:0;padding-left:22px;display:grid;gap:12px}
.steps b{display:block;font-weight:600}
.rgrid{display:grid;gap:16px}
@media (min-width:900px){.rgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start}}

/* Helper jobs */
.hello h1{font-size:1.7rem;font-weight:600}
.joblist{display:grid;gap:12px}
.job{border-radius:18px;padding:14px;display:grid;gap:8px;background:var(--white);border:2px solid var(--yellow2)}
.job.mine{border-color:var(--orange)}
.job.done{opacity:.75}
.job h3{font-size:1.12rem;font-weight:600}
.job ol{margin:0;padding-left:20px;display:grid;gap:5px}
.needby{display:flex;align-items:center;gap:8px;border-radius:14px;padding:9px 12px;background:var(--yellow2);color:var(--ink);font-size:.95rem}
.needby svg{width:20px;height:20px;color:var(--orange)}
.needby b{font-size:1.08rem;font-weight:700}
.needby.soon{background:var(--yellow);color:var(--ink)}
.needby.late{background:var(--orange);color:var(--white)}
.needby.late svg{color:var(--white)}
.needby.ok{background:var(--good-soft);color:var(--good)}

/* Landing */
.band{background:var(--yellow);padding:36px 20px 64px;text-align:center;display:grid;gap:8px;justify-items:center}
.band-t{font-size:2.2rem;font-weight:700;color:var(--white)}
.land{max-width:520px;margin:0 auto;padding:28px 24px;display:grid;gap:18px}
.land h2{font-size:1.6rem;font-weight:600}
.land-form{display:grid;gap:18px}
.roles{border:0;margin:0;padding:0;display:grid;gap:10px}
.roles legend{margin-bottom:8px;font-size:1.15rem;font-weight:500}
.role{display:grid;gap:2px;border-radius:16px;padding:14px 16px 14px 48px;cursor:pointer;position:relative;background:var(--yellow2);border:2px solid transparent}
.role input{position:absolute;left:16px;top:17px;width:20px;height:20px;accent-color:var(--orange)}
.role b{font-size:1.1rem;font-weight:600}
.role span{font-size:.92rem;color:var(--muted)}
.role.on{border-color:var(--orange);background:var(--orange2)}
.land .submit-row{display:flex;justify-content:center;padding-top:8px}

/* Forms */
.field{display:grid;gap:6px;font-weight:500;font-size:1rem;min-width:0;color:var(--ink)}
.field input,.field select,.field textarea{font:inherit;font-weight:400;font-size:1.02rem;padding:10px 14px;border-radius:13px;border:0;background:var(--yellow2);color:var(--ink);min-height:46px;width:100%}
.field textarea{resize:vertical;line-height:1.4}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--orange);outline-offset:0}
.check-field{display:flex;align-items:center;gap:10px}
.check-field input{width:22px;height:22px;min-height:0;accent-color:var(--orange)}
.formerr{color:var(--crit);margin:0;min-height:1.2em;font-size:.92rem}
.q-label{font-weight:500}

/* Bottom navigation */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.bnav-in{pointer-events:auto;width:min(560px,100%);background:var(--orange);border-radius:30px 30px 0 0;display:grid;grid-template-columns:repeat(3,1fr);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bnav button{border:0;background:none;color:var(--cream);display:grid;justify-items:center;gap:3px;padding:6px 0;cursor:pointer;font-size:.82rem;font-weight:500;border-radius:16px}
.bnav button svg{width:26px;height:26px}
.bnav button[aria-current="page"]{background:var(--cream);color:var(--orange-ink)}

/* Slide-in menu */
.scrim{position:fixed;inset:0;background:rgba(57,23,19,.35);display:grid;place-items:end center;z-index:50;padding:16px}
@media (min-width:600px){.scrim{place-items:center}}
.dialog{background:var(--white);color:var(--ink);border-radius:24px;padding:22px;width:min(440px,100%);display:grid;gap:14px}
.dialog h2{font-size:1.4rem;font-weight:600}
.scrim.drawer{place-items:stretch end;padding:0}
.drawer-panel{background:var(--orange);color:var(--cream);width:min(340px,88vw);height:100%;border-radius:40px 0 0 40px;padding:36px 24px 28px;display:flex;flex-direction:column;gap:24px;overflow-y:auto;box-shadow:-8px 0 30px rgba(57,23,19,.25)}
.drawer-me{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center}
.drawer-me .avatar{width:56px;height:56px;background:var(--cream);color:var(--orange);font-size:1.5rem}
.drawer-me b{display:block;font-size:1.5rem;font-weight:600;color:var(--white);line-height:1.1}
.drawer-me span{font-size:.95rem;color:var(--cream)}
.drawer-close{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:var(--white);cursor:pointer;font-size:1.3rem;display:grid;place-items:center}
.menu{display:grid}
.menu-item{display:grid;grid-template-columns:48px 1fr;gap:16px;align-items:center;text-align:left;border:0;border-bottom:1px solid rgba(248,248,248,.6);background:none;color:var(--cream);padding:12px 0;cursor:pointer;min-height:64px}
.menu-item:last-child{border-bottom:0}
.menu-item .mi-ico{width:48px;height:48px;border-radius:14px;background:var(--cream);color:var(--orange);display:grid;place-items:center}
.menu-item .mi-ico svg{width:26px;height:26px}
.menu-item b{display:block;font-size:1.2rem;font-weight:600;color:var(--white)}
.menu-item span{font-size:.85rem;color:var(--cream);opacity:.92}
.menu-foot{margin-top:auto}
.menu-foot .menu-item{border:0}
.menu-foot .mi-ico{background:transparent;color:var(--cream);border:2px solid var(--cream)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:999px;z-index:60;font-size:.95rem;max-width:90vw}

/* Editors */
.ed-h{font-size:1.5rem;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .wide{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.group{border-top:1px solid var(--line);padding-top:12px}
.tools{border:0;background:var(--bg);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tools legend{font-weight:500;padding:0 4px;float:left;width:100%;margin-bottom:4px}
.toolq{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.92rem}
.toolq input{width:64px;min-height:38px;padding:6px 8px;font:inherit;border-radius:10px;border:0;background:var(--yellow2);color:var(--ink)}
.tforms{display:grid;gap:10px}
.tform{border-radius:16px;padding:12px 14px;display:grid;gap:12px;background:var(--bg)}
.tform.open{background:var(--white);outline:2px solid var(--orange)}
.toolrows{display:grid;gap:10px}
.toolrow{display:grid;grid-template-columns:2fr 1fr auto auto;gap:10px;align-items:end;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:520px){.toolrow{grid-template-columns:1fr 90px}}
.rlist{display:grid}
.ritem{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.ritem .tile{width:44px;height:44px;border-radius:14px;background:var(--yellow2);color:var(--orange);display:grid;place-items:center;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:hsl(var(--h) 55% 45%)}
.impact{display:grid;gap:12px}
.impact h3{margin-bottom:6px}
.moved{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;justify-content:center}
.has-nav .savebar{bottom:78px}
.savebar-in{width:min(1100px,100%);margin:0 12px 8px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600;font-size:.95rem;background:var(--ink);color:var(--white);border-radius:20px;box-shadow:0 8px 24px rgba(57,23,19,.25)}
.savebar .btn.ghost{color:var(--yellow)}
.editor{padding-bottom:90px}

/* Timeline */
.timeline{position:relative;display:grid;grid-template-columns:60px minmax(740px,1fr);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.hours{position:relative;margin-top:30px}
.hr{position:absolute;left:0;right:0;font-size:.78rem;color:var(--muted);transform:translateY(-.6em)}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lane-h{height:30px;font-size:.88rem;font-weight:600;color:var(--orange-ink);display:flex;align-items:center}
.lane-body{position:relative;background:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 120px),var(--bg);border-radius:14px}
.blk{position:absolute;border-radius:12px;background:hsl(var(--h) 70% 93%);border-left:5px solid hsl(var(--h) 60% 42%);display:flex;flex-direction:column;overflow:hidden;color:var(--ink);box-shadow:0 1px 2px rgba(57,23,19,.12)}
.blk.bad{outline:3px solid var(--crit);outline-offset:-1px}
.blk.dragging{box-shadow:0 10px 24px rgba(57,23,19,.3);z-index:5}
.grip{flex:0 0 18px;border:0;background:hsl(var(--h) 55% 84%);cursor:grab;touch-action:none;font-size:.7rem;letter-spacing:2px;color:var(--ink);padding:0;line-height:18px}
.grip:active{cursor:grabbing}
.blk-body{flex:1;border:0;background:none;text-align:left;padding:2px 8px 4px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0;color:inherit;font:inherit}
.blk-time{font-size:.74rem;font-weight:700;color:var(--orange-ink)}
.blk-t{font-size:.8rem;line-height:1.15;overflow:hidden}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---- v4: view-instructions link, dashboard timeline ---- */
.vi{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;cursor:pointer;color:var(--orange-ink);font-weight:600;font-size:.92rem;justify-self:start;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.vi-ic{width:20px;height:20px;border-radius:50%;background:var(--orange);color:var(--white);display:grid;place-items:center;font-size:.95rem;line-height:1;text-decoration:none;font-weight:700}
.vi[aria-expanded="true"] .vi-ic{background:var(--ink)}
.seg button{display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:18px;height:18px}
.lanes.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.dash-tl{grid-template-columns:60px minmax(1040px,1fr)}
.tblk{position:absolute;border-radius:14px;background:var(--white);border:2px solid var(--yellow2);padding:8px 10px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 3px rgba(57,23,19,.08)}
.tblk.done{background:var(--bg);border-color:var(--line)}
.tblk.done .tblk-t{text-decoration:line-through;color:var(--muted)}
.tblk.inoven{border-color:var(--orange);background:var(--orange2)}
.tblk.late{border-color:var(--warn)}
.tblk-top{display:flex;align-items:center;gap:8px}
.tblk-t{font-weight:600;font-size:.98rem;line-height:1.2}
.tblk .tmeta{gap:4px}
.tblk .chip{font-size:.72rem;padding:2px 8px}
.tblk .vi{font-size:.84rem;padding:0}
.tblk .vi-ic{width:18px;height:18px}
.check.sm{width:28px;height:28px;border-radius:9px}
.check.sm svg{width:16px;height:16px}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--crit);z-index:4;pointer-events:none}
.nowline span{position:absolute;left:0;top:-11px;background:var(--crit);color:var(--white);font-size:.72rem;font-weight:700;padding:2px 6px;border-radius:999px}
.blk-t{overflow:visible;word-break:break-word}
.blk{overflow:visible}

/* ---- v5: centered link icon, single-column color-coded timeline ---- */
.vi-ic{width:20px;height:20px;border-radius:50%;background:var(--orange);color:var(--white);display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px;padding:0;line-height:0}
.vi-ic svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.85rem;color:var(--ink)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.agenda{list-style:none;margin:0;padding:0 0 0 26px;position:relative;display:grid;gap:10px}
.agenda::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.ag-hour{position:relative;font-weight:600;font-size:.95rem;color:var(--orange-ink);padding-top:6px}
.ag-hour::before{content:"";position:absolute;left:-23px;top:11px;width:12px;height:2px;background:var(--line)}
.ag-item{position:relative}
.ag-dot{position:absolute;left:-24px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--tc);border:3px solid var(--bg);box-sizing:content-box;transform:translateX(-3px)}
.ag-card{background:var(--white);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.ag-item.done .ag-card{background:var(--bg)}
.ag-item.done .ag-t{text-decoration:line-through;color:var(--muted)}
.ag-item.inoven .ag-card{background:var(--orange2)}
.ag-top{display:flex;align-items:center;gap:10px}
.ag-t{font-weight:600;font-size:1.05rem;line-height:1.25}
.chip.type{background:color-mix(in srgb, var(--tc) 16%, white);color:var(--ink)}
.chip.type::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc);margin-right:5px;vertical-align:1px}
.ag-now{position:relative;height:0;border-top:2px solid var(--crit);margin:10px 0 12px -26px}
.ag-now span{position:absolute;left:0;top:-12px;background:var(--crit);color:var(--white);font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px}

/* ---- v6: landing dishes, add dish, oven-first editor, Gantt timeline ---- */
.dishpick{display:grid;gap:8px;padding:2px 0 6px 0}
.dish{display:grid;grid-template-columns:22px 40px 1fr;gap:10px;align-items:center;background:var(--white);border:2px solid var(--yellow2);border-radius:14px;padding:8px 12px;cursor:pointer}
.dish input{width:20px;height:20px;accent-color:var(--orange)}
.dish .tile{width:40px;height:40px;border-radius:12px;background:var(--yellow2);color:var(--orange);display:grid;place-items:center;font-weight:700}
.dish b{display:block;font-weight:600}
.dish.on{border-color:var(--orange);background:var(--orange2)}
.dish.taken{opacity:.6;cursor:not-allowed}
.dish.add .tile{background:var(--orange);color:var(--white);font-size:1.3rem}
.seg.small button{padding:5px 12px;min-height:32px;font-size:.84rem}
.thinking{display:flex;align-items:center;gap:10px;background:var(--yellow2);border-radius:14px;padding:10px 14px;font-weight:500}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--orange2);border-top-color:var(--orange);animation:spin 1s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
.add-card textarea{min-height:220px}
.note-card{background:var(--orange2)}
.review-q{border:2px solid var(--yellow)}
.ovenfacts{display:flex;flex-wrap:wrap;gap:10px}
.ovenfact{background:var(--orange);color:var(--white);border-radius:16px;padding:10px 14px;display:grid;gap:2px;min-width:140px}
.ovenfact b{font-size:1.6rem;font-weight:700;line-height:1}
.ovenfact .sub{color:var(--cream)}
.oven-card{border:2px solid var(--orange)}
.oven-card h2{display:flex;align-items:center;gap:8px}
.h-ico{width:24px;height:24px;color:var(--orange)}
.ovenedit{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.ovenedit:first-of-type{border-top:0;padding-top:0}
.ovengrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.ovengrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.big-num{grid-column:span 1}
.unit-in{display:flex;align-items:center;gap:6px;background:var(--orange2);border-radius:13px;padding:4px 10px}
.unit-in input{background:transparent!important;font-size:1.5rem!important;font-weight:700!important;color:var(--orange-ink)!important;padding:4px 0!important;min-height:44px;width:100%;min-width:0}
.unit-in i{font-style:normal;font-weight:600;color:var(--muted)}
.advanced summary{display:flex;align-items:baseline;gap:12px;cursor:pointer;list-style:none;flex-wrap:wrap}
.advanced summary::-webkit-details-marker{display:none}
.advanced summary h2::before{content:"+ ";color:var(--orange)}
.advanced[open] summary h2::before{content:"− "}
.advanced[open] summary{margin-bottom:12px}
/* Gantt */
.g-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g-stats div{background:var(--bg);border-radius:12px;padding:8px 10px;display:grid;gap:2px}
.g-stats b{font-size:1rem;font-weight:700;color:var(--ink)}
.g-stats span{font-size:.75rem;color:var(--muted);line-height:1.2}
.gantt{position:relative}
.g-axis{position:relative;height:22px;border-bottom:1px solid var(--line);margin-bottom:6px}
.g-tick{position:absolute;bottom:4px;transform:translateX(-50%);font-size:.74rem;font-weight:600;color:var(--muted);white-space:nowrap}
.g-tick:first-child{transform:none}
.g-body{position:relative}
.g-gridlines{position:absolute;inset:0;pointer-events:none;z-index:0}
.g-grid{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--line)}
.g-now{position:absolute;top:-28px;bottom:0;width:0;border-left:2px solid var(--crit);z-index:3}
.g-now b{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--crit);color:var(--white);font-size:.68rem;padding:1px 6px;border-radius:999px;white-space:nowrap}
.g-dinner{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink);z-index:2}
.g-dinner b{position:absolute;bottom:-2px;right:4px;font-size:.7rem;background:var(--ink);color:var(--white);padding:1px 6px;border-radius:999px;white-space:nowrap}
.g-oven{position:relative;z-index:1;padding:6px 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.g-olabel{display:block;font-size:.78rem;font-weight:700;color:var(--orange-ink);margin-bottom:4px}
.g-otrack{position:relative}
.g-obar{position:absolute;height:13px;border-radius:5px;background:var(--orange);color:var(--white);font-size:.62rem;font-weight:700;line-height:13px;text-align:center;overflow:hidden;white-space:nowrap}
.g-obar.done{opacity:.45}
.g-obar.live{box-shadow:0 0 0 2px var(--yellow)}
.g-rows{list-style:none;margin:0;padding:0;position:relative;z-index:1}
.g-row{padding:6px 0 8px;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-head{display:flex;align-items:center;gap:8px}
.g-txt{flex:1;min-width:0;display:grid}
.g-title{font-weight:600;font-size:.95rem;line-height:1.2}
.g-meta{font-size:.78rem;color:var(--muted);line-height:1.25}
.g-vi{font-size:.8rem;flex:0 0 auto}
.g-vi .vi-ic{width:18px;height:18px;flex-basis:18px}
.g-track{position:relative;height:12px;margin-top:5px;background:transparent}
.g-bar{position:absolute;top:0;height:12px;border-radius:6px;background:color-mix(in srgb, var(--tc) 30%, white);border:2px solid var(--tc);box-sizing:border-box}
.g-row.done .g-bar{background:var(--tc)}
.g-row.done .g-title{text-decoration:line-through;color:var(--muted)}
.g-row.live .g-bar{background:repeating-linear-gradient(45deg,var(--tc) 0 4px,var(--orange2) 4px 8px)}
.g-row.late .g-bar{outline:2px dashed var(--warn);outline-offset:1px}

.ovengrid .bake{grid-column:span 2}
.unit-in input{flex:1 1 0}
.bake .unit-in input{max-width:5ch}

.import-steps li span{display:block;color:var(--muted);font-size:.92rem}
.import-steps .btns{margin-top:6px}
.import-steps .field{margin-top:6px}

/* ---- v8: plan assistant, change time ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chat-card{gap:14px}
.chat-log{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow-y:auto;padding:4px 2px}
.bubble{max-width:88%;border-radius:18px;padding:10px 14px;font-size:.98rem;line-height:1.4;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--orange);color:var(--white);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--yellow2);color:var(--ink);border-bottom-left-radius:6px}
.bubble.thinking{display:flex;align-items:center;gap:10px}
.chlist{margin:8px 0 0;padding-left:18px;display:grid;gap:3px;font-size:.88rem;white-space:normal}
.chat-log .chips .pick{text-align:left;white-space:normal;line-height:1.25}
.pending{background:var(--orange2);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;font:inherit;font-size:1rem;padding:10px 14px;border-radius:16px;border:0;background:var(--yellow2);color:var(--ink);resize:vertical;min-height:48px}
.composer textarea:focus{outline:2px solid var(--orange)}
.composer .btn{min-height:48px}
.tt .field select,.tt .field input{min-height:44px}

/* ---- v11: carry-over from Wednesday ---- */
.carry-h{color:var(--warn)}
.g-carry-h{font-size:.82rem;font-weight:700;color:var(--warn);padding:6px 0 2px;border-bottom:1px solid var(--line)}
.g-row.carry .g-bar{border-style:dashed}

.add-card .seg button{white-space:nowrap}

/* ---- v14: primary actions pinned to the bottom of the screen ---- */
body{--navh:0px}
body.has-nav{--navh:86px}
.actionbar{position:sticky;bottom:var(--navh);z-index:6;background:var(--white);margin:0 -18px -18px;padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-radius:0 0 var(--r) var(--r);box-shadow:0 -10px 16px -14px rgba(57,23,19,.35);display:grid;gap:10px}
.actionbar .formerr:empty{display:none}
.land .submit-row{position:sticky;bottom:0;z-index:6;background:var(--bg);margin:0 -24px;padding:10px 24px calc(16px + env(safe-area-inset-bottom));display:grid;justify-items:center;gap:6px;box-shadow:0 -10px 16px -14px rgba(57,23,19,.35)}
.land .submit-row .formerr{text-align:center}
.land .submit-row .formerr:empty{display:none}
.land .submit-row .btn.big{width:min(100%,360px)}
.dialog{max-height:calc(100dvh - 32px);overflow-y:auto}
.dialog > .btns:last-child{position:sticky;bottom:-22px;z-index:2;background:var(--white);margin:0 -22px -22px;padding:12px 22px 20px;box-shadow:0 -10px 16px -14px rgba(57,23,19,.35)}
.chat-card .actionbar .pending{margin:0}
/* v14b: let the pinned bar tuck under the nav's rounded top so nothing peeks through */
body.has-nav{--navh:calc(80px + env(safe-area-inset-bottom))}
body.has-nav .actionbar{bottom:calc(var(--navh) - 30px);padding-bottom:46px;border-radius:0}
/* ---- v15: strategy timeline, one row per dish ---- */
.t2-sum{display:grid;gap:6px}
.t2-sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.t2-sum-top b{font-size:1rem}
.t2-sum-top span{font-size:.85rem;color:var(--muted)}
.t2-legend .lg-done{background:#CFC4BE !important}
.t2-legend .lg-late{background:transparent !important;outline:2px dashed var(--crit);outline-offset:-2px}
.t2{--lab:0px;position:relative;margin-top:4px}
.t2-plot{position:absolute;top:0;bottom:0;left:var(--lab);right:0}
.t2-axis{position:relative;height:22px;border-bottom:1px solid var(--line)}
.t2-tick{position:absolute;bottom:4px;transform:translateX(-50%);font-size:.72rem;font-weight:600;color:var(--muted);white-space:nowrap}
.t2-tick:first-child{transform:none}
.t2-body{position:relative}
.t2-lines{position:absolute;inset:0;pointer-events:none}
.t2-grid{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.t2-past{position:absolute;top:0;bottom:0;left:0;background:rgba(57,23,19,.045)}
.t2-now{position:absolute;top:-24px;bottom:0;border-left:2px solid var(--crit);z-index:3}
.t2-now b{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--crit);color:#fff;font-size:.66rem;padding:1px 6px;border-radius:999px;white-space:nowrap}
.t2-dinner{position:absolute;top:0;bottom:0;border-left:2px dashed var(--ink);z-index:2}
.t2-dinner b{position:absolute;bottom:2px;right:4px;font-size:.68rem;background:var(--ink);color:#fff;padding:1px 6px;border-radius:999px;white-space:nowrap}
.t2-rows{list-style:none;margin:0;padding:0;position:relative;z-index:1}
.t2-row{padding:9px 0 10px;border-bottom:1px solid var(--line)}
.t2-row:last-child{border-bottom:0}
.t2-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.t2-name{font-weight:700;font-size:.98rem}
.t2-sub{font-size:.76rem;color:var(--muted)}
.t2-st{margin-left:auto;font-size:.76rem;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.t2-st svg{width:13px;height:13px}
.t2-st.done{color:var(--good)} .t2-st.live{color:var(--orange-ink)} .t2-st.late{color:var(--crit)}
.t2-row.alldone .t2-name{color:var(--muted)}
.t2-track{position:relative;margin-left:var(--lab)}
.t2-bar{position:absolute;height:14px;padding:0;border:0;border-radius:5px;background:var(--kc);color:#fff;font:700 .6rem/14px inherit;font-family:inherit;text-align:center;overflow:hidden;white-space:nowrap;cursor:pointer;box-sizing:border-box}
.t2-bar svg{width:10px;height:10px;vertical-align:-1px}
.t2-bar.done{background:#CFC4BE;color:#fff}
.t2-bar.live{background:repeating-linear-gradient(45deg,var(--kc) 0 5px,color-mix(in srgb,var(--kc) 55%,white) 5px 10px);box-shadow:0 0 0 2px var(--yellow)}
.t2-bar.late,.t2-bar.carry{outline:2px dashed var(--crit);outline-offset:1px}
.t2-bar.sel{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--ink);z-index:2}
.t2-bar:focus-visible{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--ink)}
.t2-cap{margin:8px 0 0 var(--lab);font-size:.8rem;background:var(--bg);border-radius:10px;padding:6px 10px;line-height:1.3}
.t2-hint{margin:8px 0 0;font-size:.78rem}
@media (min-width:720px){
  .t2{--lab:168px}
  .t2-row{display:block;position:relative}
  .t2-head{position:absolute;left:0;top:7px;width:calc(var(--lab) - 14px);display:grid;gap:1px;margin:0}
  .t2-st{margin-left:0}
  .t2-track{margin-top:2px;min-height:44px}
}
.t2-bar{height:18px;line-height:18px;font-size:.62rem;background:linear-gradient(to right,#CFC4BE var(--p),var(--kc) var(--p))}
.t2-bar.live{background:linear-gradient(to right,#CFC4BE var(--p),transparent var(--p)),repeating-linear-gradient(45deg,var(--kc) 0 5px,color-mix(in srgb,var(--kc) 55%,white) 5px 10px)}
.t2-bar.done{background:#CFC4BE}
.t2-cap span{display:block;color:var(--muted);margin-top:2px}
@media (max-width:719px){ .t2-tick.odd{display:none} }
.t2-gap{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(57,23,19,.07) 0 3px,transparent 3px 7px);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.t2-tick{font-size:.68rem}
@media (max-width:719px){ .t2-tick.odd{display:inline} }
.t2-bar.moved{background:transparent;border:2px dashed #B8ABA4}
.t2-legend .lg-moved{background:transparent !important;border:2px dashed #B8ABA4;box-sizing:border-box}
@media (min-width:720px){
  .t2-row{display:grid;grid-template-columns:var(--lab) 1fr;align-items:start}
  .t2-head{position:static;width:auto;padding-right:14px}
  .t2-track{margin:2px 0 0;min-height:18px}
  .t2-cap{grid-column:2;margin-left:0}
}
@media (min-width:720px){ .t2{--lab:196px} }
/* ---- v16: AI review step ---- */
.review{max-width:820px;margin:0 auto;padding-bottom:96px}
.thinking-row{display:flex;gap:12px;align-items:center}
.fitrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.cmp-day{display:grid;gap:4px}
.cmp-dh{display:flex;gap:8px;align-items:baseline}
.cmp{position:relative;--lab:52px}
.cmp .t2-axis .t2-plot{left:var(--lab)}
.cmp-row{display:grid;grid-template-columns:var(--lab) 1fr;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.cmp-row:last-child{border-bottom:0}
.cmp-l{font-size:.76rem;font-weight:600;color:var(--muted)}
.cmp-row .t2-track{margin:0}
.cmp .t2-bar{cursor:default}
.cmp-none{position:absolute;top:-1px;font-size:.76rem}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.citem{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px;background:var(--white)}
.citem.del{background:var(--bg)}
.citem.del b{text-decoration:line-through;color:var(--muted)}
.citem-h{display:flex;gap:8px;align-items:baseline}
.cbadge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:999px;flex:0 0 auto}
.cbadge.add{background:var(--good-soft);color:var(--good)}
.cbadge.chg{background:var(--yellow2);color:var(--ink)}
.cbadge.del{background:var(--crit-soft);color:var(--crit)}
.clines{margin:0;padding-left:18px;font-size:.88rem}
.cwhy{margin:0;font-size:.84rem;color:var(--muted);font-style:italic}
.cwhy::before{content:"Why: ";font-style:normal;font-weight:600}
.csteps summary{cursor:pointer;color:var(--orange-ink);font-weight:600;font-size:.86rem}
.csteps ol{margin:6px 0 0;padding-left:20px;font-size:.88rem}
.csteps ol.old{color:var(--muted);text-decoration:line-through}
.csteps .sub{margin:6px 0 0}
.cother{margin:14px 0 6px;font-size:1rem}

.rv-bar .btn{white-space:nowrap}
/* ---- v23: live status ---- */

@media (max-width:719px){
  .claimbar.taken,.claimbar.mine{display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:0;padding:6px 14px 6px 6px}

.chat-solo{max-width:760px;margin:0 auto}

.tt-link{align-items:flex-start;font-weight:600}
.tt-link .sub{display:block;font-weight:400;margin-top:2px}
.tt-link input{margin-top:2px}
.fgrid.tt{grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid.tt .wide{grid-column:1 / -1}
.fgrid.tt select,.fgrid.tt input[type=time]{min-width:0;width:100%}
/* ---- v29: suggested starts ---- */
.time.go{color:var(--good)}
.tmeta .time + .sub{font-size:.85rem}
.startbadge{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--ink);margin:4px 0 2px}
.startbadge svg{width:16px;height:16px;flex:0 0 16px}
.startbadge span{color:var(--muted)}
.startbadge.go{color:var(--good)}
.startbadge.go b{color:var(--good)}
.startbadge.go{background:var(--good-soft);border-radius:12px;padding:8px 12px;font-size:1rem;width:fit-content;max-width:100%}
.startbadge.go svg{width:18px;height:18px;flex-basis:18px}
.startbadge.go span{color:var(--good);opacity:.85}
/* ---- v30: asking someone, new jobs ---- */
.claimbar.asked{background:var(--yellow2);box-shadow:inset 0 0 0 1.5px var(--yellow);color:var(--ink)}
@media (max-width:719px){ .claimbar.asked{display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:0;padding:6px 14px 6px 6px} .claimbar.asked .avatar{grid-row:1 / span 2;align-self:center} }
.card.asked{box-shadow:0 0 0 3px var(--yellow);}
.job.ask{border-color:var(--yellow);background:#FFFBEA}

.pick-people,.pick-jobs{display:grid;gap:8px;max-height:55vh;overflow-y:auto}
.pperson,.pjob{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:var(--ink);background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-height:56px}

.pperson.on{border-color:var(--yellow);background:var(--yellow2)}

<script>
/* ============ DEFAULT PLAN ============ */
const FOIL = [
  "Foil pan lids usually aren't steam-tight, so crimp a layer of foil over the pan before putting the lid on.",
  "Set the pan on a sheet pan whenever it goes in or out of the oven. Flimsy foil full of hot liquid is risky to carry. You can reheat it in the same pan Thursday."
];
const S2 = (h,x) => ({h, x});
const DEFAULT_PLAN = {
  v: 2,
  stepsV: 2,
  dinner: '17:00',
  kitchen: {
    ovenSpots: 4,
    tools: [
      {id:'burnerGood', name:'Big burner', count:2},
      {id:'burnerTiny', name:'Small burner', count:2},
      {id:'bigPot', name:'Large stock pot', count:1},
      {id:'smallPot', name:'Small stock pot', count:2},
      {id:'bigSkillet', name:'Large skillet', count:1},
      {id:'smallSkillet', name:'Small skillet', count:1},
      {id:'ip', name:'Instant Pot', count:1},
      {id:'airfryer', name:'Air fryer', count:1}
    ]
  },
  recipeOrder: ['brisket','cider','pinwheels','beans','mash','veg','cornbread'],
  recipes: {
    brisket: {
      name:'Maple-tomato braised brisket', short:'Brisket',
      meta:['5-lb flat cut','Braise 275°F, 4½–6 hr (Wed)','Reheat 325°F, 35–45 min (Thu)'],
      notes:[...FOIL, 'Sear and deglaze in the large skillet, then move everything into the foil pan.'],
      ingredients:[
        {g:'Meat & dry rub', items:['1 (5-lb) first-cut (flat-cut) beef brisket, fat cap left intact','2½ tsp kosher salt','1½ tsp freshly ground black pepper','2 tsp smoked or sweet paprika','1½ tsp garlic powder','1 tsp onion powder','2 tbsp neutral high-heat oil (avocado, canola or grapeseed)']},
        {g:'Maple & tomato sauce', items:['1 can (15 oz) tomato sauce','1 can (6 oz) tomato paste','⅓ cup pure maple syrup (or dark brown sugar)','⅓ cup apple cider vinegar','2 tbsp Worcestershire sauce','1 tbsp Dijon mustard','1 tsp chili powder','¼ tsp ground allspice (try nutmeg instead)']},
        {g:'Aromatics & braising liquid', items:['2 large yellow or sweet onions, thinly sliced into rings','4 cloves garlic, smashed','1 cup dry red wine (Cabernet or Merlot) or apple cider','2–3 cups low-sodium beef broth','6 sprigs fresh thyme','3 sprigs fresh rosemary','2 dried bay leaves']}
      ],
      steps:[
        S2('Season and make the sauce','Preheat the oven to 275°F. Pat the brisket dry, mix the rub and rub it all over. Let it sit 20–30 minutes. Whisk all the sauce ingredients until smooth.'),
        S2('Sear','Heat the oil over medium-high in the large skillet until shimmering. Sear fat side down 4–5 minutes, flip and sear 3–4 minutes, then move to a platter.'),
        S2('Deglaze and build the braise','Lower to medium, cook the onions and garlic 3 minutes, pour in the wine and scrape up the browned bits. Move the onions to the foil pan, lay the brisket on top fat side up, pour the sauce over and tuck the herbs into the sides. Add broth around the edges (about 2 cups) so liquid comes ⅓–½ of the way up. Do not submerge it.'),
        S2('Braise low and slow','Seal tightly and braise at 275°F for 4½–6 hours. Start checking at 4½ hours: done when a fork slides into the thickest part with zero resistance and it reads 195–200°F. If it feels tight, re-cover and give it 30–45 more minutes.'),
        S2('Cool and chill overnight','Uncover so steam escapes and let it rest in the liquid 1 hour. Wrap the brisket and refrigerate. Strain the sauce (discard herb stems and bay leaves, keep the onions if you like) into a separate container and refrigerate.'),
        S2('Slice cold and reheat','Lift the solid fat off the gravy. Slice the cold brisket against the grain ¼ inch thick, shingle into the pan, pour the gravy over, cover tightly and bake at 325°F for 35–45 minutes until bubbling at the edges.')
      ]
    },
    cider: {
      name:'Persimmon spiced cider', short:'Cider',
      meta:['Makes 12 cups (6 servings)','Steep 20–30 min, never boil','Ready by 4:00 PM'],
      notes:['After it steeps, strain out the whole spices and hold it in the two small pots on the small burners at the lowest setting.'],
      ingredients:[
        {g:'Cider', items:['12 cups (3 quarts) unfiltered apple cider','3 ripe Fuyu persimmons, tops trimmed, halved crosswise (plus 1 extra, thinly sliced, for garnish)','2 tsp unsalted butter or coconut oil','1½ tbsp pure maple syrup, plus more to taste','3 whole cinnamon sticks, plus extra for serving','2 whole star anise pods','4–5 whole cloves','2 strips orange peel (no white pith)','¾ tsp vanilla bean paste or pure vanilla extract','1–1½ tbsp fresh lemon juice']},
        {g:'Liquor on the side', items:['Spiced pear liqueur, about 1 oz per mug','Bourbon, 1.5 oz per mug','Dark rum, 1.5 oz per mug']}
      ],
      steps:[
        S2('Caramelize the persimmons','Melt the butter and 1½ tbsp maple syrup in the large stock pot over medium heat. Sear the persimmon halves cut side down 4–5 minutes until deeply browned.'),
        S2('Add cider and spices','Pour in the cider. Add the cinnamon, star anise, cloves, orange peel and vanilla.'),
        S2('Steep gently','Bring just to a bare simmer, then turn to Low, cover and steep 20–30 minutes. Avoid boiling so the cloves and star anise don\'t turn bitter.'),
        S2('Balance and hold','Stir in the lemon juice and adjust sweetness with maple. Keep covered on the lowest setting.'),
        S2('Serve and spike to order','Ladle into mugs, garnish with persimmon slices and a cinnamon stick. Set bottles and a jigger beside the pot.')
      ]
    },
    pinwheels: {
      name:'Artichoke-Boursin pinwheels', short:'Pinwheels',
      meta:['24–28 pinwheels (serves 6)','Logs Thursday morning','Bake 425°F, 18–22 min, served with dinner'],
      notes:['Move the puff pastry to the fridge Wednesday night so it thaws overnight.'],
      ingredients:[
        {g:'Pinwheels', items:['1 box (18 oz) Trader Joe\'s All-Butter Puff Pastry (2 sheets), thawed in the fridge overnight','2 cans (14 oz each) artichoke hearts in water, drained, squeezed very dry, finely chopped','1 package (5.2 oz) Garlic & Fine Herbs Boursin, softened 20–30 min','4 oz cream cheese, softened','1 cup (about 4 oz) shredded Gruyère (or Swiss/fontina)','⅓ cup grated Parmesan','1 tsp lemon zest (about ½ lemon)','1 tsp fresh thyme leaves (or ½ tsp dried)','¼ tsp freshly ground black pepper (taste before adding salt)','1 large egg beaten with 1 tbsp water (egg wash)']},
        {g:'To finish', items:['Flaky salt','Hot honey, if using']}
      ],
      steps:[
        S2('Make the filling','Mash the Boursin and cream cheese until smooth. Stir in the artichokes, Gruyère, Parmesan, lemon zest, thyme and pepper. Taste and add salt only if needed.'),
        S2('Roll the logs','Line two rimmed baking sheets with parchment. Unroll one pastry sheet on a lightly floured surface, spread half the filling over it leaving a ½-inch bare border on one long edge, and brush that edge with egg wash. Roll up snugly from the opposite long edge and press the seam. Repeat.'),
        S2('Chill','Wrap both logs seam side down and refrigerate at least 30 minutes (up to 24 hours).'),
        S2('Slice and bake','Slice the cold logs into ¾-inch rounds, set 1 inch apart on the parchment, brush edges with egg wash. Bake on the upper-middle rack at 425°F for 18–22 minutes (check at 16), rotating halfway, until puffed and deeply golden.'),
        S2('Serve','Cool on the pan 5 minutes. Finish with flaky salt and a drizzle of hot honey, if using.')
      ]
    },
    beans: {
      name:'Brown butter green beans with crispy leeks', short:'Green beans',
      meta:['Serves 6–8','Morning prep Thursday','Finish in 8 minutes at 4:47 PM'],
      notes:['Leave the fried leeks uncovered (or loosely tented with a dry paper towel) at room temperature so they stay crisp.'],
      ingredients:[
        {g:'Crispy leeks', items:['2 medium leeks, white and light green parts only','½ cup neutral oil','Flaky sea salt']},
        {g:'Green beans', items:['2 lbs fresh green beans, stem ends trimmed','Kosher salt','3 tbsp unsalted butter','4 cloves garlic, thinly sliced or minced','½ tsp freshly cracked black pepper','1 large lemon (zest of half, plus 1½–2 tbsp juice)']}
      ],
      steps:[
        S2('Slice and wash the leeks','Halve lengthwise, slice into ⅛-inch half-moons, swish in cold water, lift out and pat completely dry.'),
        S2('Fry the leeks','Add the oil and leeks to a skillet over medium heat. Fry 5–7 minutes until pale golden and crisp, pulling them just before they look fully browned.'),
        S2('Drain and store','Paper-towel-lined plate, flaky salt right away, leave uncovered at room temperature.'),
        S2('Blanch and shock','Boil a large pot of generously salted water with an ice bath beside it. Cook the beans 3–4 minutes until bright green and crisp-tender, then ice them 2 minutes.'),
        S2('Chill','Drain, pat dry and refrigerate in a container lined with paper towel.'),
        S2('Brown the butter (right before dinner)','Large skillet, medium heat, 3 tbsp butter, 2–3 minutes until golden and nutty.'),
        S2('Bloom the garlic','Lower to medium-low, add the garlic and stir 30–45 seconds.'),
        S2('Glaze the beans','Add the beans, ½ tsp kosher salt and ½ tsp pepper. Toss 2–3 minutes until hot.'),
        S2('Finish','Off the heat, toss in the lemon juice and zest. Platter, spoon over the brown butter, pile on the leeks.')
      ]
    },
    mash: {
      name:'Garlic-buttermilk mashed potatoes', short:'Mashed potatoes',
      meta:['Serves 6','Garlic confit Wednesday','Hold on Keep Warm in the Instant Pot'],
      notes:['You\'re making garlic confit Wednesday, so skip sautéing jarred garlic: just warm the confit with the butter and thyme.','If the mash stiffens while it holds, loosen it with a splash of buttermilk before serving.'],
      ingredients:[
        {g:'Mash', items:['6 medium-large russet potatoes (3½–4 lbs), scrubbed and quartered (peeled if you prefer)','1½ cups buttermilk, room temperature','½ cup crème fraîche, room temperature','½ cup Greek yogurt (or 1 cup crème fraîche total)','6–7 tbsp unsalted butter, room temperature','Garlic confit (in place of 10–12 tbsp jarred minced garlic)','1 tbsp fresh thyme leaves (less if lemon thyme)','¾ container fresh chives, finely chopped','Kosher salt and black pepper']}
      ],
      steps:[
        S2('Temper the dairy','Take the buttermilk, crème fraîche, yogurt and butter out 30–45 minutes before cooking.'),
        S2('Boil the potatoes','Cover with cold, generously salted water by 1 inch. Boil, then gently boil 17–20 minutes until completely fork-tender. Drain and steam dry 1–2 minutes.'),
        S2('Warm the garlic and thyme','Instant Pot on Sauté, melt 2 tbsp butter, add the garlic confit and thyme for about a minute.'),
        S2('Warm the buttermilk gently','Switch to Keep Warm (or off) before adding the buttermilk so it doesn\'t curdle.'),
        S2('Mash','Add the potatoes and mash until smooth. Don\'t over-mash.'),
        S2('Fold in the richness','Add the remaining butter, crème fraîche, yogurt, salt and pepper. Fold until creamy. Hold on Keep Warm with the lid ajar.'),
        S2('Finish','Taste, adjust salt and pepper, fold in the chives right before serving.')
      ]
    },
    veg: {
      name:'Roasted squash, pancetta & crispy Brussels sprouts', short:'Squash & sprouts',
      meta:['Serves 4','425°F, 38–40 min, two pans','Starts 4:15 PM'],
      notes:['Racks: vegetables on one rack, pinwheels on the upper-middle rack. From 4:33 to 4:50 the oven holds all four sheet pans.'],
      ingredients:[
        {g:'Pan 1: squash, onion & pancetta', items:['1 large butternut squash, peeled, ~1-inch cubes','1 large red onion, cut into wedges','4 oz pancetta, ¼–½ inch pieces','1 tbsp fresh thyme, finely chopped','1–1½ tbsp olive oil','Salt and black pepper']},
        {g:'Pan 2: crispy Brussels sprouts', items:['1 lb Brussels sprouts, bone-dry, trimmed, halved (quartered if jumbo), loose leaves saved','1½–2 tbsp olive oil','Salt and black pepper']},
        {g:'Maple-vinegar finishing sauce', items:['1 tbsp maple syrup','1 tbsp apple cider vinegar','½ tsp salt']}
      ],
      steps:[
        S2('Preheat the second pan','With the oven at 425°F, slide in an empty rimmed sheet pan.'),
        S2('Pan 1 in (minute 0)','Toss squash and onion with oil, salt and pepper on an unheated pan, single layer, scatter pancetta and thyme. Roast.'),
        S2('Toss the sprouts','Make sure they\'re completely dry, then toss with oil, salt and pepper in a bowl until every leaf is coated.'),
        S2('Pan 2 in (minute 15)','Arrange the sprouts cut side down on the hot pan, loose leaves in the gaps. Roast undisturbed 15–18 minutes.'),
        S2('Flip and pull Pan 1 (minute 30–38)','Flip the sprouts and roast 5–7 more minutes. Pull Pan 1 when the squash is tender and the pancetta crisp.'),
        S2('Sauce and serve (minute 38–40)','Pull the sprouts when deeply browned. Combine both pans, drizzle the maple-vinegar sauce, toss gently and serve.')
      ]
    },
    cornbread: {
      name:'Pumpkin cornbread', short:'Cornbread',
      meta:['350°F, 45 min','Bake Thursday morning','Serve room temp or warmed'],
      notes:['Store it wrapped on the counter, not in the fridge, which dries cornbread out.'],

  tasks: [
    // ---------- WEDNESDAY ----------
    {id:'w-rub', day:'wed', t:'09:30', dur:5, r:'brisket', who:'h', from:['wed','08:00'], for:{id:'w-season', before:0},
     title:'Mix the brisket dry rub',
     steps:["In a small bowl, combine 2½ tsp kosher salt, 1½ tsp freshly ground black pepper, 2 tsp smoked or sweet paprika, 1½ tsp garlic powder and 1 tsp onion powder.", "Stir and set the bowl next to the stove."]},
    {id:'w-aromatics', day:'wed', t:'09:40', dur:10, r:'brisket', who:'h', from:['wed','08:00'], for:{id:'w-sear', before:0},
     title:'Slice onions and smash garlic for the brisket',
     steps:["Peel 2 large yellow or sweet onions and slice them thinly into rings.", "Smash 4 garlic cloves with the flat of a knife and peel off the skins.", "Gather 6 thyme sprigs, 3 rosemary sprigs and 2 dried bay leaves.", "Put everything in one bowl next to the stove."]},
    {id:'w-season', day:'wed', t:'10:00', dur:30, r:'brisket', who:'mm',
     title:'Season the brisket and whisk the sauce',
     steps:["Preheat the oven to 275°F.", "Pat the 5-lb brisket dry with paper towels.", "Rub the dry rub all over it: 2½ tsp kosher salt, 1½ tsp black pepper, 2 tsp paprika, 1½ tsp garlic powder and 1 tsp onion powder (a helper may have mixed this already).", "Let it sit on the counter 20–30 minutes.", "Meanwhile, whisk the sauce in a bowl until smooth: 1 can (15 oz) tomato sauce, 1 can (6 oz) tomato paste, ⅓ cup pure maple syrup (or dark brown sugar), ⅓ cup apple cider vinegar, 2 tbsp Worcestershire sauce, 1 tbsp Dijon mustard, 1 tsp chili powder and ¼ tsp ground allspice (or nutmeg)."]},
    {id:'w-sear', day:'wed', t:'10:30', dur:15, r:'brisket', who:'mm', uses:{bigSkillet:1, burnerGood:1}, needs:['w-season'],
     title:'Sear the brisket and build the braise',
     steps:["Heat 2 tbsp neutral high-heat oil (avocado, canola or grapeseed) in the large skillet over medium-high until shimmering.", "Sear the brisket fat side down 4–5 min, flip and sear 3–4 min, then move it to a platter. If it won't lie flat, cut it in half to sear.", "Lower the heat to medium. Add the 2 sliced onions and 4 smashed garlic cloves and cook 3 min.", "Pour in 1 cup dry red wine (Cabernet or Merlot) or apple cider and scrape up the browned bits.", "Spread the onions and garlic in the foil pan. Lay the brisket on top, fat side up. Pour the maple-tomato sauce over it and tuck 6 thyme sprigs, 3 rosemary sprigs and 2 bay leaves into the sides.", "Pour about 2 cups low-sodium beef broth around the edges, not over the top, so the liquid comes ⅓–½ of the way up the brisket. Don't submerge it. Add up to 1 more cup if needed."],
     notes:FOIL},
    {id:'w-braise', day:'wed', t:'10:45', dur:270, r:'brisket', who:'mm', needs:['w-sear'],
     oven:{temp:275, slots:1, min:270, max:360, check:'Fork slides in with zero resistance, 195–200°F. If it feels tight, cover and give it 30–45 more minutes.'},
     title:'Braise the brisket',
     steps:["Crimp a layer of foil tightly over the pan, then put the lid on.", "Set the pan on a sheet pan and slide it into the 275°F oven.", "Braise 4½–6 hours. Start checking at 4½ hours: a fork should slide into the thickest part with zero resistance, and it should read 195–200°F.", "When it's done, take it out on its sheet pan, remove the lid and foil, and let it rest in its liquid for 1 hour so the steam escapes."],
     out:['Uncover so steam escapes and let it rest in the liquid for 1 hour.'], notes:FOIL},
    {id:'w-peelgarlic', day:'wed', t:'10:45', dur:15, r:'mash', who:'h', from:['wed','08:00'], for:{id:'w-confit', before:0},
     title:'Peel garlic for the confit',
     steps:["Break about 3 heads of garlic into cloves and peel every clove.", "Trim off any hard root ends.", "Put them in a small bowl next to the stove."]},
    {id:'w-confit', day:'wed', t:'11:00', dur:45, r:'mash', who:'mm', uses:{smallPot:1, burnerTiny:1},
     title:'Make the garlic confit',
     steps:["Put the peeled garlic cloves (about 3 heads) in a small pot and pour in enough olive oil to cover them completely.", "Set it on a small burner at the lowest heat for 30–45 min, until the cloves are soft and golden. The oil should barely bubble. Turn it down if it sizzles.", "Let it cool, then refrigerate the cloves in their oil in a covered jar. Garlic in oil must stay in the fridge."]},
    {id:'w-squash', day:'wed', t:'11:30', dur:20, r:'veg', who:'h', from:['wed','09:00'], for:{id:'t-pan1toss', before:10},
     title:'Peel and cube the butternut squash',
     steps:["Peel 1 large butternut squash with a vegetable peeler.", "Cut off both ends, halve it lengthwise and scoop out the seeds.", "Cut into cubes about 1 inch across.", "Store in a covered container in the fridge labeled \"squash\"."]},
    {id:'w-onionpancetta', day:'wed', t:'12:00', dur:10, r:'veg', who:'h', from:['wed','09:00'], for:{id:'t-pan1toss', before:10},
     title:'Cut the red onion wedges and dice the pancetta',
     steps:["Cut 1 large red onion into wedges, keeping a little root on each so they hold together.", "Cut 4 oz pancetta into ¼–½ inch pieces.", "Store each in its own covered container in the fridge."]},
    {id:'w-sprouts', day:'wed', t:'12:15', dur:20, r:'veg', who:'h', from:['wed','09:00'], for:{id:'t-pinslice', before:5},
     title:'Trim and halve the Brussels sprouts',
     steps:["Trim the tough brown stem ends off 1 lb of sprouts.", "Halve small and medium ones; quarter any jumbo ones.", "Save the loose outer leaves. They get crispy.", "Pat everything completely dry. Wet sprouts won't crisp.", "Store in a container lined with paper towels in the fridge."]},
    {id:'w-beans', day:'wed', t:'13:00', dur:15, r:'beans', who:'h', from:['wed','09:00'], for:{id:'t-blanch', before:0},
     title:'Trim the green beans',
     steps:["Snap or cut the stem ends off 2 lbs green beans.", "Rinse, dry, and refrigerate in a bag."]},
    {id:'w-ciderkit', day:'wed', t:'13:15', dur:5, r:'cider', who:'h', from:['wed','09:00'], for:{id:'t-ciderbrew', before:0},
     title:'Cut orange peel and measure the cider spices',
     steps:["Peel 2 strips of orange peel with a vegetable peeler and scrape off any white pith.", "In a small bowl: 3 cinnamon sticks, 2 star anise pods and 4–5 whole cloves. Add the peel.", "Cover and refrigerate."]},
    {id:'w-scrub', day:'wed', t:'13:20', dur:5, r:'mash', who:'h', from:['wed','09:00'], for:{id:'t-potatoes', before:30},
     title:'Scrub the potatoes',
     steps:["Scrub 6 medium-large russet potatoes under running water.", "Dry them and leave them on the counter."]},
    {id:'w-wrap', day:'wed', t:'16:15', dur:15, r:'brisket', who:'mm', after:{id:'w-braise', offset:60}, needs:['w-braise'],
     title:'Wrap the brisket and strain the gravy',
     steps:["Lift the rested brisket out of the liquid. Wrap it tightly in foil (or put it in a covered container) and refrigerate.", "Strain the braising liquid into a separate container. Throw away the herb stems and bay leaves; keep the onions if you like. Refrigerate overnight. This is Thursday's gravy."]},
    {id:'w-pastry', day:'wed', t:'21:00', dur:1, r:'pinwheels', who:'mm',
     title:'Move the puff pastry to the fridge',
     steps:["Move the box of Trader Joe's All-Butter Puff Pastry (18 oz, 2 sheets) from the freezer to the fridge so it thaws overnight."]},

    // ---------- THURSDAY MORNING ----------
    {id:'t-cbmix', day:'thu', t:'08:30', dur:15, r:'cornbread', who:'mm',
     title:'Preheat to 350°F and mix the cornbread',
     steps:["Preheat the oven to 350°F and grease the baking pan the box calls for.", "Make the Trader Joe's cornbread batter following the directions on the box (it lists the eggs, milk and butter to add).", "Stir in ½ can of canned pumpkin purée (half a 15-oz can, a scant 1 cup).", "Pour the batter into the greased pan."]},
    {id:'t-soften', day:'thu', t:'08:30', dur:2, r:'pinwheels', who:'h', from:['thu','07:30'], for:{id:'t-logs', before:30},
     title:'Set out the Boursin and cream cheese to soften',
     steps:["Take the Boursin (5.2 oz) and 4 oz cream cheese out of the fridge.", "Leave them unwrapped on the counter. They need 20–30 minutes."]},
    {id:'t-icebath', day:'thu', t:'08:40', dur:3, r:'beans', who:'h', from:['thu','07:30'], for:{id:'t-blanch', before:-10},
     title:'Set up the ice bath for the green beans',
     steps:["Fill a large bowl with ice and cold water.", "Set it right next to the stove."]},
    {id:'t-cbbake', day:'thu', t:'08:45', dur:45, r:'cornbread', who:'mm', needs:['t-cbmix'],
     oven:{temp:350, slots:1, min:45, max:50, check:'45 minutes, longer than the box says.'},
     title:'Bake the cornbread',
     steps:["Bake on the middle rack at 350°F for 45 minutes, longer than the box says.", "It's done when a toothpick in the center comes out clean.", "Cool it on the counter, then wrap it once it's completely cool."],
     out:['Cool on the counter. Wrap once cool. Don\'t refrigerate.']},
    {id:'t-leekprep', day:'thu', t:'08:45', dur:10, r:'beans', who:'h', from:['thu','07:30'], for:{id:'t-leeks', before:5},
     title:'Slice and wash the leeks',
     steps:["Use only the white and light green parts of 2 leeks.", "Halve them lengthwise, then slice crosswise into thin half-moons (about ⅛ inch).", "Swish them in a bowl of cold water to loosen the dirt.", "Lift them out onto a clean towel and pat completely dry."]},
    {id:'t-blanch', day:'thu', t:'08:45', dur:25, r:'beans', who:'mm', uses:{bigPot:1, burnerGood:1},
     title:'Blanch and chill the green beans',
     steps:["Fill the large stock pot with water, salt it generously (about 2 tbsp kosher salt) and bring to a boil.", "Add the 2 lbs trimmed green beans and cook 3–4 min until bright green and crisp-tender.", "Move them straight into the ice bath for 2 minutes.", "Drain, pat dry, and refrigerate in a container lined with paper towel."]},
    {id:'t-artichokes', day:'thu', t:'09:00', dur:10, r:'pinwheels', who:'h', from:['thu','07:30'], for:{id:'t-logs', before:0},
     title:'Drain, squeeze and chop the artichokes',
     steps:["Drain 2 cans (14 oz each) of artichoke hearts.", "Squeeze them very dry in a clean towel. Really wring them out.", "Chop finely and put them in a bowl."]},
    {id:'t-pinmise', day:'thu', t:'09:05', dur:10, r:'pinwheels', who:'h', from:['thu','07:30'], for:{id:'t-logs', before:0},
     title:'Grate the cheeses, zest the lemon, make the egg wash',
     steps:["Shred 1 cup (about 4 oz) Gruyère (or Swiss or fontina).", "Grate ⅓ cup Parmesan.", "Zest ½ lemon to get 1 tsp zest, and pick 1 tsp fresh thyme leaves (or use ½ tsp dried).", "Beat 1 large egg with 1 tbsp water in a small bowl for the egg wash.", "Set it all next to the softened cheeses."]},
    {id:'t-parchment', day:'thu', t:'09:10', dur:3, r:'pinwheels', who:'h', from:['thu','07:30'], for:{id:'t-logs', before:0},
     title:'Line two baking sheets with parchment',
     steps:["Line two rimmed baking sheets with parchment paper.", "Set them aside for the pinwheels."]},
    {id:'t-leeks', day:'thu', t:'09:15', dur:15, r:'beans', who:'mm', uses:{bigSkillet:1, burnerGood:1},
     title:'Fry the crispy leeks',
     steps:["Put ½ cup neutral oil and the sliced, dried leeks (2 medium) in the large skillet over medium heat.", "Fry 5–7 min, stirring now and then, until pale golden and crisp. Pull them just before they look fully browned, because they keep darkening.", "Lift onto a paper-towel-lined plate and sprinkle with flaky sea salt right away.", "Leave uncovered at room temperature until dinner."]},
    {id:'t-logs', day:'thu', t:'09:30', dur:30, r:'pinwheels', who:'mm',
     title:'Make the pinwheel logs',
     steps:["In a bowl, mash the softened Boursin (5.2 oz, Garlic & Fine Herbs) and 4 oz cream cheese until smooth.", "Stir in the chopped artichokes (2 cans), 1 cup shredded Gruyère, ⅓ cup grated Parmesan, 1 tsp lemon zest, 1 tsp thyme leaves and ¼ tsp black pepper. Taste and add salt only if needed.", "Lightly flour the counter and unroll one puff pastry sheet. Spread half the filling over it, leaving a ½-inch bare border along one long edge.", "Brush that border with egg wash, then roll up snugly from the opposite long edge and press the seam closed.", "Repeat with the second sheet and the rest of the filling.", "Wrap both logs and refrigerate them seam side down, at least 30 minutes and up to 24 hours.", "Keep the leftover egg wash covered in the fridge for baking."]},
    {id:'t-amclean', day:'thu', t:'10:00', dur:15, r:'general', who:'h', from:['thu','09:30'], for:{id:'t-ciderbrew', before:60},
     title:'Wash the morning dishes',
     steps:["Wash the large stock pot, ice bath bowl, cutting boards and knives.", "Leave the leek skillet and its oil for Bethany.", "Put the large stock pot back on the stove for the cider."]},

    // ---------- THURSDAY AFTERNOON ----------
    {id:'t-quarter', day:'thu', t:'14:00', dur:10, r:'mash', who:'h', from:['thu','13:00'], for:{id:'t-potatoes', before:5},
     title:'Quarter the potatoes',
     steps:["Cut the 6 scrubbed russet potatoes into quarters.", "Leave the skins on unless Bethany says to peel.", "Put them in a bowl next to the stove."]},
    {id:'t-thyme', day:'thu', t:'14:10', dur:5, r:'veg', who:'h', from:['thu','12:00'], for:{id:'t-mash', before:5},
     title:'Pick and chop the thyme',
     steps:["Pick 1 tbsp thyme leaves into a small bowl labeled \"mash\".", "Finely chop another 1 tbsp into a second bowl labeled \"squash\"."]},
    {id:'t-lemongarlic', day:'thu', t:'14:20', dur:8, r:'beans', who:'h', from:['thu','12:00'], for:{id:'t-beansfin', before:7},
     title:'Zest and juice the lemon, slice the garlic',
     steps:["Zest half a large lemon, then juice it to get 1½–2 tbsp juice.", "Thinly slice 4 garlic cloves.", "Put them in small bowls next to the stove."]},
    {id:'t-maple', day:'thu', t:'14:30', dur:3, r:'veg', who:'h', from:['thu','12:00'], for:{id:'t-combine', before:8},
     title:'Whisk the maple-vinegar sauce',
     steps:["Whisk 1 tbsp maple syrup, 1 tbsp apple cider vinegar and ½ tsp salt in a small bowl.", "Set it next to the oven."]},
    {id:'t-ciderbrew', day:'thu', t:'14:30', dur:20, r:'cider', who:'mm', uses:{bigPot:1, burnerGood:1},
     title:'Start the cider',
     steps:["In the large stock pot over medium heat, melt 2 tsp unsalted butter (or coconut oil) with 1½ tbsp pure maple syrup.", "Add 3 halved Fuyu persimmons cut side down and sear 4–5 min until deeply browned.", "Pour in 12 cups (3 quarts) unfiltered apple cider.", "Add the spice bowl (3 cinnamon sticks, 2 star anise pods, 4–5 whole cloves and 2 strips orange peel) and ¾ tsp vanilla bean paste or pure vanilla extract.", "Bring it just to a bare simmer. Don't let it boil."]},
    {id:'t-chives', day:'thu', t:'14:40', dur:5, r:'mash', who:'h', from:['thu','14:00'], for:{id:'t-mashfin', before:5},
     title:'Chop the chives',
     steps:["Finely chop about ¾ of the container of fresh chives.", "Put them in a small bowl next to the Instant Pot."]},
    {id:'t-ciderstep', day:'thu', t:'14:50', dur:25, r:'cider', who:'mm', uses:{bigPot:1, burnerGood:1}, needs:['t-ciderbrew'],
     title:'Steep the cider',
     steps:["Turn the heat to Low, cover and steep 20–30 min.", "Don't let it boil, or the cloves and star anise turn bitter."]},
    {id:'t-slice', day:'thu', t:'15:00', dur:20, r:'brisket', who:'mm',
     title:'Preheat to 325°F, skim and slice the brisket',
     steps:["Preheat the oven to 325°F.", "Lift the solid white fat off the top of the chilled gravy and throw it away.", "Slice the cold brisket against the grain, ¼ inch thick.", "Shingle the slices into the foil pan and pour the skimmed gravy over them.", "Crimp a layer of foil over the pan, then put the lid on."],
     notes:FOIL},
    {id:'t-reheat', day:'thu', t:'15:20', dur:35, r:'brisket', who:'mm', needs:['t-slice'],
     oven:{temp:325, slots:1, min:35, max:45, check:'Heated through and bubbling around the edges.'},
     title:'Reheat the brisket',
     steps:["Set the covered foil pan on a sheet pan and slide it into the 325°F oven.", "Bake 35–45 minutes, until it's bubbling at the edges."],
     out:['Keep the foil and lid on while the oven heats to 425°F.'], notes:FOIL},
    {id:'t-ciderfin', day:'thu', t:'15:20', dur:10, r:'cider', who:'mm', uses:{smallPot:2, burnerTiny:2}, needs:['t-ciderstep'],
     title:'Finish the cider and move it to the small pots',
     steps:["Stir in 1–1½ tbsp fresh lemon juice. Taste and add more maple syrup if it needs sweetness.", "Strain out the whole spices so the long hold doesn't turn bitter.", "Split the cider between the two small pots. Cover them and keep them on the small burners at the lowest setting."]},
    {id:'t-dairy', day:'thu', t:'15:20', dur:3, r:'mash', who:'h', from:['thu','15:00'], for:{id:'t-mash', before:35},
     title:'Set out the dairy and garlic confit',
     steps:["Take out the buttermilk (1½ cups), crème fraîche (½ cup), Greek yogurt (½ cup), 6–7 tbsp butter and the garlic confit.", "Leave them on the counter by the Instant Pot."]},
    {id:'t-rinse', day:'thu', t:'15:22', dur:3, r:'mash', who:'h', from:['thu','15:15'], for:{id:'t-potatoes', before:0},
     title:'Rinse the large stock pot',
     steps:["Once Bethany has moved the cider out, rinse the large stock pot.", "Put it back on the big burner for the potatoes."]},
    {id:'t-potatoes', day:'thu', t:'15:25', dur:40, r:'mash', who:'mm', uses:{bigPot:1, burnerGood:1},
     title:'Boil the potatoes',
     steps:["Put the quartered potatoes in the large stock pot and cover them by 1 inch with cold water. Salt it generously (about 2 tbsp kosher salt).", "Bring to a boil on high, then lower to a gentle boil for 17–20 min, until a fork slides in with no resistance."]},
    {id:'t-station', day:'thu', t:'15:30', dur:10, r:'cider', who:'h', from:['thu','15:00'], due:['thu','15:55'],
     title:'Set up the cider station',
     steps:["Set out mugs and a ladle by the cider pots.", "Thinly slice 1 Fuyu persimmon for garnish and set out extra cinnamon sticks.", "Set out the spiced pear liqueur, bourbon, dark rum and a jigger."]},
    {id:'t-pmclean', day:'thu', t:'15:45', dur:10, r:'general', who:'h', from:['thu','15:30'], for:{id:'t-pinslice', before:5},
     title:'Clear counters and set out serving dishes',
     steps:["Wash prep bowls and cutting boards.", "Set out a platter for the green beans, a large bowl for the squash and sprouts, a bowl for the mash and a basket for the cornbread."]},
    {id:'t-mash', day:'thu', t:'16:05', dur:15, r:'mash', who:'mm', uses:{ip:1}, needs:['t-potatoes'],
     title:'Drain and mash the potatoes',
     steps:["Drain the potatoes and let them steam dry in the colander for 1–2 minutes.", "Set the Instant Pot to Sauté. Melt 2 tbsp butter, then add all the garlic confit cloves and 1 tbsp thyme leaves (the bowl labeled \"mash\"). Stir about 1 minute.", "Switch to Keep Warm (or off) so the buttermilk doesn't curdle. Pour in the room-temperature buttermilk (1½ cups), holding back a splash.", "Add the potatoes and mash until smooth. Don't over-mash.", "Fold in the rest of the butter (4–5 tbsp), ½ cup crème fraîche and ½ cup Greek yogurt, then salt and pepper to taste.", "Leave it on Keep Warm with the lid ajar."]},
    {id:'t-up425', day:'thu', t:'16:05', dur:2, r:'veg', who:'mm', needs:['t-reheat'],
     title:'Turn the oven up to 425°F',
     steps:["Take the brisket out on its sheet pan if it isn't out already. Leave the foil and lid on so it stays hot.", "Set the oven to 425°F and slide in an empty rimmed sheet pan to heat for the Brussels sprouts."]},
    {id:'t-pan1toss', day:'thu', t:'16:10', dur:5, r:'veg', who:'mm',
     title:'Toss Pan 1',
     steps:["On an unheated rimmed sheet pan, toss the cubed butternut squash and red onion wedges with 1–1½ tbsp olive oil, plus salt and pepper.", "Spread it in a single layer. Scatter the 4 oz diced pancetta over it and sprinkle on 1 tbsp chopped thyme (the bowl labeled \"squash\")."]},
    {id:'t-pan1', day:'thu', t:'16:15', dur:35, r:'veg', who:'mm', needs:['t-pan1toss','t-up425'],
     oven:{temp:425, slots:1, min:35, max:38, check:'Squash fork-tender, pancetta crisp.'},
     title:'Roast Pan 1: squash, onion and pancetta',
     steps:["Slide Pan 1 into the 425°F oven and roast about 30–38 minutes."], out:['Set aside for combining with the sprouts.']},
    {id:'t-pinslice', day:'thu', t:'16:25', dur:8, r:'pinwheels', who:'mm', needs:['t-logs'],
     title:'Slice the pinwheels',
     steps:["Slice the cold pinwheel logs into ¾-inch rounds.", "Arrange them 1 inch apart on the two parchment-lined baking sheets.", "Brush the edges with the leftover egg wash.", "While you're at it, make sure the Brussels sprouts (1 lb, trimmed and halved) are completely dry, then toss them and their loose leaves in a bowl with 1½–2 tbsp olive oil, salt and pepper until every leaf is coated."]},
    {id:'t-sprouts', day:'thu', t:'16:30', dur:23, r:'veg', who:'mm', needs:['t-up425'],
     oven:{temp:425, slots:1, min:23, max:25, mid:{at:15, label:'Flip the Brussels sprouts'}, check:'Deeply browned outside, tender all the way through.'},
     title:'Roast Pan 2: Brussels sprouts',
     steps:["Pull out the hot empty sheet pan. Arrange the oiled sprouts cut side down, with the loose leaves in the gaps.", "Roast at 425°F undisturbed for 15–18 min, then flip them and roast 5–7 min more."]},
    {id:'t-pinwheels', day:'thu', t:'16:33', dur:18, r:'pinwheels', who:'mm', needs:['t-pinslice'],
     oven:{temp:425, slots:2, min:18, max:22, mid:{at:9, label:'Rotate the pinwheel pans'}, check:'Puffed, crisp and deeply golden. Start checking at 16 minutes.'},
     title:'Bake the pinwheels',
     steps:["Put both pans of pinwheels on the upper-middle rack of the 425°F oven.", "Bake 18–22 minutes, rotating the pans halfway through. Start checking at 16 minutes.", "Let them cool on the pan for 5 minutes, then sprinkle with flaky salt and drizzle with hot honey, if using."],
     out:['Cool on the pan 5 minutes.','Flaky salt and a drizzle of hot honey, if using.']},
    {id:'t-cbwarm', day:'thu', t:'16:35', dur:3, r:'cornbread', who:'mm', uses:{airfryer:1}, optional:true,
     title:'Warm the cornbread (optional)',
     steps:["Warm the cornbread in the air fryer at 325°F for 2–3 minutes.", "Wrap it in a towel to keep it warm."]},
    {id:'t-beansfin', day:'thu', t:'16:47', dur:8, r:'beans', who:'mm', uses:{bigSkillet:1, burnerGood:1}, needs:['t-blanch','t-leeks'],
     title:'Finish the green beans',
     steps:["Melt 3 tbsp unsalted butter in the large skillet over medium heat. Cook 2–3 min, swirling, until golden and nutty.", "Lower to medium-low. Add the 4 sliced garlic cloves and stir 30–45 seconds.", "Add the blanched green beans, ½ tsp kosher salt and ½ tsp black pepper. Toss 2–3 min until hot.", "Off the heat, toss in the lemon juice (1½–2 tbsp) and zest (from half a lemon).", "Pile onto the platter, spoon the brown butter over the top and finish with the crispy leeks."]},
    {id:'t-brfinal', day:'thu', t:'16:50', dur:10, r:'brisket', who:'mm', needs:['t-reheat'],
     oven:{temp:425, slots:1, min:8, max:12, check:'Hot through. It only needs to warm back up.'},
     title:'Brisket back in, covered',
     steps:["Slide the covered brisket, still on its sheet pan, into the 425°F oven where Pan 1 just came out.", "Heat 8–12 minutes, until hot through."], notes:FOIL},

/* ============ HELPER QUEUE ============
   Prep jobs should get done as early as they sensibly can, not left until just before their deadline.
   This plays the open helper jobs forward from now across the helpers who've joined: whenever a helper frees up,

   Every open job gets a suggested start: "Start now" for the first few, a time for the rest. */
let HQ = null;
function helperQueue(plan){
  const nowMs = now(), sig = Math.floor(nowMs / 30000) + '|' + JSON.stringify(S.tasks).length + '|' + Object.keys(S.people).length;
  if(HQ && HQ.plan === plan && HQ.sig === sig) return HQ.map;
  const M = 60000, hj = plan.tasks.filter(t => t.who === 'h' && !isDone(t));
  const helpers = Object.values(S.people).filter(p => roleOf(p) === 'h').length;
  const slots = Array(Math.max(2, helpers)).fill(nowMs), map = {};
  // Jobs a helper has claimed keep that helper busy until they're likely done
  for(const t of hj.filter(t => prog(t.id).assignee)){
    const a = prog(t.id).assignee, p = S.people[a];
    if(p && roleOf(p) === 'h' && fromOf(plan, t) <= nowMs){ slots.sort((x,y) => x-y); slots[0] = Math.max(slots[0], (prog(t.id).claimedAt || nowMs) + (t.dur||5)*M); }
  }
  let pool = hj.filter(t => !prog(t.id).assignee);
  while(pool.length){
    slots.sort((x,y) => x-y);
    const tNow = slots[0], ready = pool.filter(t => fromOf(plan, t) <= tNow);
    if(!ready.length){ slots[0] = Math.min(...pool.map(t => fromOf(plan, t))); continue; }
    const pick = ready.reduce((a,b) => dueOf(plan,a) <= dueOf(plan,b) ? a : b);

}
