<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanksgiving Game Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  /* Layout: yellow header band, light content sheet with rounded top corners, fixed orange bottom nav (Mastermind), orange slide-in menu */
  --yellow:#F5CB58; --yellow2:#F3E9B5; --orange:#E95322; --orange2:#FFDECF;
  --orange-ink:#B23C12; --ink:#391713; --ink2:#252525; --cream:#F8F8F8; --white:#FFFFFF;
  --bg:#F5F5F5; --muted:#76615C; --line:#EADFD8;
  --good:#2C7A4B; --good-soft:#E1F1E6; --warn:#9A5800; --warn-soft:#FCEBC6; --crit:#C02D19; --crit-soft:#FDE0D8;
  --font:"League Spartan","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--yellow);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font);line-height:1.1;text-wrap:balance;margin:0;color:var(--ink)}
h2{font-size:1.25rem;font-weight:500}
h3{font-size:1.02rem;font-weight:600}
.tnum,.time{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
svg{flex:0 0 auto}

/* Header band */
.top{background:var(--yellow)}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px 40px;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.brand{display:grid;gap:4px;min-width:0}
.app-name{font-size:.85rem;font-weight:600;color:var(--ink);opacity:.8;letter-spacing:.02em}
.view-t{font-size:2rem;font-weight:700;color:var(--white);line-height:1;text-shadow:0 1px 0 rgba(57,23,19,.12)}
.nowpill{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;font-weight:600;color:var(--orange-ink)}
.nowpill svg{width:16px;height:16px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--cream);color:var(--orange);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 rgba(57,23,19,.08)}
.iconbtn svg{width:24px;height:24px}

/* Content sheet */
.sheet-main{background:var(--bg);border-radius:30px 30px 0 0;margin-top:-30px;min-height:calc(100dvh - 120px);padding-bottom:110px;position:relative}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px;display:grid;gap:16px}
@media (min-width:900px){ .wrap.split{grid-template-columns:minmax(0,1fr) 360px;align-items:start} }
.rail,.col{display:grid;gap:16px;min-width:0}
.card{background:var(--white);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;box-shadow:0 1px 2px rgba(57,23,19,.05)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:.9rem;font-weight:400}
.empty{color:var(--muted);font-size:.95rem;margin:0}
.banner{max-width:1100px;margin:0 auto;padding:16px 16px 0}
.banner div{border-radius:14px;padding:10px 14px;font-size:.92rem;background:var(--orange2);color:var(--ink)}

/* Buttons */
.btn{border:0;background:var(--orange2);color:var(--orange-ink);border-radius:999px;padding:9px 18px;min-height:42px;cursor:pointer;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(.97)}
.btn.primary,.btn.heat{background:var(--orange);color:var(--white);font-weight:600;font-size:1.02rem}
.btn.ghost{background:transparent;color:var(--orange-ink)}
.btn.small{min-height:36px;padding:6px 14px;font-size:.88rem}
.btn.primary.small,.btn.heat.small{font-size:.92rem}
.btn.link{background:none;padding:2px 0;min-height:0;color:var(--orange-ink);font-weight:600}
.btn.big{min-height:52px;font-size:1.3rem;font-weight:500;padding:10px 40px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Hero banner */
.hero{background:var(--orange);color:var(--white);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border:16px solid var(--yellow);border-radius:50%;opacity:.9}
.hero h2,.hero .eta,.hero .eta-label{color:var(--white)}
.hero-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;position:relative;z-index:1}
.eta-label{font-size:1rem;font-weight:400}
.eta{font-weight:700;font-size:2.8rem;line-height:1;letter-spacing:-.01em}
.hero .prog{background:rgba(255,255,255,.3)}
.hero .prog i{background:var(--yellow)}
.hero .prog-row{color:var(--cream)}
.hero .pill.good{background:var(--white);color:var(--good)}
.hero .pill.warn{background:var(--yellow);color:var(--ink)}
.hero .pill.crit{background:var(--white);color:var(--crit)}
.hero .mini{background:rgba(255,255,255,.16)}
.hero .mini span,.hero .mini b{color:var(--white)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.heat{background:var(--orange2);color:var(--orange-ink)}
.pill.neutral{background:var(--yellow2);color:var(--ink)}
.prog{height:10px;border-radius:999px;background:var(--yellow2);overflow:hidden;position:relative;z-index:1}
.prog i{display:block;height:100%;background:var(--orange);border-radius:999px;transition:width .4s}
.prog.thin{height:6px;margin:4px 0}
.prog-row{display:flex;justify-content:space-between;font-size:.92rem;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.daysplit{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.mini{border-radius:14px;padding:10px 12px}
.mini b{display:block;font-size:1.2rem;font-weight:700}
.mini span{font-size:.85rem}
.mini .prog{height:6px;margin-top:6px}

/* Alerts */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;font-size:.95rem}
.alert.crit{background:var(--crit-soft)}
.alert.warn{background:var(--warn-soft)}
.alert.info{background:var(--yellow2)}
.alert p{margin:0;flex:1}
.alert.crit p::before,.alert.warn p::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;background:var(--warn)}
.alert.crit p::before{background:var(--crit)}
.newtag{background:var(--crit);color:#fff;border-radius:6px;padding:1px 6px;font-size:.72rem;margin-right:4px;font-weight:600}

/* Oven */
.slots{display:grid;gap:8px}
.slot{border:2px dashed var(--line);border-radius:14px;min-height:56px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;font-size:.88rem;color:var(--muted)}
.slot.full{border:0;background:var(--orange2);color:var(--ink)}
.slot.over{background:var(--crit-soft)}
.slot b{font-size:.95rem;font-weight:600}
.ovenitem{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.timer{font-weight:700;font-size:1.4rem;color:var(--orange-ink);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:999px;background:var(--yellow2);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--orange)}
.meter i.over{background:var(--crit)}

/* Steps */
.tasks{display:grid}
.group-h{font-size:1.05rem;font-weight:500;color:var(--orange-ink);padding:14px 0 4px}
.task{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task.nocheck{grid-template-columns:minmax(0,1fr)}
.check{width:40px;height:40px;border-radius:12px;border:2px solid var(--orange);background:var(--white);color:var(--white);display:grid;place-items:center;cursor:pointer;padding:0}
.check svg{width:22px;height:22px;opacity:0}
.check[aria-pressed="true"]{background:var(--orange)}
.check[aria-pressed="true"] svg{opacity:1}
.check.inoven{background:var(--orange2);color:var(--orange)}
.check.inoven svg{opacity:1}
.tmain{display:grid;gap:6px;min-width:0}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.time{font-weight:700;color:var(--orange-ink)}
.ttitle{font-weight:500;font-size:1.08rem;line-height:1.25}
.task.done .ttitle{color:var(--muted);text-decoration:line-through}
.task.done .time{color:var(--muted)}
.chip{border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--yellow2);color:var(--ink)}
.chip.helper{background:var(--orange2);color:var(--orange-ink)}
.chip.ovenchip{background:var(--orange);color:var(--white)}
.chip.late{background:var(--warn-soft);color:var(--warn)}
.plus{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--yellow2);color:var(--orange);font-size:1.4rem;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center}
.plus[aria-expanded="true"]{background:var(--orange);color:var(--white)}
.detail{display:grid;gap:8px;font-size:.95rem;background:var(--bg);border-radius:14px;padding:12px 14px}
.detail ol{margin:0;padding-left:20px;display:grid;gap:4px}
.uses{font-size:.85rem;color:var(--muted)}
.note{background:var(--orange2);padding:10px 12px;border-radius:14px;font-size:.92rem}
.note ul{margin:0;padding-left:18px;display:grid;gap:4px}

.seg{display:inline-flex;background:var(--yellow2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:600;font-size:.9rem;border-radius:999px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--white)}

/* People */
.hlist{display:grid;gap:12px}
.hrow{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:1.1rem}
.hrow p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}

/* Recipes */
.subtabs{display:flex;gap:14px;overflow-x:auto;padding:20px 16px 4px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:0 0 auto;border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:6px;padding:0;width:68px}
.subtab .tile{width:52px;height:64px;border-radius:30px;background:var(--yellow2);color:var(--orange);display:grid;place-items:center;font-weight:700;font-size:1.35rem}
.subtab .lbl{font-size:.82rem;font-weight:500;color:var(--ink);text-align:center;line-height:1.1}
.subtab[aria-current="page"] .tile{background:var(--orange);color:var(--white)}
.subtab[aria-current="page"] .lbl{font-weight:700}
.rhead h1{font-size:1.7rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ing{display:grid;gap:14px}
.ing ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.steps{margin:0;padding-left:22px;display:grid;gap:12px}
.steps b{display:block;font-weight:600}
.rgrid{display:grid;gap:16px}
@media (min-width:900px){.rgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start}}

/* Helper jobs */
.hello h1{font-size:1.7rem;font-weight:600}
.joblist{display:grid;gap:12px}
.job{border-radius:18px;padding:14px;display:grid;gap:8px;background:var(--white);border:2px solid var(--yellow2)}
.job.mine{border-color:var(--orange)}
.job.done{opacity:.75}
.job h3{font-size:1.12rem;font-weight:600}
.job ol{margin:0;padding-left:20px;display:grid;gap:5px}
.needby{display:flex;align-items:center;gap:8px;border-radius:14px;padding:9px 12px;background:var(--yellow2);color:var(--ink);font-size:.95rem}
.needby svg{width:20px;height:20px;color:var(--orange)}
.needby b{font-size:1.08rem;font-weight:700}
.needby.soon{background:var(--yellow);color:var(--ink)}
.needby.late{background:var(--orange);color:var(--white)}
.needby.late svg{color:var(--white)}
.needby.ok{background:var(--good-soft);color:var(--good)}

/* Landing */
.band{background:var(--yellow);padding:36px 20px 64px;text-align:center;display:grid;gap:8px;justify-items:center}
.band-t{font-size:2.2rem;font-weight:700;color:var(--white)}
.land{max-width:520px;margin:0 auto;padding:28px 24px;display:grid;gap:18px}
.land h2{font-size:1.6rem;font-weight:600}
.land-form{display:grid;gap:18px}
.roles{border:0;margin:0;padding:0;display:grid;gap:10px}
.roles legend{margin-bottom:8px;font-size:1.15rem;font-weight:500}
.role{display:grid;gap:2px;border-radius:16px;padding:14px 16px 14px 48px;cursor:pointer;position:relative;background:var(--yellow2);border:2px solid transparent}
.role input{position:absolute;left:16px;top:17px;width:20px;height:20px;accent-color:var(--orange)}
.role b{font-size:1.1rem;font-weight:600}
.role span{font-size:.92rem;color:var(--muted)}
.role.on{border-color:var(--orange);background:var(--orange2)}
.land .submit-row{display:flex;justify-content:center;padding-top:8px}

/* Forms */
.field{display:grid;gap:6px;font-weight:500;font-size:1rem;min-width:0;color:var(--ink)}
.field input,.field select,.field textarea{font:inherit;font-weight:400;font-size:1.02rem;padding:10px 14px;border-radius:13px;border:0;background:var(--yellow2);color:var(--ink);min-height:46px;width:100%}
.field textarea{resize:vertical;line-height:1.4}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--orange);outline-offset:0}
.check-field{display:flex;align-items:center;gap:10px}
.check-field input{width:22px;height:22px;min-height:0;accent-color:var(--orange)}
.formerr{color:var(--crit);margin:0;min-height:1.2em;font-size:.92rem}
.q-label{font-weight:500}

/* Bottom navigation */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.bnav-in{pointer-events:auto;width:min(560px,100%);background:var(--orange);border-radius:30px 30px 0 0;display:grid;grid-template-columns:repeat(3,1fr);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bnav button{border:0;background:none;color:var(--cream);display:grid;justify-items:center;gap:3px;padding:6px 0;cursor:pointer;font-size:.82rem;font-weight:500;border-radius:16px}
.bnav button svg{width:26px;height:26px}
.bnav button[aria-current="page"]{background:var(--cream);color:var(--orange-ink)}

/* Slide-in menu */
.scrim{position:fixed;inset:0;background:rgba(57,23,19,.35);display:grid;place-items:end center;z-index:50;padding:16px}
@media (min-width:600px){.scrim{place-items:center}}
.dialog{background:var(--white);color:var(--ink);border-radius:24px;padding:22px;width:min(440px,100%);display:grid;gap:14px}
.dialog h2{font-size:1.4rem;font-weight:600}
.scrim.drawer{place-items:stretch end;padding:0}
.drawer-panel{background:var(--orange);color:var(--cream);width:min(340px,88vw);height:100%;border-radius:40px 0 0 40px;padding:36px 24px 28px;display:flex;flex-direction:column;gap:24px;overflow-y:auto;box-shadow:-8px 0 30px rgba(57,23,19,.25)}
.drawer-me{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center}
.drawer-me .avatar{width:56px;height:56px;background:var(--cream);color:var(--orange);font-size:1.5rem}
.drawer-me b{display:block;font-size:1.5rem;font-weight:600;color:var(--white);line-height:1.1}
.drawer-me span{font-size:.95rem;color:var(--cream)}
.drawer-close{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:var(--white);cursor:pointer;font-size:1.3rem;display:grid;place-items:center}
.menu{display:grid}
.menu-item{display:grid;grid-template-columns:48px 1fr;gap:16px;align-items:center;text-align:left;border:0;border-bottom:1px solid rgba(248,248,248,.6);background:none;color:var(--cream);padding:12px 0;cursor:pointer;min-height:64px}
.menu-item:last-child{border-bottom:0}
.menu-item .mi-ico{width:48px;height:48px;border-radius:14px;background:var(--cream);color:var(--orange);display:grid;place-items:center}
.menu-item .mi-ico svg{width:26px;height:26px}
.menu-item b{display:block;font-size:1.2rem;font-weight:600;color:var(--white)}
.menu-item span{font-size:.85rem;color:var(--cream);opacity:.92}
.menu-foot{margin-top:auto}
.menu-foot .menu-item{border:0}
.menu-foot .mi-ico{background:transparent;color:var(--cream);border:2px solid var(--cream)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:999px;z-index:60;font-size:.95rem;max-width:90vw}

/* Editors */
.ed-h{font-size:1.5rem;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .wide{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.group{border-top:1px solid var(--line);padding-top:12px}
.tools{border:0;background:var(--bg);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tools legend{font-weight:500;padding:0 4px;float:left;width:100%;margin-bottom:4px}
.toolq{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.92rem}
.toolq input{width:64px;min-height:38px;padding:6px 8px;font:inherit;border-radius:10px;border:0;background:var(--yellow2);color:var(--ink)}
.tforms{display:grid;gap:10px}
.tform{border-radius:16px;padding:12px 14px;display:grid;gap:12px;background:var(--bg)}
.tform.open{background:var(--white);outline:2px solid var(--orange)}
.toolrows{display:grid;gap:10px}
.toolrow{display:grid;grid-template-columns:2fr 1fr auto auto;gap:10px;align-items:end;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:520px){.toolrow{grid-template-columns:1fr 90px}}
.rlist{display:grid}
.ritem{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.ritem .tile{width:44px;height:44px;border-radius:14px;background:var(--yellow2);color:var(--orange);display:grid;place-items:center;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:hsl(var(--h) 55% 45%)}
.impact{display:grid;gap:12px}
.impact h3{margin-bottom:6px}
.moved{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;justify-content:center}
.has-nav .savebar{bottom:78px}
.savebar-in{width:min(1100px,100%);margin:0 12px 8px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600;font-size:.95rem;background:var(--ink);color:var(--white);border-radius:20px;box-shadow:0 8px 24px rgba(57,23,19,.25)}
.savebar .btn.ghost{color:var(--yellow)}
.editor{padding-bottom:90px}

/* Timeline */
.timeline{position:relative;display:grid;grid-template-columns:60px minmax(740px,1fr);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.hours{position:relative;margin-top:30px}
.hr{position:absolute;left:0;right:0;font-size:.78rem;color:var(--muted);transform:translateY(-.6em)}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lane-h{height:30px;font-size:.88rem;font-weight:600;color:var(--orange-ink);display:flex;align-items:center}
.lane-body{position:relative;background:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 120px),var(--bg);border-radius:14px}
.blk{position:absolute;border-radius:12px;background:hsl(var(--h) 70% 93%);border-left:5px solid hsl(var(--h) 60% 42%);display:flex;flex-direction:column;overflow:hidden;color:var(--ink);box-shadow:0 1px 2px rgba(57,23,19,.12)}
.blk.bad{outline:3px solid var(--crit);outline-offset:-1px}
.blk.dragging{box-shadow:0 10px 24px rgba(57,23,19,.3);z-index:5}
.grip{flex:0 0 18px;border:0;background:hsl(var(--h) 55% 84%);cursor:grab;touch-action:none;font-size:.7rem;letter-spacing:2px;color:var(--ink);padding:0;line-height:18px}
.grip:active{cursor:grabbing}

const DEFAULT_PLAN = {

      ingredients:[
        {g:'Meat & dry rub', items:['1 (5-lb) first-cut (flat-cut) beef brisket, fat cap left intact','2½ tsp kosher salt','1½ tsp freshly ground black pepper','2 tsp smoked or sweet paprika','1½ tsp garlic powder','1 tsp onion powder','2 tbsp neutral high-heat oil (avocado, canola or grapeseed)']},
        {g:'Maple & tomato sauce', items:['1 can (15 oz) tomato sauce','1 can (6 oz) tomato paste','⅓ cup pure maple syrup (or dark brown sugar)','⅓ cup apple cider vinegar','2 tbsp Worcestershire sauce','1 tbsp Dijon mustard','1 tsp chili powder','¼ tsp ground allspice (try nutmeg instead)']},
        {g:'Aromatics & braising liquid', items:['2 large yellow or sweet onions, thinly sliced into rings','4 cloves garlic, smashed','1 cup dry red wine (Cabernet or Merlot) or apple cider','2–3 cups low-sodium beef broth','6 sprigs fresh thyme','3 sprigs fresh rosemary','2 dried bay leaves']}

      ingredients:[
        {g:'Cider', items:['12 cups (3 quarts) unfiltered apple cider','3 ripe Fuyu persimmons, tops trimmed, halved crosswise (plus 1 extra, thinly sliced, for garnish)','2 tsp unsalted butter or coconut oil','1½ tbsp pure maple syrup, plus more to taste','3 whole cinnamon sticks, plus extra for serving','2 whole star anise pods','4–5 whole cloves','2 strips orange peel (no white pith)','¾ tsp vanilla bean paste or pure vanilla extract','1–1½ tbsp fresh lemon juice']},

      steps:[

      ingredients:[
        {g:'Pinwheels', items:['1 box (18 oz) Trader Joe\'s All-Butter Puff Pastry (2 sheets), thawed in the fridge overnight','2 cans (14 oz each) artichoke hearts in water, drained, squeezed very dry, finely chopped','1 package (5.2 oz) Garlic & Fine Herbs Boursin, softened 20–30 min','4 oz cream cheese, softened','1 cup (about 4 oz) shredded Gruyère (or Swiss/fontina)','⅓ cup grated Parmesan','1 tsp lemon zest (about ½ lemon)','1 tsp fresh thyme leaves (or ½ tsp dried)','¼ tsp freshly ground black pepper (taste before adding salt)','1 large egg beaten with 1 tbsp water (egg wash)']},

      ingredients:[

function fmtTime(ms){ return new Date(ms).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }

function fmtRel(ms){ const d = new Date(ms), n = new Date(now()); return d.toDateString() === n.toDateString() ? fmtTime(ms) : fmtDT(ms); }
function mins(ms){ return Math.round(ms/60000); }
function dur(m){ m = Math.round(m); if(Math.abs(m) < 60) return m + ' min'; const h = Math.floor(Math.abs(m)/60), r = Math.abs(m)%60; return h + ' hr' + (r ? ' ' + r + ' min' : ''); }
function rangeDur(a,b){ if(a===b) return dur(a); if(a<60 && b<60) return a+'–'+b+' min'; return dur(a)+' – '+dur(b); }
function relTo(ms){ const d = mins(ms - now()); if(Math.abs(d) <= 1) return 'now'; return d > 0 ? 'in ' + dur(d) : dur(-d) + ' late'; }
function hm(ms){ const d = new Date(ms); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function dayOf(ms){ return new Date(ms).getDate() === DAY_DATE.wed ? 'wed' : 'thu'; }
function toMin(hmStr){ const [h,m] = hmStr.split(':').map(Number); return h*60+m; }
function fromMin(n){ n = Math.max(0, Math.min(23*60+55, n)); return String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n%60).padStart(2,'0'); }

/* ============ PLAN MODEL ============ */
function recipeOf(plan, r){ return plan.recipes[r] || {name:'Kitchen', short:'Kitchen'}; }
function hueOf(plan, r){ const i = plan.recipeOrder.indexOf(r); return i < 0 ? 0 : HUES[i % HUES.length]; }
function findTask(plan, id){ return plan.tasks.find(t => t.id === id); }
function prog(id){ return S.tasks[id] || {}; }
function dinnerAt(plan){ return at('thu', plan.dinner); }
function len(t){ return t.oven ? t.oven.min : (t.dur || 0); }
function sched(plan, t, live){
  if(t.final) return dinnerAt(plan);
  if(t.after && live){ const p = prog(t.after.id); if(p.outAt) return p.outAt + t.after.offset*60000; }
  return at(t.day, t.t);
}
function endOf(plan, t){ return sched(plan, t) + len(t)*60000; }
function dueOf(plan, t){
  if(t.for){ const target = findTask(plan, t.for.id); if(target) return sched(plan, target, true) - (t.for.before||0)*60000; }
  if(t.due) return at(...t.due);
  return at(t.day, t.t) + 60*60000;
}
function fromOf(plan, t){
  const f = t.from ? at(...t.from) : at(t.day, t.t);
  return Math.min(f, dueOf(plan, t) - (t.dur||5)*60000);
}
function displayTime(plan, t){ return t.who === 'h' ? Math.min(at(t.day, t.t), dueOf(plan, t) - (t.dur||5)*60000) : sched(plan, t, true); }
function dueLabel(plan, t){ const d = dueOf(plan, t); return 'by ' + (dayOf(d) !== t.day ? fmtDT(d) : fmtTime(d)); }
const isDone = t => !!prog(t.id).done;
const inOven = t => { const s = prog(t.id); return !!(t.oven && s.inOvenAt && !s.done); };
const started = t => { const s = prog(t.id); return !!(s.startedAt && !s.done); };
const active = t => inOven(t) || started(t);
const weight = t => Math.max(2, Math.min(30, t.dur || 3));
function toolMap(plan){ return Object.fromEntries(plan.kitchen.tools.map(x => [x.id, x])); }
function usesList(plan, t){
  const tm = toolMap(plan);
  return Object.entries(t.uses || {}).filter(([,q]) => q > 0).map(([k,q]) => (q > 1 ? q + ' × ' : '') + (tm[k] ? tm[k].name : 'Missing tool'));
}
function personName(key){ const p = S.people[key]; return (p && p.name) || 'A helper'; }
function colorFor(key){ let h = 0; for(const c of String(key)) h = (h*31 + c.charCodeAt(0)) >>> 0; return `hsl(${HUES[h % HUES.length]} 55% 42%)`; }

/* Static check of a plan: equipment, oven, order, dinner time, helper windows */
function planIssues(plan){
  const out = [], seen = new Set();
  const add = (lv, text, ids) => { if(seen.has(text)) return; seen.add(text); out.push({lv, text, ids}); };
  const iv = plan.tasks.filter(t => t.who === 'mm' && !t.final).map(t => ({t, s: sched(plan, t), e: endOf(plan, t)}));
  const tm = toolMap(plan);
  for(const {t} of iv) for(const [k, q] of Object.entries(t.uses || {})){
    if(!q) continue;
    const tool = tm[k];
    if(!tool || tool.count < q) add('crit', `"${t.title}" needs ${q} × ${tool ? tool.name.toLowerCase() : 'a tool you removed'}, but your kitchen has ${tool ? tool.count : 0}.`, [t.id]);
  }
  for(const tool of plan.kitchen.tools){
    const users = iv.filter(x => (x.t.uses || {})[tool.id]);
    for(const a of users){
      const act = users.filter(b => b.s <= a.s && a.s < b.e);
      const q = act.reduce((n, b) => n + (b.t.uses[tool.id] || 0), 0);
      if(q > tool.count && act.length > 1) add('crit', `${tool.name}: ${act.map(b => `"${b.t.title}"`).join(' and ')} overlap at ${fmtDT(a.s)}. You have ${tool.count}.`, act.map(b => b.t.id));
    }
  }
  const ov = iv.filter(x => x.t.oven);
  for(const a of ov){
    const act = ov.filter(b => b.s <= a.s && a.s < b.e);
    const slots = act.reduce((n, b) => n + (b.t.oven.slots || 1), 0);
    if(slots > plan.kitchen.ovenSpots) add('crit', `Oven over capacity at ${fmtDT(a.s)}: ${slots} sheet-pan spots needed (${act.map(b => recipeOf(plan, b.t.r).short).join(', ')}), room for ${plan.kitchen.ovenSpots}.`, act.map(b => b.t.id));
    const temps = [...new Set(act.map(b => b.t.oven.temp))];
    if(temps.length > 1) add('crit', `Oven temperature clash at ${fmtDT(a.s)}: ${act.map(b => `${recipeOf(plan, b.t.r).short} ${b.t.oven.temp}°F`).join(' vs ')}.`, act.map(b => b.t.id));
  }
  for(const x of iv) for(const nid of (x.t.needs || [])){
    const n = iv.find(y => y.t.id === nid);
    if(n && n.e > x.s) add('warn', `"${x.t.title}" starts at ${fmtDT(x.s)}, before "${n.t.title}" is done at ${fmtTime(n.e)}.`, [x.t.id, n.t.id]);
  }
  const dz = dinnerAt(plan);
  for(const x of iv) if(!x.t.optional && x.e > dz) add('warn', `"${x.t.title}" finishes at ${fmtDT(x.e)}, after dinner at ${fmtTime(dz)}.`, [x.t.id]);
  for(const t of plan.tasks.filter(t => t.who === 'h')){
    const d = dueOf(plan, t), f = t.from ? at(...t.from) : null;
    if(f && f + (t.dur||0)*60000 > d) add('warn', `Helper job "${t.title}" can't start until ${fmtDT(f)} but is needed by ${fmtDT(d)}.`, [t.id]);
  }
  return out;
}
function plannedFinish(plan){
  let m = dinnerAt(plan);
  for(const t of plan.tasks) if(t.who === 'mm' && t.day === 'thu' && !t.optional && !t.final) m = Math.max(m, endOf(plan, t));
  return m;
}

/* ============ LIVE ANALYSIS ============ */
function progress(filter){
  let total = 0, done = 0, n = 0, nd = 0;
  for(const t of S.plan.tasks){
    if(t.optional || (filter && !filter(t))) continue;
    total += weight(t); n++;
    if(isDone(t)){ done += weight(t); nd++; }
  }
  return {pct: total ? Math.round(done/total*100) : 0, n, nd};
}
function projection(){
  const plan = S.plan, nowMs = now(), dz = dinnerAt(plan);
  let slip = 0;
  for(const t of plan.tasks){
    if(t.day !== 'thu' || t.who !== 'mm' || t.optional || t.final || isDone(t)) continue;
    const sc = sched(plan, t, true); if(sc < dz - 150*60000) continue;
    const s = prog(t.id); let late = 0;
    if(t.oven && s.inOvenAt) late = s.inOvenAt - sc;
    else if(s.startedAt) late = s.startedAt - sc;
    else if(sc < nowMs) late = nowMs - sc;
    slip = Math.max(slip, late);
  }
  const slipMin = Math.max(0, mins(slip));
  const eta = Math.max(plannedFinish(plan), dz + slipMin*60000);
  return {slipMin: mins(eta - dz), eta, allDone: plan.tasks.every(t => t.optional || isDone(t))};
}
function ovenState(){
  const items = S.plan.tasks.filter(inOven);
  return {items, temps:[...new Set(items.map(t => t.oven.temp))], slots: items.reduce((a,t) => a + (t.oven.slots||1), 0)};
}
function nextOvenTask(){ return S.plan.tasks.filter(t => t.oven && t.who==='mm' && !isDone(t) && !inOven(t)).sort((a,b) => sched(S.plan,a,true) - sched(S.plan,b,true))[0]; }
function liveAlerts(f){
  const plan = S.plan, out = [], nowMs = now(), ov = ovenState(), spots = plan.kitchen.ovenSpots;
  const mine = f || (() => true);
  const short = t => recipeOf(plan, t.r).short;
  if(ov.temps.length > 1) out.push({lv:'crit', text:`The oven has food needing different temperatures: ${ov.items.map(t => `${short(t)} at ${t.oven.temp}°F`).join(', ')}.`});
  if(ov.slots > spots) out.push({lv:'crit', text:`The oven is over capacity: ${ov.slots} sheet-pan spots in use, room for ${spots}.`});
  for(const t of ov.items.filter(mine)){
    const s = prog(t.id), el = mins(nowMs - s.inOvenAt);
    if(t.oven.mid && el >= t.oven.mid.at && !s.midDone) out.push({lv:'warn', text:`${t.oven.mid.label} (${el} min in).`, act:'mid', id:t.id, btn:'Done'});
    if(el >= t.oven.max) out.push({lv:'crit', text:`Check the ${short(t).toLowerCase()} now: ${dur(el)} in the oven, recipe max is ${dur(t.oven.max)}.`, act:'out', id:t.id, btn:'It\'s out'});
    else if(el >= t.oven.min) out.push({lv:'warn', text:`${t.title} could be ready (${dur(el)} in). ${t.oven.check || ''}`, act:'out', id:t.id, btn:'It\'s out'});
  }
  const nx = nextOvenTask();
  if(nx && mine(nx) && sched(plan,nx,true) - nowMs <= 10*60000){
    if(ov.items.length && !ov.temps.includes(nx.oven.temp)) out.push({lv:'warn', text:`"${nx.title}" needs ${nx.oven.temp}°F at ${fmtTime(sched(plan,nx,true))}, but the oven still has ${ov.items.map(t=>short(t).toLowerCase()).join(' and ')} at ${ov.temps.join('/')}°F.`});
    const free = Math.max(0, spots - ov.slots);
    if(ov.slots + (nx.oven.slots||1) > spots) out.push({lv:'warn', text:`"${nx.title}" needs ${nx.oven.slots} sheet-pan spot${nx.oven.slots>1?'s':''} at ${fmtTime(sched(plan,nx,true))}. ${free===0 ? 'None are free yet' : 'Only '+free+' '+(free===1?'is':'are')+' free'}, so something has to come out first.`});
  }
  const tm = toolMap(plan), seen = new Set();
  for(const p of plan.tasks){
    if(p.who !== 'mm' || isDone(p) || active(p) || !p.uses || !mine(p)) continue;
    const ps = sched(plan, p, true);
    if(ps - nowMs > 10*60000 || nowMs - ps > 3*3600000) continue;
    for(const [k, need] of Object.entries(p.uses)){
      if(!need || !tm[k]) continue;
      const holders = plan.tasks.filter(o => o !== p && (o.uses||{})[k] && started(o));
      const used = holders.reduce((n,o) => n + o.uses[k], 0);
      if(holders.length && used + need > tm[k].count && !seen.has(k)){
        seen.add(k);
        out.push({lv:'warn', text:`${tm[k].name} is still in use for "${holders[0].title}" (started ${fmtTime(prog(holders[0].id).startedAt)}). "${p.title}" needs it at ${fmtTime(ps)}.`});
      }
    }
  }
  const late = plan.tasks.filter(t => t.who==='mm' && mine(t) && !t.optional && !t.final && !isDone(t) && !active(t) && nowMs - sched(plan,t,true) > 10*60000).sort((a,b)=>sched(plan,a,true)-sched(plan,b,true));
  if(late.length) out.push({lv:'warn', text:`Running behind: "${late[0].title}" was planned for ${fmtRel(sched(plan,late[0],true))}${late.length>1 ? ` (+${late.length-1} more late)` : ''}.`});
  const risky = plan.tasks.filter(t => t.who==='h' && mine(t) && !isDone(t) && dueOf(plan,t) - nowMs <= 20*60000 && nowMs - dueOf(plan,t) < 2*3600000).sort((a,b)=>dueOf(plan,a)-dueOf(plan,b));
  for(const t of risky.slice(0,3)){
    const a = prog(t.id).assignee, d = dueOf(plan,t);
    const when = d < nowMs ? `was needed by ${fmtTime(d)}` : `is needed by ${fmtTime(d)}`;
    out.push({lv: d < nowMs ? 'warn' : 'info', text: a ? `"${t.title}" (${personName(a)}) ${when}.` : `Nobody has claimed "${t.title}". It ${when}.`});
  }
  if(risky.length > 3) out.push({lv:'info', text:`${risky.length-3} more helper jobs are due soon.`});
  const subsN = f ? 0 : Object.keys(S.subs).length;
  if(subsN){ const [sid, sx] = Object.entries(S.subs)[0]; out.push({lv:'info', text: subsN > 1 ? `${subsN} new dishes are waiting for your review.` : `${personName(sx.by)} added "${sx.recipe.name}". It's waiting for your review.`, act:'reviewSub', id:sid, btn:'Review'}); }
  const issues = f ? [] : planIssues(plan);
  if(issues.length) out.push({lv:'info', text:`Your schedule has ${issues.length} conflict${issues.length>1?'s':''} to sort out.`, act:'go', v:'schedule', btn:'Review'});
  const order = {crit:0, warn:1, info:2};
  return out.sort((a,b) => order[a.lv]-order[b.lv]);
}

/* ============ PERSISTENCE ============ */
const queues = {};
function saveTask(id, patch){
  const next = Object.assign({}, prog(id), patch, {by: S.key || null, at: Date.now()});
  S.tasks[id] = next; persist('tasks/' + id, next); render();
}
function savePerson(key, data){ S.people[key] = Object.assign({}, S.people[key], data); persist('people/' + key, S.people[key]); }
function savePlan(plan){ S.plan = plan; persist('plan/current', {plan, at: Date.now(), by: S.key}); render(); }
function persist(path, data){
  if(!db){ lsSet('tg-local2', {tasks:S.tasks, people:S.people, plan:S.plan}); lsSet('tg-subs', S.subs); return; }
  const q = queues[path] || (queues[path] = {busy:false, next:null});
  q.next = JSON.parse(JSON.stringify(data)); if(!q.busy) drain(path);
}
async function drain(path){
  const q = queues[path]; q.busy = true;
  while(q.next){
    const data = q.next; q.next = null;
    try{ await db.doc(path).set(data); }
    catch(e){
      const code = e && e.code;
      if(code === 'invalid_argument' || code === 'permission-denied'){ S.conn = 'readonly'; render(); }
      else if(code === 'unavailable'){ await new Promise(r => setTimeout(r, 600 + Math.random()*900)); try{ await db.doc(path).set(data); }catch(e2){ toast('That change didn\'t save. Check your connection and try again.'); } }
      else if(code === 'quota_exceeded'){ toast('The shared plan is full and couldn\'t save that change.'); }
      else toast('That change didn\'t save. Try again.');
    }
  }
  q.busy = false;
}

/* ============ SHARED RENDER BITS ============ */
function viLink(id, open, auto, act){
  return `<button class="vi" data-act="${act||'expand'}" data-id="${id}"${auto?' data-auto="1"':''} aria-expanded="${open}"><span class="vi-ic" aria-hidden="true">${open?I_MINUS:I_PLUS}</span>${open?'Hide instructions':'View instructions'}</button>`;
}
function neededBy(ms, done){
  const left = mins(ms - now());
  const cls = done ? 'ok' : left < 0 ? 'late' : left <= 20 ? 'soon' : '';
  return `<div class="needby ${cls}">${I_CLOCK}<span><b>Needed by ${esc(fmtRel(ms))}</b>${done ? '' : ` · ${esc(relTo(ms))}`}</span></div>`;
}
function detail(t){
  const plan = S.plan, parts = [];
  if(t.steps && t.steps.length) parts.push(`<ol>${t.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`);
  if(t.oven) parts.push(`<div><b>Done when:</b> ${esc(t.oven.check || '')}</div>`);
  if(t.out) parts.push(`<div><b>When it comes out:</b> ${t.out.map(esc).join(' ')}</div>`);
  if(t.who==='h') parts.push(`<div class="uses">Helper job · can start ${esc(fmtDT(fromOf(plan,t)))} · needed by ${esc(fmtDT(dueOf(plan,t)))}</div>`);
  const u = usesList(plan, t); if(u.length) parts.push(`<div class="uses">Uses: ${u.map(esc).join(' · ')}</div>`);
  if(t.notes && t.notes.length) parts.push(`<div class="note"><ul>${t.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`);
  return `<div class="detail">${parts.join('')}</div>`;
}
function taskRow(t, opts={}){
  const plan = S.plan, s = prog(t.id), done = !!s.done, io = inOven(t), stt = started(t);
  const open = opts.forceOpen ? true : opts.open ? !S.collapsed.has(t.id) : S.expanded.has(t.id);
  const sc = displayTime(plan, t);
  const chips = [];
  if(opts.showRecipe !== false) chips.push(`<span class="chip" style="--h:${hueOf(plan,t.r)}">${esc(recipeOf(plan,t.r).short)}</span>`);
  if(t.who==='h') chips.push(`<span class="chip helper">${s.assignee ? esc(personName(s.assignee)) : 'Helper job · open'}</span>`);
  else if(ownerOf(t.r) && ownerOf(t.r) !== S.key) chips.push(`<span class="chip helper">${esc(personName(ownerOf(t.r)))}'s dish</span>`);
  if(t.oven) chips.push(`<span class="chip ovenchip">${t.oven.temp}°F · ${rangeDur(t.oven.min, t.oven.max)}</span>`);
  if(t.optional) chips.push('<span class="chip">Optional</span>');
  const lateMin = mins(now() - sched(plan,t,true));
  if(!done && !io && !stt && t.who==='mm' && lateMin > 10) chips.push(`<span class="chip late">${dur(lateMin)} late</span>`);
  if(stt) chips.push(`<span class="chip ovenchip">Started ${fmtTime(s.startedAt)}</span>`);
  if(io) chips.push(`<span class="chip ovenchip">In oven since ${fmtTime(s.inOvenAt)}</span>`);
  if(done && s.doneBy && s.doneBy !== S.key && S.people[s.doneBy]) chips.push(`<span class="chip">Done by ${esc(personName(s.doneBy))}</span>`);
  let actions = '';
  if(!done && !opts.readonly){
    if(t.oven){
      actions = io
        ? `<button class="btn heat small" data-act="out" data-id="${t.id}">Take out of oven</button><button class="btn small ghost" data-act="ovenTime" data-id="${t.id}">Fix time it went in</button><button class="btn small ghost" data-act="unoven" data-id="${t.id}">Undo</button>`
        : `<button class="btn heat small" data-act="ovenTime" data-id="${t.id}">Mark in oven</button>`;
    } else if(t.who==='mm' && Object.keys(t.uses||{}).some(k => t.uses[k] > 0)){
      actions = stt ? `<button class="btn small" data-act="unstart" data-id="${t.id}">Cancel start</button>` : `<button class="btn small" data-act="start" data-id="${t.id}">Start</button>`;
    }
  }
  let timer = '';
  if(io){
    const el = mins(now() - s.inOvenAt);
    timer = `<div class="sub tnum">${dur(el)} so far · check ${fmtTime(s.inOvenAt + t.oven.min*60000)}${t.oven.max!==t.oven.min?'–'+fmtTime(s.inOvenAt + t.oven.max*60000):''}</div>`;
  }
  const label = done ? `Mark "${t.title}" not done` : `Mark "${t.title}" done`;
  return `<div class="task${done?' done':''}">
    <button class="check${t.oven?' oven':''}${io?' inoven':''}" data-act="toggle" data-id="${t.id}" aria-pressed="${done}" aria-label="${esc(label)}">${io && !done ? I_FLAME : I_CHECK}</button>

      ${timer}
      ${open ? detail(t) : ''}
      ${actions ? `<div class="btns">${actions}</div>` : ''}
    </div>
  </div>`;
}

        <div class="ttitle">${esc(t.title)}</div>

/* ============ EDITORS: shared ============ */
function startDraft(kind, extra){ S.draft = Object.assign({kind, plan: clone(S.plan), base: clone(S.plan)}, extra || {}); }
function dirty(){ return !!S.draft && (JSON.stringify(S.draft.plan) !== JSON.stringify(S.draft.base) || !!S.draft.ownerChanged); }
function impactHtml(){
  const d = S.draft; if(!d) return '';
  const plan = d.plan, base = d.base;
  const iss = planIssues(plan), baseKeys = new Set(planIssues(base).map(i=>i.text));
  const pf = plannedFinish(plan), goal = dinnerAt(plan), pfBase = plannedFinish(base);
  const moved = [];
  for(const t of plan.tasks){
    const b = findTask(base, t.id);
    if(!b){ moved.push(`Added: "${t.title}"`); continue; }
    if(t.who !== b.who){ moved.push(`"${t.title}" is now ${t.who==='mm' ? 'a cook step' : 'a helper job'}`); continue; }
    if(t.who === 'mm'){ const a = sched(base,b), z = sched(plan,t); if(a !== z || len(b) !== len(t)) moved.push(`"${t.title}": ${fmtDT(a)} → ${fmtDT(z)}${len(b)!==len(t) ? ` (${dur(len(b))} → ${dur(len(t))})` : ''}`); }
    else { const a = dueOf(base,b), z = dueOf(plan,t); if(a !== z) moved.push(`Helper deadline "${t.title}": by ${fmtDT(a)} → by ${fmtDT(z)}`); }
  }
  for(const b of base.tasks) if(!findTask(plan, b.id)) moved.push(`Removed: "${b.title}"`);
  const finishLine = pf > goal ? `<span class="pill crit">Food ready ${esc(fmtTime(pf))}, ${dur(mins(pf-goal))} after your ${esc(fmtTime(goal))} goal</span>` : `<span class="pill good">Everything ready by ${esc(fmtTime(goal))}</span>`;
  return `<div class="impact">
    <div class="card-h"><h2>What this changes</h2>${dirty() ? '<span class="pill warn">Not saved</span>' : '<span class="pill neutral">No changes yet</span>'}</div>
    <div>${finishLine}${pf !== pfBase ? ` <span class="sub">(was ${esc(fmtTime(pfBase))})</span>` : ''}</div>
    ${!S.noAI && d.kind === 'recipe' && d.recipeId !== 'general' && iss.some(i => !baseKeys.has(i.text)) ? `<div class="btns"><button class="btn small primary" data-act="fixAI" ${S.fixing?'disabled':''}>${S.fixing ? 'Asking Claude…' : 'Ask Claude to fix the timing'}</button></div>` : ''}
    <div><h3>Conflicts ${iss.length ? `<span class="sub">${iss.length}</span>` : ''}</h3>
      ${iss.length ? `<div class="alerts">${iss.map(i=>`<div class="alert ${i.lv}"><p>${baseKeys.has(i.text)?'':'<b class="newtag">New</b> '}${esc(i.text)}</p></div>`).join('')}</div>` : '<p class="empty">No conflicts. Equipment, oven space and timing all fit.</p>'}
    </div>
    <div><h3>Steps that moved ${moved.length ? `<span class="sub">${moved.length}</span>` : ''}</h3>
      ${moved.length ? `<ul class="moved">${moved.slice(0,14).map(m=>`<li>${esc(m)}</li>`).join('')}${moved.length>14?`<li>…and ${moved.length-14} more</li>`:''}</ul>` : '<p class="empty">Nothing has moved.</p>'}
    </div>
  </div>`;
}
function saveBar(){

}

/* ============ LANE LAYOUT (estimates text height so nothing is cut off) ============ */
function estLines(text, widthPx, charPx){
  const cpl = Math.max(6, Math.floor((widthPx - 22) / charPx));
  let lines = 1, cur = 0;
  for(const w of String(text).split(/\s+/)){ const L = w.length; if(cur === 0) cur = L; else if(cur + 1 + L <= cpl) cur += 1 + L; else { lines++; cur = L; } while(cur > cpl){ lines++; cur -= cpl; } }
  return lines;
}
function layoutLane(items, laneW, ppm, heightFor, startM){
  // Columns come from real time overlap only; long text pushes later blocks in the same column down.
  const sorted = items.slice().sort((a,b) => a.s - b.s);
  const cols = [], colOf = {};
  for(const x of sorted){ const e = x.s + Math.max(x.d, 15); let c = cols.findIndex(end => end <= x.s); if(c < 0){ c = cols.length; cols.push(e); } else cols[c] = e; colOf[x.id] = c; }
  const n = Math.max(1, cols.length), colW = laneW / n - 4;
  const place = {}, bottoms = new Array(n).fill(-Infinity);
  let bottom = 0;
  for(const x of sorted){
    const c = colOf[x.id], h = Math.max(x.d * ppm, heightFor(x, colW));
    const y = Math.max((x.s - startM) * ppm, bottoms[c] + 6);
    bottoms[c] = y + h; bottom = Math.max(bottom, y + h);
    place[x.id] = {col:c, y, h};
  }
  return {place, n, bottom};
}

/* ============ EDITOR: schedule (drag and drop) ============ */
const PPM = 2; // pixels per minute
function laneOf(t){ return t.oven ? 'oven' : (Object.values(t.uses||{}).some(q=>q>0) ? 'tools' : 'hands'); }
function renderSchedule(){
  const plan = S.draft.plan;
  const day = S.schedDay || (now() < at('thu','00:00') ? 'wed' : 'thu');
  S.schedDay = day;
  const tasks = plan.tasks.filter(t => t.who==='mm' && t.day===day && !t.final);
  const issues = planIssues(plan), bad = new Set(issues.flatMap(i => i.ids));
  let startM = 7*60, endM = day==='thu' ? toMin(plan.dinner) + 60 : 22*60;
  for(const t of tasks){ const s = toMin(t.t); startM = Math.min(startM, Math.floor(s/60)*60); endM = Math.max(endM, Math.ceil((s+len(t))/60)*60); }
  const lanes = [['oven','Oven'],['tools','Stove & tools'],['hands','Hands-on']];
  const LANE_W = 235;
  const lay = {};
  for(const [k] of lanes){
    const items = tasks.filter(t => laneOf(t)===k).map(t => ({id:t.id, s:toMin(t.t), d:len(t), title:t.title}));
    const hf = (it, w) => 18 + 10 + 17 + estLines(it.title, w, 7.8) * 17 + 10;
    let L = layoutLane(items, LANE_W, PPM, hf, startM);
    const w = Math.max(LANE_W, L.n * 150);
    if(w !== LANE_W) L = layoutLane(items, w, PPM, hf, startM);
    L.w = w; lay[k] = L;
  }
  endM = Math.min(endM, 24*60);
  const H = Math.max((endM - startM) * PPM, ...Object.values(lay).map(l => l.bottom + 12));
  const lanesHtml = lanes.map(([k,label]) => {
    const items = tasks.filter(t => laneOf(t)===k);
    const L = lay[k], n = L.n;
    return `<div class="lane" data-lane="${k}"><div class="lane-h">${label}</div><div class="lane-body" style="height:${H}px">
      ${items.map(t => { const s = toMin(t.t), pl = L.place[t.id];
        return `<div class="blk${bad.has(t.id)?' bad':''}" data-id="${t.id}" style="top:${pl.y}px;min-height:${pl.h}px;left:calc(${pl.col*100/n}% + 2px);width:calc(${100/n}% - 4px);--h:${hueOf(plan,t.r)}">
          <button class="grip" data-grip="${t.id}" aria-label="Move ${esc(t.title)}. Use arrow keys to shift by 5 minutes.">• • •</button>
          <button class="blk-body" data-act="editTime" data-id="${t.id}"><span class="blk-time tnum">${fmtTime(at(day,t.t))}</span><span class="blk-t">${esc(t.title)}</span></button>
        </div>`; }).join('')}
    </div></div>`;
  }).join('');
  const hours = []; for(let m = startM; m <= endM; m += 60) hours.push(`<div class="hr" style="top:${(m-startM)*PPM}px"><span>${fmtTime(at(day, fromMin(m)))}</span></div>`);
  const body = `<section class="card">
    <div class="card-h"><div class="seg" role="group" aria-label="Day"><button data-act="schedDay" data-v="wed" aria-pressed="${day==='wed'}">Wednesday</button><button data-act="schedDay" data-v="thu" aria-pressed="${day==='thu'}">Thursday</button></div><span class="sub">Drag a step by its top strip to move it · tap it to set an exact time</span></div>
    <div class="timeline" style="height:${H+40}px;grid-template-columns:60px minmax(${lanes.reduce((a,[k])=>a+lay[k].w,0)+16}px,1fr)"><div class="hours">${hours.join('')}</div><div class="lanes" style="grid-template-columns:${lanes.map(([k])=>`minmax(${lay[k].w}px,${lay[k].w}fr)`).join(' ')}">${lanesHtml}</div></div>
    <p class="sub" style="margin:0">Helper jobs aren't on the timeline. Their deadlines follow the step they're for, listed under "Steps that moved".</p>
  </section>`;
  return editorPage('Schedule', 'Move your steps and watch conflicts and helper deadlines update.', body);
}

function keyFor(name){ const sl = String(name||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'').slice(0,24) || 'me'; return (S.baseKey || 'local') + '-' + sl; }
function roleOf(me){ return me ? (me.role === 'mm' ? 'host' : me.role) : null; }
const isHost = () => roleOf(S.me) === 'host';
function dishesOf(key){ const p = S.people[key]; return (p && Array.isArray(p.dishes)) ? p.dishes : []; }
function myDishes(){ return S.key ? dishesOf(S.key).filter(r => S.plan.recipes[r]) : []; }
function ownerOf(r){ for(const [k,p] of Object.entries(S.people)) if(Array.isArray(p.dishes) && p.dishes.includes(r)) return k; return null; }
function canEditRecipe(r){ return isHost() || myDishes().includes(r); }
function myTask(t){ return myDishes().includes(t.r) || prog(t.id).assignee === S.key; }
function mySubs(){ return Object.entries(S.subs).filter(([,x]) => x.by === S.key); }
/* host · owner (owns at least one dish, or picked "dish owner") · helper */
function effRole(){
  const r = roleOf(S.me);
  if(r === 'host') return 'host';
  if(r === 'owner' || myDishes().length || mySubs().some(([,x]) => x.own)) return 'owner';
  return 'h';
}

/* ============ TIMELINE (time-focused Gantt) ============ */
const JOB_TYPES = {
  oven:{label:'Oven', color:'#E95322'},
  tools:{label:'Stove & tools', color:'#D9A21B'},
  hands:{label:'Hands-on', color:'#391713'},
  help:{label:'Helper job', color:'#3F76A6'}
};
function jobType(t){ return t.who === 'h' ? 'help' : laneOf(t); }
function gantt(tasks, day){
  const plan = S.plan, nowMs = now(), H = 3600000;
  const startOf = t => { if(t.who === 'h'){ const d = displayTime(plan, t); return dayOf(d) === day ? d : at(day, t.t); } return sched(plan, t, true); };
  const lenOf = t => (t.who === 'h' ? (t.dur||5) : len(t)) * 60000;
  const all = tasks.filter(t => t.day === day && !t.final);
  let a0 = at(day, '08:00'), a1 = day === 'thu' ? dinnerAt(plan) + 30*60000 : at(day, '21:00');
  for(const t of all){ a0 = Math.min(a0, Math.floor(startOf(t)/H)*H); a1 = Math.max(a1, Math.ceil((startOf(t)+lenOf(t))/H)*H); }
  const zoom = S.zoom || 'day';
  if(zoom === 'am') a1 = Math.max(a0 + H, at(day, '12:00'));
  if(zoom === 'pm') a0 = Math.min(a1 - H, at(day, '12:00'));
  const span = a1 - a0, pct = ms => Math.max(0, Math.min(100, (ms - a0) / span * 100));
  const list = all.filter(t => startOf(t) + lenOf(t) > a0 && startOf(t) < a1).sort((a,b) => startOf(a) - startOf(b));
  const step = span > 9*H ? 2*H : H;
  const ticks = []; for(let x = Math.ceil(a0/step)*step; x <= a1; x += step){ const h = new Date(x).getHours(); ticks.push(`<span class="g-tick" style="left:${pct(x)}%">${h%12||12}${h<12?'a':'p'}</span>`); }
  const grid = ticks.map(t => t.replace('g-tick','g-grid').replace(/>[^<]*</,'><')).join('');
  // Oven strip: every oven step on this day (shared by everyone), packed into rows
  const ovenSteps = plan.tasks.filter(t => t.oven && t.day === day && !t.final).map(t => ({t, s: startOf(t), e: startOf(t) + lenOf(t)})).filter(x => x.e > a0 && x.s < a1).sort((a,b) => a.s - b.s);
  const rowsEnd = []; const ovenBars = ovenSteps.map(x => { let r = rowsEnd.findIndex(e => e <= x.s); if(r < 0){ r = rowsEnd.length; rowsEnd.push(x.e); } else rowsEnd[r] = x.e; const w = pct(x.e) - pct(x.s);
    return `<span class="g-obar${isDone(x.t)?' done':''}${inOven(x.t)?' live':''}" style="left:${pct(x.s)}%;width:${Math.max(w,1.2)}%;top:${r*16}px" title="${esc(recipeOf(plan,x.t.r).short)} ${x.t.oven.temp}°F">${w > 9 ? x.t.oven.temp+'°' : ''}</span>`; }).join('');
  const ovenMin = Math.round(ovenSteps.reduce((n,x) => n + (Math.min(x.e,a1) - Math.max(x.s,a0)), 0) / 60000);
  // Busiest stretch: most steps going at once
  let peak = 0, peakAt = null;
  for(const t of list){ const s = startOf(t), c = list.filter(o => startOf(o) <= s && s < startOf(o) + Math.max(lenOf(o), 60000)).length; if(c > peak){ peak = c; peakAt = s; } }
  const first = list[0], last = list.reduce((m,t) => Math.max(m, startOf(t)+lenOf(t)), 0);
  const rows = list.map(t => {
    const s = prog(t.id), done = !!s.done, io = inOven(t), st0 = startOf(t), ty = JOB_TYPES[jobType(t)];
    const late = !done && !active(t) && t.who==='mm' && !t.optional && nowMs - sched(plan,t,true) > 10*60000;
    const when = t.who === 'h' ? dueLabel(plan, t) : (lenOf(t) ? `${fmtTime(st0)}–${fmtTime(st0+lenOf(t))}` : fmtTime(st0));
    const who = t.who === 'h' ? (s.assignee ? personName(s.assignee) : 'Open') : (ownerOf(t.r) ? personName(ownerOf(t.r)) : '');
    const state = done ? 'Done' : io ? `In oven since ${fmtTime(s.inOvenAt)}` : started(t) ? `Started ${fmtTime(s.startedAt)}` : late ? 'Late' : '';
    const meta = [when, recipeOf(plan,t.r).short, t.oven ? t.oven.temp+'°F' : '', who, state].filter(Boolean).join(' · ');
    const w = pct(st0 + lenOf(t)) - pct(st0);
    const label = done ? `Mark "${t.title}" not done` : `Mark "${t.title}" done`;
    return `<li class="g-row${done?' done':''}${io?' live':''}${late?' late':''}" style="--tc:${ty.color}">
      <div class="g-head"><button class="check sm${io?' inoven':''}" data-act="toggle" data-id="${t.id}" aria-pressed="${done}" aria-label="${esc(label)}">${io && !done ? I_FLAME : I_CHECK}</button>
        <div class="g-txt"><span class="g-title">${esc(t.title)}</span><span class="g-meta">${esc(meta)}</span></div>
        <button class="vi g-vi" data-act="taskModal" data-id="${t.id}" aria-label="View instructions for ${esc(t.title)}"><span class="vi-ic" aria-hidden="true">${I_PLUS}</span>Instructions</button></div>
      <div class="g-track"><span class="g-bar" style="left:${pct(st0)}%;width:${Math.max(w, 1.4)}%"></span></div>
    </li>`;
  }).join('');
  const nowIn = nowMs > a0 && nowMs < a1 ? `<span class="g-now" style="left:${pct(nowMs)}%"><b>${esc(fmtTime(nowMs))}</b></span>` : '';
  const dz = dinnerAt(plan), dinIn = day === 'thu' && dz > a0 && dz <= a1 ? `<span class="g-dinner" style="left:${pct(dz)}%"><b>Dinner</b></span>` : '';
  const legend = `<div class="legend">${Object.values(JOB_TYPES).map(x => `<span class="lg"><i style="background:${x.color}"></i>${x.label}</span>`).join('')}</div>`;
  const zoomSeg = `<div class="seg small" role="group" aria-label="Zoom"><button data-act="zoom" data-v="day" aria-pressed="${zoom==='day'}">Whole day</button><button data-act="zoom" data-v="am" aria-pressed="${zoom==='am'}">Morning</button><button data-act="zoom" data-v="pm" aria-pressed="${zoom==='pm'}">Afternoon</button></div>`;
  const stats = list.length ? `<div class="g-stats"><div><b>${esc(fmtTime(startOf(first)))}–${esc(fmtTime(last))}</b><span>First step to last</span></div><div><b>${dur(ovenMin)}</b><span>Oven in use</span></div><div><b>${peak} at once</b><span>Busiest, around ${esc(fmtTime(peakAt))}</span></div></div>` : '';
  return `${zoomSeg}${stats}${legend}
    <div class="gantt">
      <div class="g-axis">${ticks.join('')}</div>
      <div class="g-body">
        <div class="g-gridlines" aria-hidden="true">${grid}${dinIn}${nowIn}</div>
        ${ovenSteps.length ? `<div class="g-oven"><span class="g-olabel">Oven</span><div class="g-otrack" style="height:${rowsEnd.length*16}px">${ovenBars}</div></div>` : ''}
        <ol class="g-rows">${rows || '<li class="empty">Nothing in this part of the day.</li>'}</ol>
      </div>
    </div>`;
}

function renderOwner(){
  const plan = S.plan, nowMs = now(), mine = myDishes();
  const tasks = plan.tasks.filter(myTask);
  const cook = tasks.filter(t => t.who==='mm' && mine.includes(t.r) && !t.optional && !t.final);
  const p = (() => { let n=0, nd=0, tot=0, dn=0; for(const t of tasks){ if(t.optional) continue; n++; tot+=weight(t); if(isDone(t)){ nd++; dn+=weight(t); } } return {n, nd, pct: tot ? Math.round(dn/tot*100) : 0}; })();
  let finish = 0, slip = 0;
  const dz0 = dinnerAt(plan);
  for(const t of cook){ if(t.day !== 'thu') continue; finish = Math.max(finish, endOf(plan, t)); if(!isDone(t) && sched(plan,t,true) >= dz0 - 150*60000){ const s = prog(t.id), sc = sched(plan,t,true); const late = t.oven && s.inOvenAt ? s.inOvenAt - sc : s.startedAt ? s.startedAt - sc : (sc < nowMs ? nowMs - sc : 0); slip = Math.max(slip, late); } }
  const dz = dinnerAt(plan), eta = (finish || dz) + Math.max(0, slip);
  const pend = mySubs();
  const names = mine.map(r => plan.recipes[r].short);
  const hero = mine.length ? `<section class="card hero" aria-labelledby="eta-h">
    <div class="hero-top"><div><div class="eta-label" id="eta-h">${esc(names.join(', '))} ready by</div><div class="eta tnum">${cook.length && cook.every(isDone) ? 'Done' : esc(fmtTime(eta))}</div></div><div>${eta > dz ? `<span class="pill crit">${dur(mins(eta-dz))} after dinner</span>` : `<span class="pill good">In time for dinner at ${esc(fmtTime(dz))}</span>`}</div></div>

  const pendHtml = pend.length ? `<section class="card"><h2>Waiting for the host</h2>${pend.map(([id,x]) => `<div class="ritem"><span class="tile" aria-hidden="true">${esc((x.recipe.short||'?').slice(0,1).toUpperCase())}</span><div><b>${esc(x.recipe.name)}</b><div class="sub">Sent ${esc(fmtRel(x.at))}. It joins the plan once the host accepts it.</div></div><span></span></div>`).join('')}</section>` : '';
  const empty = !mine.length && !pend.length ? `<section class="card"><h2>No dishes yet</h2><p class="sub" style="margin:0">Pick a dish you're making from the sign-in screen, or add a new one.</p><div class="btns"><button class="btn primary" data-act="go" data-v="addDish">Add a dish</button><button class="btn" data-act="switch">Pick a dish</button></div></section>` : '';
  const al = liveAlerts(myTask);
  const upcoming = tasks.filter(t => !isDone(t) && !inOven(t) && !t.optional && t.who==='mm').sort((a,b)=>sched(plan,a,true)-sched(plan,b,true)).slice(0,3);

    <div class="tasks">${upcoming.map((t,i)=>taskRow(t,{withDay:true, open:i===0})).join('')}</div></section>` : '';
  return `<div class="wrap split"><div class="col">${empty}${hero}${pendHtml}${alertsCard(al)}${nextHtml}${tasks.length ? planCard(tasks, 'Your plan') : ''}</div><aside class="rail">${ovenCard()}</aside></div>`;
}

function scheduleSummary(plan, skipRecipe){
  return plan.tasks.filter(t => t.who==='mm' && !t.final && t.r !== skipRecipe).sort((a,b)=>sched(plan,a)-sched(plan,b)).map(t => {
    const s = sched(plan,t), e = endOf(plan,t), u = Object.entries(t.uses||{}).filter(([,q])=>q>0).map(([k,q])=>k+(q>1?'×'+q:'')).join(',');
    return `- ${t.day} ${hm(s)}-${hm(e)}${t.oven ? ` OVEN ${t.oven.temp}F ${t.oven.slots||1} spot(s)` : ''}${u ? ' uses '+u : ''} | ${recipeOf(plan,t.r).short}: ${t.title}`;
  }).join('\n');
}
function kitchenSummary(plan){ return `Oven: ${plan.kitchen.ovenSpots} sheet-pan spots, one temperature at a time.\nTools (id: name, count): ` + plan.kitchen.tools.map(x => `${x.id}: ${x.name}, ${x.count}`).join('; '); }
function recipePrompt(text, hasImages){
  const plan = S.plan;
  return `You are planning a home Thanksgiving dinner. Read the recipe ${hasImages ? 'in the attached photo(s)' : 'below'} and turn it into structured data plus a cooking schedule that fits around the existing plan.

DINNER: Thursday at ${plan.dinner} (24h). Cooking happens on Wednesday ("wed") and Thursday ("thu").
KITCHEN: ${kitchenSummary(plan)}
EXISTING COOK STEPS (day start-end, oven, tools | dish: step):
${scheduleSummary(plan) || '(none yet)'}

RULES
- Split the recipe into timed cook steps (who "mm") done by the dish's cook, and simple prep jobs (who "h") for helpers: chopping, peeling, measuring, grating, zesting, setting out ingredients, lining pans, washing up. Helpers never do oven work, stovetop cooking, tasting or seasoning decisions.
- Do on Wednesday whatever the recipe allows to be made ahead (doughs, fillings, sauces, chilling, braises, pies). Do day-of steps on Thursday so the dish is ready, hot or fresh at dinner.
- The dish must be ready by dinner; its last steps end at or just before ${plan.dinner} Thursday.
- Every oven step needs temp (F), min and max minutes, sheet-pan spots (a casserole dish or pie counts as 1) and how to tell it's done. Do not overlap existing oven steps that use a different temperature, and never need more than ${plan.kitchen.ovenSpots} spots at once.
- Do not book a tool beyond its count at the same time as existing steps. Use the tool ids given.
- Helper jobs: "for" is the exact title of the cook step they prepare for, "before" is how many minutes before that step it must be done, "from" is the earliest day and time they can start.
- Step instructions are short, imperative lines someone can follow at the counter. Keep the recipe's quantities.
- Times are 24h "HH:MM" in multiples of 5. Minutes are whole numbers.

Reply with only JSON in this shape:
{"name":"Full dish name","short":"1-2 word name","meta":["yield","oven temp and time","make-ahead note"],"notes":["anything the cook must not miss"],"ingredients":[{"g":"group name","items":["1 cup flour"]}],"steps":[{"h":"short title","x":"instructions"}],"tasks":[{"title":"","who":"mm","day":"thu","t":"14:00","dur":20,"steps":["line"],"uses":{"bigPot":1},"oven":{"temp":350,"min":40,"max":45,"slots":1,"check":"golden and set"},"for":null,"before":0,"from":["thu","08:00"]}]}
Use "oven": null for steps that don't use the oven. If this isn't a recipe, reply {"error":"what's wrong, in one short sentence"}.
${hasImages ? '' : `\nRECIPE:\n"""\n${text.slice(0, 60000)}\n"""`}`;
}
const str = v => (v == null ? '' : String(v)).trim();
const arr = v => Array.isArray(v) ? v.map(str).filter(Boolean) : [];
const clampInt = (v, lo, hi, d) => { const n = Math.round(Number(v)); return isFinite(n) ? Math.max(lo, Math.min(hi, n)) : d; };
const validHM = v => { const m = /^(\d{1,2}):(\d{2})$/.exec(str(v)); if(!m) return null; const h = +m[1], mi = +m[2]; return h < 24 && mi < 60 ? fromMin(h*60 + Math.round(mi/5)*5) : null; };
function aiTasks(list, k, plan){
  const toolIds = new Set(plan.kitchen.tools.map(x => x.id)), byTitle = {};
  const items = (Array.isArray(list) ? list : []).slice(0, 40).map((x, i) => { const id = 'x-' + k.slice(2) + '-' + i + Math.random().toString(36).slice(2,5); byTitle[str(x.title).toLowerCase()] = id; return {x, id}; });
  let prevCook = null;
  return items.map(({x, id}) => {
    const day = x.day === 'wed' ? 'wed' : 'thu', t = validHM(x.t) || '12:00';
    const base = {id, r:k, day, t, title: str(x.title) || 'Step', steps: arr(x.steps)};
    if(x.who === 'h'){
      const d = clampInt(x.dur, 1, 240, 10), f = x.for && byTitle[str(x.for).toLowerCase()];
      const from = Array.isArray(x.from) && validHM(x.from[1]) ? [x.from[0] === 'wed' ? 'wed' : 'thu', validHM(x.from[1])] : [day, '08:00'];
      return Object.assign(base, {who:'h', dur:d, from}, f ? {for:{id:f, before: clampInt(x.before, -60, 600, 0)}} : {due:[day, fromMin(toMin(t) + d)]});
    }
    const uses = {}; for(const [kk, q] of Object.entries(x.uses || {})) if(toolIds.has(kk) && Number(q) > 0) uses[kk] = Math.min(9, Math.round(Number(q)));
    let oven = null;
    if(x.oven && Number(x.oven.temp)){ oven = {temp: clampInt(x.oven.temp, 150, 550, 350), slots: clampInt(x.oven.slots, 1, 8, 1), min: clampInt(x.oven.min, 1, 720, 30), check: str(x.oven.check)}; oven.max = Math.max(oven.min, clampInt(x.oven.max, 1, 720, oven.min)); }
    const needs = prevCook ? [prevCook] : []; prevCook = id;
    return Object.assign(base, {who:'mm', dur: oven ? oven.min : clampInt(x.dur, 0, 600, 15), uses, needs}, oven ? {oven} : {});
  });
}
function draftFromAI(j){
  const k = rid('r-'), p = clone(S.plan), name = str(j.name) || 'New dish';
  p.recipes[k] = {name, short: str(j.short).slice(0, 20) || name.split(/\s+/).slice(-1)[0], meta: arr(j.meta), notes: arr(j.notes),
    ingredients: (Array.isArray(j.ingredients) ? j.ingredients : []).map(g => ({g: str(g && g.g) || 'Ingredients', items: arr(g && g.items)})),
    steps: (Array.isArray(j.steps) ? j.steps : []).map(s => ({h: str(s && s.h), x: str(s && s.x)}))};
  p.recipeOrder.push(k);
  p.tasks.push(...aiTasks(j.tasks, k, p));
  return {plan: p, recipeId: k};
}
async function readRecipe(){
  const A = S.add; A.error = '';
  const ta = document.getElementById('add-text'); if(ta) A.text = ta.value;
  const own = document.getElementById('add-own'); if(own) A.own = own.checked;
  const photo = A.mode === 'photo';
  if(photo ? !A.files.length : A.text.trim().length < 40){ A.error = photo ? 'Add a photo of the recipe first.' : 'Paste the recipe, including its ingredients and instructions.'; render(); return; }
  const sample = await getSample();
  if(!sample){ A.error = 'Reading recipes needs Claude, which isn\'t available in this view. You can enter the dish by hand instead.'; render(); return; }
  A.busy = true; A.status = 'Reading the recipe and fitting it into the day. This can take a minute.'; A.ctl = new AbortController(); render();
  try{
    const j = await sample.json(recipePrompt(A.text, photo), Object.assign({signal: A.ctl.signal, modelTier:'default'}, photo ? {images: A.files.slice(0,4)} : {}));
    if(!j || typeof j !== 'object' || j.error){ A.error = (j && j.error) ? `Claude couldn't use that: ${j.error}` : 'Claude couldn\'t read a recipe there. Try pasting the text.'; return; }
    const d = draftFromAI(j);
    S.draft = {kind:'recipe', mode:'new', plan:d.plan, base:clone(S.plan), recipeId:d.recipeId, own: isHost() ? false : A.own, ownerKey: isHost() ? null : (A.own ? S.key : null)};
    S.add = null; S.openTask = null; S.view = 'editRecipe'; window.scrollTo(0,0);
  }catch(e){
    const c = e && e.code;
    A.error = c === 'cancelled' ? '' : c === 'not_granted' || c === 'sampling_disabled' ? 'Claude isn\'t allowed here, so the recipe can\'t be read automatically. You can enter it by hand.'
      : c === 'rate_limited' ? 'Claude is busy or you\'ve hit a usage limit. Try again in a little while.'
      : c === 'image_rejected' ? 'That photo couldn\'t be used. Try a clearer JPEG or PNG.'
      : c === 'invalid_json' ? 'Claude\'s answer came back incomplete. Try again, or paste less text.'
      : c === 'prompt_too_large' ? 'That recipe is too long. Paste just the ingredients and instructions.'
      : 'Something went wrong reading the recipe. Try again.';
  }finally{ A.busy = false; render(); }
}
function manualRecipe(){
  const k = rid('r-'), p = clone(S.plan);
  p.recipes[k] = {name:'New dish', short:'New dish', meta:[], notes:[], ingredients:[{g:'Ingredients', items:[]}], steps:[]};
  p.recipeOrder.push(k);

async function fixWithAI(){
  const d = S.draft; if(!d) return;
  const sample = await getSample();
  if(!sample){ toast('Claude isn\'t available in this view.'); return; }
  const issues = planIssues(d.plan).map(i => '- ' + i.text).join('\n');
  const mine = d.plan.tasks.filter(t => t.r === d.recipeId && t.who === 'mm').map(t => `- id ${t.id} | ${t.day} ${t.t} for ${len(t)} min${t.oven ? ` OVEN ${t.oven.temp}F ${t.oven.slots||1} spot(s)` : ''} | ${t.title}`).join('\n');
  const prompt = `Reschedule this dish's cook steps so they fit around the other steps with no conflicts. Keep its own order, keep make-ahead steps on Wednesday where possible, and finish by Thursday ${d.plan.dinner}.
KITCHEN: ${kitchenSummary(d.plan)}
OTHER COOK STEPS (fixed):
${scheduleSummary(d.plan, d.recipeId)}
THIS DISH'S STEPS (you may move these):
${mine}
CONFLICTS NOW:
${issues}
Reply with only JSON: {"moves":[{"id":"step id","day":"wed|thu","t":"HH:MM"}]} listing only the steps you move.`;
  S.fixing = true; render();
  try{
    const j = await sample.json(prompt, {modelTier:'default'});
    let n = 0;
    for(const m of (j && Array.isArray(j.moves) ? j.moves : [])){ const t = findTask(d.plan, str(m.id)); const tv = validHM(m.t); if(t && t.r === d.recipeId && t.who === 'mm' && tv){ t.day = m.day === 'wed' ? 'wed' : 'thu'; t.t = tv; n++; } }
    toast(n ? `Moved ${n} step${n>1?'s':''}. Check the panel to see what changed.` : 'Claude didn\'t find a better time. Try moving steps yourself.');
  }catch(e){ toast(e && e.code === 'rate_limited' ? 'Claude is busy. Try again shortly.' : 'Couldn\'t get suggestions right now.'); }
  finally{ S.fixing = false; render(); }
}

function setOwner(rk, key){

function commitDraft(){
  const d = S.draft; if(!d) return null;
  const mode = d.mode || 'edit';
  if(mode === 'new' && !isHost()){
    const r = d.plan.recipes[d.recipeId], tasks = d.plan.tasks.filter(t => t.r === d.recipeId);
    const id = rid('s-'), sub = {recipeId:d.recipeId, recipe:r, tasks, by:S.key, own:!!d.own, at:Date.now()};
    S.subs[id] = sub; persist('submissions/' + id, sub);
