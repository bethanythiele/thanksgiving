  return Object.entries(t.uses || {}).filter(([,q]) => q > 0).map(([k,q]) => (q > 1 ? q + ' × ' : '') + (tm[k] ? tm[k].name : 'Missing tool'));
}
function personName(key){ const p = S.people[key]; return (p && p.name) || 'A helper'; }
function colorFor(key){ let h = 0; for(const c of String(key)) h = (h*31 + c.charCodeAt(0)) >>> 0; return `hsl(${HUES[h % HUES.length]} 55% 42%)`; }

/* Static check of a plan: equipment, oven, order, dinner time, helper windows */
function planIssues(plan){
  const out = [], seen = new Set();
  const add = (lv, text, ids) => { if(seen.has(text)) return; seen.add(text); out.push({lv, text, ids}); };
  const iv = plan.tasks.filter(t => t.who === 'mm' && !t.final).map(t => ({t, s: sched(plan, t), e: endOf(plan, t)}));
  const tm = toolMap(plan);
  for(const {t} of iv) for(const [k, q] of Object.entries(t.uses || {})){
    if(!q) continue;
    const tool = tm[k];
    if(!tool || tool.count < q) add('crit', `"${t.title}" needs ${q} × ${tool ? tool.name.toLowerCase() : 'a tool you removed'}, but your kitchen has ${tool ? tool.count : 0}.`, [t.id]);
  }
  for(const tool of plan.kitchen.tools){
    const users = iv.filter(x => (x.t.uses || {})[tool.id]);
    for(const a of users){
      const act = users.filter(b => b.s <= a.s && a.s < b.e);
      const q = act.reduce((n, b) => n + (b.t.uses[tool.id] || 0), 0);
      if(q > tool.count && act.length > 1) add('crit', `${tool.name}: ${act.map(b => `"${b.t.title}"`).join(' and ')} overlap at ${fmtDT(a.s)}. You have ${tool.count}.`, act.map(b => b.t.id));
    }
  }
  const ov = iv.filter(x => x.t.oven);
  for(const a of ov){
    const act = ov.filter(b => b.s <= a.s && a.s < b.e);
    const slots = act.reduce((n, b) => n + (b.t.oven.slots || 1), 0);
    if(slots > plan.kitchen.ovenSpots) add('crit', `Oven over capacity at ${fmtDT(a.s)}: ${slots} sheet-pan spots needed (${act.map(b => recipeOf(plan, b.t.r).short).join(', ')}), room for ${plan.kitchen.ovenSpots}.`, act.map(b => b.t.id));
    const temps = [...new Set(act.map(b => b.t.oven.temp))];
    if(temps.length > 1) add('crit', `Oven temperature clash at ${fmtDT(a.s)}: ${act.map(b => `${recipeOf(plan, b.t.r).short} ${b.t.oven.temp}°F`).join(' vs ')}.`, act.map(b => b.t.id));
  }
  for(const x of iv) for(const nid of (x.t.needs || [])){
    const n = iv.find(y => y.t.id === nid);
    if(n && n.e > x.s) add('warn', `"${x.t.title}" starts at ${fmtDT(x.s)}, before "${n.t.title}" is done at ${fmtTime(n.e)}.`, [x.t.id, n.t.id]);
  }
  const dz = dinnerAt(plan);
  for(const x of iv) if(!x.t.optional && x.e > dz) add('warn', `"${x.t.title}" finishes at ${fmtDT(x.e)}, after dinner at ${fmtTime(dz)}.`, [x.t.id]);
  for(const t of plan.tasks.filter(t => t.who === 'h')){
    const d = dueOf(plan, t), f = t.from ? at(...t.from) : null;
    if(f && f + (t.dur||0)*60000 > d) add('warn', `Helper job "${t.title}" can't start until ${fmtDT(f)} but is needed by ${fmtDT(d)}.`, [t.id]);
  }
  return out;
}
function plannedFinish(plan){
  let m = dinnerAt(plan);
  for(const t of plan.tasks) if(t.who === 'mm' && t.day === 'thu' && !t.optional && !t.final) m = Math.max(m, endOf(plan, t));
  return m;
}

/* ============ LIVE ANALYSIS ============ */
function progress(filter){
  let total = 0, done = 0, n = 0, nd = 0;
  for(const t of S.plan.tasks){
    if(t.optional || (filter && !filter(t))) continue;
    total += weight(t); n++;
    if(isDone(t)){ done += weight(t); nd++; }
  }
  return {pct: total ? Math.round(done/total*100) : 0, n, nd};
}
function projection(){
  const plan = S.plan, nowMs = now(), dz = dinnerAt(plan);
  let slip = 0;
  for(const t of plan.tasks){
    if(t.day !== 'thu' || t.who !== 'mm' || t.optional || t.final || isDone(t)) continue;
    const sc = sched(plan, t, true); if(sc < dz - 150*60000) continue;
    const s = prog(t.id); let late = 0;
    if(t.oven && s.inOvenAt) late = s.inOvenAt - sc;
    else if(s.startedAt) late = s.startedAt - sc;
    else if(sc < nowMs) late = nowMs - sc;
    slip = Math.max(slip, late);
  }
  const slipMin = Math.max(0, mins(slip));
  const eta = Math.max(plannedFinish(plan), dz + slipMin*60000);
  return {slipMin: mins(eta - dz), eta, allDone: plan.tasks.every(t => t.optional || isDone(t))};
}
function ovenState(){
  const items = S.plan.tasks.filter(inOven);
  return {items, temps:[...new Set(items.map(t => t.oven.temp))], slots: items.reduce((a,t) => a + (t.oven.slots||1), 0)};
}
function nextOvenTask(){ return S.plan.tasks.filter(t => t.oven && t.who==='mm' && !isDone(t) && !inOven(t)).sort((a,b) => sched(S.plan,a,true) - sched(S.plan,b,true))[0]; }
function liveAlerts(f){
  const plan = S.plan, out = [], nowMs = now(), ov = ovenState(), spots = plan.kitchen.ovenSpots;
  const mine = f || (() => true);
  const short = t => recipeOf(plan, t.r).short;
  if(ov.temps.length > 1) out.push({lv:'crit', text:`The oven has food needing different temperatures: ${ov.items.map(t => `${short(t)} at ${t.oven.temp}°F`).join(', ')}.`});
  if(ov.slots > spots) out.push({lv:'crit', text:`The oven is over capacity: ${ov.slots} sheet-pan spots in use, room for ${spots}.`});
  for(const t of ov.items.filter(mine)){
    const s = prog(t.id), el = mins(nowMs - s.inOvenAt);
    if(t.oven.mid && el >= t.oven.mid.at && !s.midDone) out.push({lv:'warn', text:`${t.oven.mid.label} (${el} min in).`, act:'mid', id:t.id, btn:'Done'});
    if(el >= t.oven.max) out.push({lv:'crit', text:`Check the ${short(t).toLowerCase()} now: ${dur(el)} in the oven, recipe max is ${dur(t.oven.max)}.`, act:'out', id:t.id, btn:'It\'s out'});
    else if(el >= t.oven.min) out.push({lv:'warn', text:`${t.title} could be ready (${dur(el)} in). ${t.oven.check || ''}`, act:'out', id:t.id, btn:'It\'s out'});
  }
  const nx = nextOvenTask();
  if(nx && mine(nx) && sched(plan,nx,true) - nowMs <= 10*60000){
    if(ov.items.length && !ov.temps.includes(nx.oven.temp)) out.push({lv:'warn', text:`"${nx.title}" needs ${nx.oven.temp}°F at ${fmtTime(sched(plan,nx,true))}, but the oven still has ${ov.items.map(t=>short(t).toLowerCase()).join(' and ')} at ${ov.temps.join('/')}°F.`});
    const free = Math.max(0, spots - ov.slots);
    if(ov.slots + (nx.oven.slots||1) > spots) out.push({lv:'warn', text:`"${nx.title}" needs ${nx.oven.slots} sheet-pan spot${nx.oven.slots>1?'s':''} at ${fmtTime(sched(plan,nx,true))}. ${free===0 ? 'None are free yet' : 'Only '+free+' '+(free===1?'is':'are')+' free'}, so something has to come out first.`});
  }
  const tm = toolMap(plan), seen = new Set();
  for(const p of plan.tasks){
    if(p.who !== 'mm' || isDone(p) || active(p) || !p.uses || !mine(p)) continue;
    const ps = sched(plan, p, true);
    if(ps - nowMs > 10*60000 || nowMs - ps > 3*3600000) continue;
    for(const [k, need] of Object.entries(p.uses)){
      if(!need || !tm[k]) continue;
      const holders = plan.tasks.filter(o => o !== p && (o.uses||{})[k] && started(o));
      const used = holders.reduce((n,o) => n + o.uses[k], 0);
      if(holders.length && used + need > tm[k].count && !seen.has(k)){
        seen.add(k);
        out.push({lv:'warn', text:`${tm[k].name} is still in use for "${holders[0].title}" (started ${fmtTime(prog(holders[0].id).startedAt)}). "${p.title}" needs it at ${fmtTime(ps)}.`});
      }
    }
  }
  const late = plan.tasks.filter(t => t.who==='mm' && mine(t) && !t.optional && !t.final && !isDone(t) && !active(t) && nowMs - sched(plan,t,true) > 10*60000).sort((a,b)=>sched(plan,a,true)-sched(plan,b,true));
  if(late.length) out.push({lv:'warn', text:`Running behind: "${late[0].title}" was planned for ${fmtRel(sched(plan,late[0],true))}${late.length>1 ? ` (+${late.length-1} more late)` : ''}.`});
  const risky = plan.tasks.filter(t => t.who==='h' && mine(t) && !isDone(t) && dueOf(plan,t) - nowMs <= 20*60000 && nowMs - dueOf(plan,t) < 2*3600000).sort((a,b)=>dueOf(plan,a)-dueOf(plan,b));
  for(const t of risky.slice(0,3)){
    const a = prog(t.id).assignee, d = dueOf(plan,t);
    const when = d < nowMs ? `was needed by ${fmtTime(d)}` : `is needed by ${fmtTime(d)}`;
    out.push({lv: d < nowMs ? 'warn' : 'info', text: a ? `"${t.title}" (${personName(a)}) ${when}.` : `Nobody has claimed "${t.title}". It ${when}.`});
  }
  if(risky.length > 3) out.push({lv:'info', text:`${risky.length-3} more helper jobs are due soon.`});
  const subsN = f ? 0 : Object.keys(S.subs).length;
  if(subsN){ const [sid, sx] = Object.entries(S.subs)[0]; out.push({lv:'info', text: subsN > 1 ? `${subsN} new dishes are waiting for your review.` : `${personName(sx.by)} added "${sx.recipe.name}". It's waiting for your review.`, act:'reviewSub', id:sid, btn:'Review'}); }
  const issues = f ? [] : planIssues(plan);
  if(issues.length) out.push({lv:'info', text:`Your schedule has ${issues.length} conflict${issues.length>1?'s':''} to sort out.`, act:'go', v:'schedule', btn:'Review'});
  const order = {crit:0, warn:1, info:2};
  return out.sort((a,b) => order[a.lv]-order[b.lv]);
}

/* ============ PERSISTENCE ============ */
const queues = {};
function saveTask(id, patch){
  const next = Object.assign({}, prog(id), patch, {by: S.key || null, at: Date.now()});
  S.tasks[id] = next; persist('tasks/' + id, next); render();
}
function savePerson(key, data){ S.people[key] = Object.assign({}, S.people[key], data); persist('people/' + key, S.people[key]); }
function savePlan(plan){ S.plan = plan; persist('plan/current', {plan, at: Date.now(), by: S.key}); render(); }
function persist(path, data){
  if(!db){ lsSet('tg-local2', {tasks:S.tasks, people:S.people, plan:S.plan}); lsSet('tg-subs', S.subs); return; }
  const q = queues[path] || (queues[path] = {busy:false, next:null});
  q.next = JSON.parse(JSON.stringify(data)); if(!q.busy) drain(path);
}
async function drain(path){
  const q = queues[path]; q.busy = true;
  while(q.next){
    const data = q.next; q.next = null;
    try{ await db.doc(path).set(data); if(path !== 'meta/rev') bumpRev(); }
    catch(e){
      const code = e && e.code;
      if(path === 'meta/rev'){ if(code === 'permission-denied') LIVE.off = true; }
      else if(code === 'invalid_argument' || code === 'permission-denied'){ S.conn = 'readonly'; render(); }
      else if(code === 'unavailable'){ await new Promise(r => setTimeout(r, 600 + Math.random()*900)); try{ await db.doc(path).set(data); }catch(e2){ toast('That change didn\'t save. Check your connection and try again.'); } }
      else if(code === 'quota_exceeded'){ toast('The shared plan is full and couldn\'t save that change.'); }
      else toast('That change didn\'t save. Try again.');
    }
  }
  q.busy = false;
}

function viLink(id, open, auto, act){
  return `<button class="vi" data-act="${act||'expand'}" data-id="${id}"${auto?' data-auto="1"':''} aria-expanded="${open}"><span class="vi-ic" aria-hidden="true">${open?I_MINUS:I_PLUS}</span>${open?'Hide instructions':'View instructions'}</button>`;

function neededBy(ms, done){
  const left = mins(ms - now());
  const cls = done ? 'ok' : left < 0 ? 'late' : left <= 20 ? 'soon' : '';
  return `<div class="needby ${cls}">${I_CLOCK}<span><b>Needed by ${esc(fmtRel(ms))}</b>${done ? '' : ` · ${esc(relTo(ms))}`}</span></div>`;
}
function detail(t){
  const plan = S.plan, parts = [];
  if(t.steps && t.steps.length) parts.push(`<ol>${t.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`);
  if(t.oven) parts.push(`<div><b>Done when:</b> ${esc(t.oven.check || '')}</div>`);
  if(t.out) parts.push(`<div><b>When it comes out:</b> ${t.out.map(esc).join(' ')}</div>`);
  if(t.who==='h') parts.push(`<div class="uses">Helper job · can start ${esc(fmtDT(fromOf(plan,t)))} · needed by ${esc(fmtDT(dueOf(plan,t)))}</div>`);
  const u = usesList(plan, t); if(u.length) parts.push(`<div class="uses">Uses: ${u.map(esc).join(' · ')}</div>`);
  if(t.notes && t.notes.length) parts.push(`<div class="note"><ul>${t.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`);
  return `<div class="detail">${parts.join('')}</div>`;
}
/* Time shown on a helper job: open ones lead with when to start; claimed or done ones show their deadline */
function helperTime(plan, t, viewDay){
  const due = dueOf(plan, t), dueTxt = (viewDay && dayOf(due) === viewDay) || dayOf(due) === dayOf(now()) ? fmtTime(due) : fmtDT(due);
  const q = !isDone(t) && !prog(t.id).assignee ? helperQueue(plan)[t.id] : null;
  if(!q) return `<span class="time">${esc('by ' + dueTxt)}</span>`;
  const st = startsNow(q.start) ? 'Start now' : 'Start ' + (dayOf(q.start) === dayOf(now()) || dayOf(q.start) === viewDay ? fmtTime(q.start) : fmtDT(q.start));
  return `<span class="time${startsNow(q.start) ? ' go' : ''}">${esc(st)}</span><span class="sub">due ${esc(dueTxt)}</span>`;
}

  return `<div class="task${done?' done':''}${t.who==='h' && s.assignee && !done ? ' claimed' : ''}"${t.who==='h' && s.assignee && !done ? ` style="--pc:${colorFor(s.assignee)}"` : ''}>
    <button class="check${t.oven?' oven':''}${io?' inoven':''}" data-act="toggle" data-id="${t.id}" aria-pressed="${done}" aria-label="${esc(label)}">${io && !done ? I_FLAME : I_CHECK}</button>
    <div class="tmain">
      <div class="trow"><div class="tmeta">${t.who==='h' ? helperTime(plan, t, opts.viewDay) : `<span class="time">${fmtTime(sc)}</span>`}${opts.withDay && t.who !== 'h' ? `<span class="sub">${DAY_SHORT[t.day]}</span>` : ''}${chips.join('')}</div></div>

      ${opts.forceOpen ? '' : viLink(t.id, open, opts.open)}
      ${timer}
      ${open ? detail(t) : ''}
      ${actions ? `<div class="btns">${actions}</div>` : ''}
    </div>
  </div>`;
}

/* Switch a step between host-only and helper job. Each direction remembers what it replaced, so switching back restores it. */
function makeHelperJob(p, t){
  if(!t || t.who === 'h' || t.final) return;
  if(t.wasHelper){
    const w = t.wasHelper, moved = w.at && (w.at[0] !== t.day || w.at[1] !== t.t);
    t.who = 'h'; delete t.oven; delete t.uses; delete t.for; delete t.due;
    if(moved){ const e = sched(p, t) + Math.max(5, t.dur||5) * 60000; t.from = [t.day, t.t]; t.due = [dayOf(e), hm(e)]; }
    else { if(w.from) t.from = w.from; else delete t.from; if(w.for) t.for = w.for; else if(w.due) t.due = w.due; else t.due = [t.day, t.t]; if(w.day){ t.day = w.day; t.t = w.t; } }
    delete t.wasHelper; return;
  }
  const s = sched(p, t), e = s + Math.max(5, len(t)) * 60000, due = [dayOf(e), hm(e)];
  t.wasCook = {day:t.day, t:t.t, dur:t.dur, uses:t.uses || {}, oven:t.oven || null, after:t.after || null, due};
  t.who = 'h'; t.dur = Math.max(5, len(t)); t.from = [t.day, t.t]; t.due = due; delete t.for; t.uses = {}; delete t.oven; delete t.after;
}
function makeHostTask(p, t){
  if(!t || t.who !== 'h') return;
  if(t.wasCook){
    const c = t.wasCook, moved = JSON.stringify(t.due || null) !== JSON.stringify(c.due);
    const d0 = dueOf(p, t) - (t.dur||5)*60000;
    t.who = 'mm'; t.uses = c.uses || {}; if(c.oven) t.oven = c.oven; if(c.dur != null && !moved) t.dur = c.dur;
    if(moved){ t.day = dayOf(d0); t.t = hm(d0); } else { t.day = c.day; t.t = c.t; if(c.after) t.after = c.after; }
    delete t.from; delete t.due; delete t.for; delete t.wasCook; return;
  }
  const d0 = dueOf(p, t) - (t.dur||5)*60000;
  t.wasHelper = {from:t.from||null, for:t.for||null, due:t.due||null, day:t.day, t:t.t}; t.who = 'mm'; t.day = dayOf(d0); t.t = hm(d0); t.wasHelper.at = [t.day, t.t];
}

      ${(() => { const asked = plan.tasks.filter(t => t.who === 'h' && (offerOf(t) || {}).to === x.k); return asked.length ? `<p class="pc-l">Asked, waiting for an answer</p><ul class="pjobs">${asked.map(t => `<li class="pj"><div class="pj-main"><b>${esc(t.title)}</b><div class="pj-meta">${chipR(t)}due ${esc(fmtDT(dueOf(plan,t)))}</div></div><button class="btn small ghost" data-act="cancelOffer" data-id="${t.id}">Cancel</button></li>`).join('')}</ul>` : ''; })()}
      <div class="btns"><button class="btn small" data-act="askPerson" data-v="${esc(x.k)}">Ask ${esc(x.p.name || 'them')} to do a job</button></div>

    <div class="tasks">${open.length ? open.map(t => {

  const doneCard = finished.length ? `<section class="card"><details class="fin"><summary><h2>Finished jobs</h2><span class="sub">${finished.length} of ${hj.length}</span></summary>

  const converted = plan.tasks.filter(t => t.who === 'mm' && t.wasHelper);
  const conv = converted.length ? `<section class="card"><h2>Moved off the helper list</h2><p class="sub" style="margin:0">Former helper jobs that are now host-only.</p>

  return `<div class="wrap split"><div class="col">${team}${openCard}</div><aside class="rail">${doneCard}${conv}</aside></div>`;

/* ============ EDITORS: shared ============ */
function startDraft(kind, extra){ S.draft = Object.assign({kind, plan: clone(S.plan), base: clone(S.plan)}, extra || {}); }
function dirty(){ return !!S.draft && (JSON.stringify(S.draft.plan) !== JSON.stringify(S.draft.base) || !!S.draft.ownerChanged); }
function impactHtml(){
  const d = S.draft; if(!d) return '';
  const plan = d.plan, base = d.base;
  const iss = planIssues(plan), baseKeys = new Set(planIssues(base).map(i=>i.text));
  const pf = plannedFinish(plan), goal = dinnerAt(plan), pfBase = plannedFinish(base);
  const moved = [];
  for(const t of plan.tasks){
    const b = findTask(base, t.id);
    if(!b){ moved.push(`Added: "${t.title}"`); continue; }
    if(t.who !== b.who){ moved.push(`"${t.title}" is now ${t.who==='mm' ? 'a host-only task' : 'a helper job'}`); continue; }
    if(t.who === 'mm'){ const a = sched(base,b), z = sched(plan,t); if(a !== z || len(b) !== len(t)) moved.push(`"${t.title}": ${fmtDT(a)} → ${fmtDT(z)}${len(b)!==len(t) ? ` (${dur(len(b))} → ${dur(len(t))})` : ''}`); }
    else { const a = dueOf(base,b), z = dueOf(plan,t); if(a !== z) moved.push(`Helper deadline "${t.title}": by ${fmtDT(a)} → by ${fmtDT(z)}`); }
  }
  for(const b of base.tasks) if(!findTask(plan, b.id)) moved.push(`Removed: "${b.title}"`);
  const finishLine = pf > goal ? `<span class="pill crit">Food ready ${esc(fmtTime(pf))}, ${dur(mins(pf-goal))} after your ${esc(fmtTime(goal))} goal</span>` : `<span class="pill good">Everything ready by ${esc(fmtTime(goal))}</span>`;
  return `<div class="impact">
    <div class="card-h"><h2>What this changes</h2>${dirty() ? '<span class="pill warn">Not saved</span>' : '<span class="pill neutral">No changes yet</span>'}</div>

/* ============ LANE LAYOUT (estimates text height so nothing is cut off) ============ */
function estLines(text, widthPx, charPx){
  const cpl = Math.max(6, Math.floor((widthPx - 22) / charPx));
  let lines = 1, cur = 0;
  for(const w of String(text).split(/\s+/)){ const L = w.length; if(cur === 0) cur = L; else if(cur + 1 + L <= cpl) cur += 1 + L; else { lines++; cur = L; } while(cur > cpl){ lines++; cur -= cpl; } }
  return lines;
}
function layoutLane(items, laneW, ppm, heightFor, startM){
  // Columns come from real time overlap only; long text pushes later blocks in the same column down.
  const sorted = items.slice().sort((a,b) => a.s - b.s);
  const cols = [], colOf = {};
  for(const x of sorted){ const e = x.s + Math.max(x.d, 15); let c = cols.findIndex(end => end <= x.s); if(c < 0){ c = cols.length; cols.push(e); } else cols[c] = e; colOf[x.id] = c; }
  const n = Math.max(1, cols.length), colW = laneW / n - 4;
  const place = {}, bottoms = new Array(n).fill(-Infinity);
  let bottom = 0;
  for(const x of sorted){
    const c = colOf[x.id], h = Math.max(x.d * ppm, heightFor(x, colW));
    const y = Math.max((x.s - startM) * ppm, bottoms[c] + 6);
    bottoms[c] = y + h; bottom = Math.max(bottom, y + h);
    place[x.id] = {col:c, y, h};
  }
  return {place, n, bottom};
}

/* ============ EDITOR: schedule (drag and drop) ============ */
const PPM = 2; // pixels per minute
function laneOf(t){ return t.oven ? 'oven' : (Object.values(t.uses||{}).some(q=>q>0) ? 'tools' : 'hands'); }
function renderSchedule(){
  const plan = S.draft.plan;
  const day = S.schedDay || (now() < at('thu','00:00') ? 'wed' : 'thu');
  S.schedDay = day;
  const tasks = plan.tasks.filter(t => t.who==='mm' && t.day===day && !t.final);
  const issues = planIssues(plan), bad = new Set(issues.flatMap(i => i.ids));
  let startM = 7*60, endM = day==='thu' ? toMin(plan.dinner) + 60 : 22*60;
  for(const t of tasks){ const s = toMin(t.t); startM = Math.min(startM, Math.floor(s/60)*60); endM = Math.max(endM, Math.ceil((s+len(t))/60)*60); }
  const lanes = [['oven','Oven'],['tools','Stove & tools'],['hands','Hands-on']];
  const LANE_W = 235;
  const lay = {};
  for(const [k] of lanes){
    const items = tasks.filter(t => laneOf(t)===k).map(t => ({id:t.id, s:toMin(t.t), d:len(t), title:t.title}));
    const hf = (it, w) => 18 + 10 + 17 + estLines(it.title, w, 7.8) * 17 + 10;
    let L = layoutLane(items, LANE_W, PPM, hf, startM);
    const w = Math.max(LANE_W, L.n * 150);
    if(w !== LANE_W) L = layoutLane(items, w, PPM, hf, startM);
    L.w = w; lay[k] = L;
  }
  endM = Math.min(endM, 24*60);
  const H = Math.max((endM - startM) * PPM, ...Object.values(lay).map(l => l.bottom + 12));
  const lanesHtml = lanes.map(([k,label]) => {
    const items = tasks.filter(t => laneOf(t)===k);
    const L = lay[k], n = L.n;
    return `<div class="lane" data-lane="${k}"><div class="lane-h">${label}</div><div class="lane-body" style="height:${H}px">
      ${items.map(t => { const s = toMin(t.t), pl = L.place[t.id];
        return `<div class="blk${bad.has(t.id)?' bad':''}" data-id="${t.id}" style="top:${pl.y}px;min-height:${pl.h}px;left:calc(${pl.col*100/n}% + 2px);width:calc(${100/n}% - 4px);--h:${hueOf(plan,t.r)}">
          <button class="grip" data-grip="${t.id}" aria-label="Move ${esc(t.title)}. Use arrow keys to shift by 5 minutes.">• • •</button>
          <button class="blk-body" data-act="editTime" data-id="${t.id}"><span class="blk-time tnum">${fmtTime(at(day,t.t))}</span><span class="blk-t">${esc(t.title)}</span></button>
        </div>`; }).join('')}
    </div></div>`;
  }).join('');
  const hours = []; for(let m = startM; m <= endM; m += 60) hours.push(`<div class="hr" style="top:${(m-startM)*PPM}px"><span>${fmtTime(at(day, fromMin(m)))}</span></div>`);
  const body = `<section class="card">
    <div class="card-h"><div class="seg" role="group" aria-label="Day"><button data-act="schedDay" data-v="wed" aria-pressed="${day==='wed'}">Wednesday</button><button data-act="schedDay" data-v="thu" aria-pressed="${day==='thu'}">Thursday</button></div><span class="sub">Drag a step by its top strip to move it · tap it to set an exact time</span></div>
    <div class="timeline" style="height:${H+40}px;grid-template-columns:60px minmax(${lanes.reduce((a,[k])=>a+lay[k].w,0)+16}px,1fr)"><div class="hours">${hours.join('')}</div><div class="lanes" style="grid-template-columns:${lanes.map(([k])=>`minmax(${lay[k].w}px,${lay[k].w}fr)`).join(' ')}">${lanesHtml}</div></div>
    <p class="sub" style="margin:0">Helper jobs aren't on the timeline. Their deadlines follow the step they're for, listed under "Steps that moved".</p>
  </section>`;
  return editorPage('Schedule', 'Move your steps and watch conflicts and helper deadlines update.', body);
}

/* ============ HELPER VIEW ============ */

  if(fromOf(plan, t) <= now()) return `<div class="startbadge">${I_CLOCK}<b>Ready now</b><span> · suggested start ${esc(fmtTime(q.start))}</span></div>`;
  return '';
}

/* ============ ROLES ============ */
function keyFor(name){ const sl = String(name||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'').slice(0,24) || 'me'; return (S.baseKey || 'local') + '-' + sl; }
function roleOf(me){ return me ? (me.role === 'mm' ? 'host' : me.role) : null; }
const isHost = () => roleOf(S.me) === 'host';
function dishesOf(key){ const p = S.people[key]; return (p && Array.isArray(p.dishes)) ? p.dishes : []; }
function myDishes(){ return S.key ? dishesOf(S.key).filter(r => S.plan.recipes[r]) : []; }
function ownerOf(r){ for(const [k,p] of Object.entries(S.people)) if(Array.isArray(p.dishes) && p.dishes.includes(r)) return k; return null; }
function canEditRecipe(r){ return isHost() || myDishes().includes(r); }
function myTask(t){ return myDishes().includes(t.r) || prog(t.id).assignee === S.key; }
function mySubs(){ return Object.entries(S.subs).filter(([,x]) => x.by === S.key); }
/* host · owner (owns at least one dish, or picked "dish owner") · helper */
function effRole(){
  const r = roleOf(S.me);
  if(r === 'host') return 'host';
  if(r === 'owner' || myDishes().length || mySubs().some(([,x]) => x.own)) return 'owner';
  return 'h';
}
function homeView(){ const r = effRole(); return r === 'host' ? 'dashboard' : r === 'owner' ? 'mine' : 'helper'; }

function carriedOver(tasks, day){
  return day === 'thu' && now() >= at('thu','00:00') ? tasks.filter(t => t.day === 'wed' && !isDone(t) && !t.final) : [];
}
function planCard(tasks, title){
  const plan = S.plan, nowMs = now();
  const day = S.planDay || (nowMs < at('thu','00:00') ? 'wed' : 'thu');
  // Rows run in the order of the time they show: start time for steps, deadline for helper jobs.
  // Helper jobs that can be done today but aren't due until tomorrow get their own group at the end.
  // Leftovers from Wednesday: what matters is when they're due, not when they could have been done.
  // Ones whose time has already passed (Wednesday cook steps, helper jobs due Wednesday) are behind and go first;
  // helper jobs that just weren't done early slot into today's list at their deadline.
  // Helper jobs sit on the day of the time they show (open ones: their suggested start), so prep that could have
  // been done earlier comes up as "Start now" instead of waiting by its deadline. Unfinished Wednesday cook steps are behind.
  const onDay = t => t.who === 'h' ? dayOf(listTime(plan, t)) === day : t.day === day;
  const behind = carriedOver(tasks, day).filter(t => t.who !== 'h').sort(byListTime(plan));
  const dayTasks = tasks.filter(onDay).sort(byListTime(plan));
  const hr = t => new Date(listTime(plan,t)).getHours();
  const groups = [['Morning', t=>hr(t)<12], ['Afternoon', t=>hr(t)>=12&&hr(t)<17], ['Evening', t=>hr(t)>=17]];
  const mode = S.planMode || 'list';
  const carryHtml = behind.length ? `<div class="group-h carry-h">Behind from Wednesday <span class="sub">${behind.length} still to do</span></div><div class="tasks">${behind.map(t=>taskRow(t,{carry:true, withDay:true})).join('')}</div>` : '';
  const listHtml = carryHtml + (groups.map(([label,f]) => { const g = dayTasks.filter(f); return g.length ? `<div class="group-h">${label}</div><div class="tasks">${g.map(t=>taskRow(t, {viewDay: day})).join('')}</div>` : ''; }).join('') || '<p class="empty">Nothing planned this day.</p>');
  return `<section class="card" aria-labelledby="pl-h">
    <div class="card-h"><h2 id="pl-h">${esc(title)}</h2><div class="seg" role="group" aria-label="View as"><button data-act="planMode" data-v="list" aria-pressed="${mode==='list'}">${IC.list}<span>List</span></button><button data-act="planMode" data-v="timeline" aria-pressed="${mode==='timeline'}">${IC.tl}<span>Timeline</span></button></div></div>
    <div class="card-h"><div class="seg" role="group" aria-label="Day"><button data-act="planDay" data-v="wed" aria-pressed="${day==='wed'}">Wednesday</button><button data-act="planDay" data-v="thu" aria-pressed="${day==='thu'}">Thursday</button></div><span class="sub">${DAY_LABEL[day]}</span></div>
    ${mode === 'timeline' ? gantt(tasks, day) : listHtml}
  </section>`;
}

/* ============ TIMELINE (strategy view: one row per dish) ============ */
const KINDS = {
  prep:{label:'Prep', color:'#B98A5E'},
  stove:{label:'Stovetop', color:'#D9A21B'},
  oven:{label:'Oven', color:'#E95322'}
};
function fmtShort(ms){ const d = new Date(ms), h = d.getHours(), m = d.getMinutes(); return (h%12||12) + (m ? ':' + String(m).padStart(2,'0') : '') + (h < 12 ? 'am' : 'pm'); }
function kindOf(t){ return t.oven ? 'oven' : (t.who !== 'h' && Object.values(t.uses||{}).some(q=>q>0)) ? 'stove' : 'prep'; }
function gantt(tasks, day){
  const plan = S.plan, nowMs = now(), H = 3600000, M = 60000;
  const lenOf = t => Math.max(1, t.who === 'h' ? (t.dur||5) : len(t)) * M;
  // Open helper jobs sit at their suggested start; claimed or done ones end at their deadline
  const startOf = t => t.who === 'h' ? (isDone(t) || prog(t.id).assignee ? dueOf(plan, t) - lenOf(t) : listTime(plan, t)) : sched(plan, t, true);
  const all = tasks.filter(t => !t.final && (t.who === 'h' ? dayOf(startOf(t)) === day : t.day === day));
  const carry = carriedOver(tasks, day).filter(t => t.who !== 'h');
  const carryIds = new Set(carry.map(t => t.id));
  const cStart = Math.min(Math.max(nowMs, at(day,'07:00')), at(day,'23:00'));
  const pos = t => carryIds.has(t.id) ? cStart : startOf(t);
  const items = all.concat(carry);
  if(!items.length) return '<p class="empty">Nothing planned this day.</p>';
  // Time axis: busy stretches get the room; idle stretches (45+ min with nothing going on) shrink to a narrow "break" band
  const Q = 15*M, ivs = items.map(t => [Math.floor((pos(t) - 5*M)/Q)*Q, Math.ceil((pos(t) + lenOf(t) + 5*M)/Q)*Q]);
  if(day === 'thu'){ const dz0 = dinnerAt(plan); ivs.push([dz0 - Q, dz0 + Q]); }
  ivs.sort((x,y) => x[0] - y[0]);
  const act = []; for(const iv of ivs){ const l = act[act.length-1]; if(l && iv[0] <= l[1] + 45*M) l[1] = Math.max(l[1], iv[1]); else act.push([...iv]); }
  const GAP = 6, gaps = act.length - 1, activeMs = act.reduce((n,x) => n + x[1] - x[0], 0), perMs = (100 - gaps*GAP) / activeMs;
  const segs = []; let xx = 0;
  act.forEach((x, i) => { const w = (x[1]-x[0]) * perMs; segs.push({s:x[0], e:x[1], x0:xx, x1:xx+w}); xx += w; if(i < gaps){ segs.push({s:x[1], e:act[i+1][0], x0:xx, x1:xx+GAP, gap:true}); xx += GAP; } });
  const a0 = act[0][0], a1 = act[act.length-1][1];
  const pct = ms => { if(ms <= a0) return 0; if(ms >= a1) return 100; const g = segs.find(z => ms >= z.s && ms <= z.e); return g.x0 + (ms - g.s) / (g.e - g.s) * (g.x1 - g.x0); };
  // Whole hours first, then the start of each busy stretch if there's room; skip labels the "now" marker would cover
  const hours = [], starts = [];
  for(const z of segs){ if(z.gap) continue; starts.push(z.s); for(let x = Math.ceil(z.s/3600000)*3600000; x <= z.e; x += 3600000) hours.push(x); }
  const nowPx = nowMs > a0 && nowMs < a1 ? pct(nowMs) : -99, taken = [];
  const fits = px => Math.abs(px - nowPx) >= 9 && taken.every(q => Math.abs(q - px) >= 12);
  for(const x of [...hours, ...starts]){ const px = pct(x); if(fits(px)) taken.push(px); }
  const ticks = [], grid = [];
  for(const x of [...new Set([...hours, ...starts])].sort((p,q) => p - q)){ const px = pct(x); if(!taken.includes(px)) continue; taken.splice(taken.indexOf(px), 1); ticks.push(`<span class="t2-tick" style="left:${px}%">${esc(fmtShort(x))}</span>`); grid.push(`<span class="t2-grid" style="left:${px}%"></span>`); }
  for(const z of segs) if(z.gap) grid.push(`<span class="t2-gap" style="left:${z.x0}%;width:${z.x1-z.x0}%" title="Nothing scheduled ${esc(fmtShort(z.s))}–${esc(fmtShort(z.e))}"></span>`);
  const stateOf = t => { const s = prog(t.id);
    if(s.done) return 'done';
    if(inOven(t) || started(t)) return 'live';
    if(carryIds.has(t.id)) return 'carry';
    if(day === 'wed' && nowMs >= at('thu','00:00') && !t.final) return 'moved';
    if(!t.optional && (t.who === 'h' ? nowMs > dueOf(plan, t) : nowMs > pos(t) + 10*M)) return 'late';
    return 'todo'; };
    // Group by dish, in the plan's dish order; kitchen chores last
  const order = [...(plan.recipeOrder||[]), ...Object.keys(plan.recipes).filter(r => !(plan.recipeOrder||[]).includes(r))];
  const byDish = new Map();
  for(const t of items){ const r = plan.recipes[t.r] ? t.r : '_kitchen'; if(!byDish.has(r)) byDish.set(r, []); byDish.get(r).push(t); }
  const keys = [...order.filter(r => byDish.has(r)), ...(byDish.has('_kitchen') ? ['_kitchen'] : [])];
  let doneN = 0; for(const t of items) if(prog(t.id).done) doneN++;
  const rows = keys.map(r => {
    const list = byDish.get(r).sort((a,b) => pos(a) - pos(b));
    const name = r === '_kitchen' ? 'Kitchen' : recipeOf(plan, r).short || recipeOf(plan, r).name;
    const nd = list.filter(t => prog(t.id).done).length;
    // Merge back-to-back steps of the same kind into one phase block
    const blocks = [];
    for(const t of list){
      const k = kindOf(t), s = pos(t), e = s + lenOf(t), c = carryIds.has(t.id);
      const b = blocks.find(x => x.k === k && x.c === c && s <= x.e + 15*M && (k !== 'oven' || x.temp === t.oven.temp));
      if(b){ b.e = Math.max(b.e, e); b.ts.push(t); } else blocks.push({k, c, s, e, ts:[t], temp: t.oven && t.oven.temp});
    }
    blocks.sort((a,b) => a.s - b.s);
    const ends = [];
    const bars = blocks.map(bk => {
      let row = ends.findIndex(x => x <= bk.s); if(row < 0){ row = ends.length; ends.push(bk.e); } else ends[row] = bk.e;
      const sts = bk.ts.map(stateOf), n = bk.ts.length, dn = sts.filter(x => x === 'done').length;
      const st = dn === n ? 'done' : sts.includes('live') ? 'live' : sts.some(x => x === 'late' || x === 'carry') ? 'late' : sts.includes('moved') ? 'moved' : 'todo';
      const w = pct(bk.e) - pct(bk.s), mins = Math.round((bk.e - bk.s)/M);
      const lab = st === 'done' ? I_CHECK : bk.k === 'oven' && w > 6 ? bk.temp + '°' : w > 9 ? (mins >= 60 ? Math.floor(mins/60)+'h'+(mins%60? mins%60 : '') : mins+'m') : '';
      const id = bk.k + ':' + bk.ts[0].id; bk.id = id; bk.st = st; bk.dn = dn;
      return `<button class="t2-bar ${st}${S.gSel===id?' sel':''}" style="--kc:${KINDS[bk.k].color};--p:${Math.round(dn/n*100)}%;left:${pct(bk.s)}%;width:max(8px, ${w}%);top:${row*22}px" data-act="gsel" data-id="${esc(id)}" aria-label="${KINDS[bk.k].label}, ${esc(fmtShort(bk.s))} to ${esc(fmtShort(bk.e))}, ${dn} of ${n} steps done">${lab}</button>`;
    }).join('');
    // Status for the dish as a whole
    const live = list.find(t => stateOf(t) === 'live'), rest = list.filter(t => !prog(t.id).done);
    let status;
    if(!rest.length) status = `<span class="t2-st done">${I_CHECK}Done</span>`;
    else if(live && inOven(live)) status = `<span class="t2-st live">In oven till ~${esc(fmtShort(prog(live.id).inOvenAt + live.oven.min*M))}</span>`;
    else if(live) status = `<span class="t2-st live">Cooking now</span>`;
    else if(rest.every(t => stateOf(t) === 'moved')) status = `<span class="t2-st">Moved to Thursday</span>`;
    else if(rest.some(t => stateOf(t) === 'late' || stateOf(t) === 'carry')) status = `<span class="t2-st late">Behind</span>`;
    else status = `<span class="t2-st">Next ${esc(fmtShort(pos(rest[0])))}</span>`;
    const first = pos(list[0]), last = Math.max(...list.map(t => pos(t) + lenOf(t)));
    const selB = blocks.find(bk => bk.id === S.gSel);
    const cap = selB ? `<div class="t2-cap"><b>${KINDS[selB.k].label}${selB.temp ? ' at '+selB.temp+'°F' : ''}${selB.c ? ' (left from Wednesday)' : ''}</b> · ${esc(fmtShort(selB.s))}–${esc(fmtShort(selB.e))} · ${selB.dn} of ${selB.ts.length} done<span>${selB.ts.map(t => (prog(t.id).done ? '✓ ' : '') + esc(t.title)).join(' · ')}</span></div>` : '';
    return `<li class="t2-row${!rest.length?' alldone':''}">
      <div class="t2-head"><span class="t2-name">${esc(name)}</span><span class="t2-sub tnum">${esc(fmtShort(first))}–${esc(fmtShort(last))} · ${nd}/${list.length} done</span>${status}</div>
      <div class="t2-track" style="height:${ends.length*22-4}px">${bars}</div>${cap}
    </li>`;
  }).join('');
  const nowIn = nowMs > a0 && nowMs < a1;
  const nowLine = nowIn ? `<span class="t2-past" style="width:${pct(nowMs)}%"></span><span class="t2-now" style="left:${pct(nowMs)}%"><b>${esc(fmtTime(nowMs))}</b></span>` : '';
  const dz = dinnerAt(plan), dinLine = day === 'thu' && dz > a0 && dz <= a1 ? `<span class="t2-dinner" style="left:${pct(dz)}%"><b>Dinner</b></span>` : '';
  const remaining = items.length - doneN, lastEnd = Math.max(...items.map(t => pos(t) + lenOf(t)));
  const pctDone = Math.round(doneN / items.length * 100);
  const summary = `<div class="t2-sum"><div class="t2-sum-top"><b>${doneN} of ${items.length} steps done</b><span>${remaining ? `${remaining} left · last one ends ${esc(fmtTime(lastEnd))}` : 'All done for the day'}</span></div><div class="prog"><i style="width:${pctDone}%"></i></div></div>`;
  const legend = `<div class="legend t2-legend">${Object.values(KINDS).map(x => `<span class="lg"><i style="background:${x.color}"></i>${x.label}</span>`).join('')}<span class="lg"><i class="lg-done"></i>Done</span><span class="lg"><i class="lg-late"></i>Behind</span>${day === 'wed' && nowMs >= at('thu','00:00') ? '<span class="lg"><i class="lg-moved"></i>Moved to Thursday</span>' : ''}</div>`;
  return `${summary}${legend}
    <div class="t2">
      <div class="t2-axis"><div class="t2-plot">${ticks.join('')}</div></div>
      <div class="t2-body">
        <div class="t2-lines" aria-hidden="true"><div class="t2-plot">${grid.join('')}${nowLine}${dinLine}</div></div>
        <ol class="t2-rows">${rows}</ol>
      </div>
    </div>
    <p class="sub t2-hint">Tap a bar to see which steps it covers.</p>`;
}

/* ============ HOST DASHBOARD ============ */
/* Up next: never hides a step until it's checked off. Everything that should already have started (or is under way or in the oven) always shows, however many there are; then the next few after that. */
function upNextKey(plan, t){ return t.who === 'h' && (isDone(t) || prog(t.id).assignee) ? dueOf(plan, t) - (t.dur||5)*60000 : listTime(plan, t); }
function upNextList(tasks, more){
  const plan = S.plan, nowMs = now(), key = t => upNextKey(plan, t);
  const open = tasks.filter(t => !isDone(t) && !t.final).sort((a,b) => key(a) - key(b));
  const due = open.filter(t => inOven(t) || started(t) || key(t) <= nowMs + 2*60000);
  return due.concat(open.filter(t => !due.includes(t)).slice(0, more)).sort(byListTime(plan));
}
function upNextCard(list, emptyText){
  const plan = S.plan, nowMs = now();
  const behind = list.filter(t => !inOven(t) && !started(t) && (t.who === 'h' ? dueOf(plan,t) : sched(plan,t,true) + 10*60000) < nowMs).length;
  const nextUp = list.find(t => !inOven(t) && !started(t) && upNextKey(plan,t) > nowMs + 2*60000);
  const sub = behind ? `<span class="pill crit">${behind} behind</span>` : nextUp ? `<span class="sub">${esc(relTo(upNextKey(plan,nextUp)))}</span>` : '';
  if(!list.length && !emptyText) return '';
  return `<section class="card" aria-labelledby="nx-h"><div class="card-h"><h2 id="nx-h">Up next</h2>${sub}</div>
    <div class="tasks">${list.length ? list.map((t,i)=>taskRow(t,{withDay:true, open:i===0})).join('') : `<p class="empty">${esc(emptyText)}</p>`}</div></section>`;
}

function personRow(k, p){
  const plan = S.plan, hj = plan.tasks.filter(t => t.who==='h');

  return `<div class="hrow"><div class="avatar" style="background:${colorFor(k)}" aria-hidden="true">${esc((p.name||'?').slice(0,1).toUpperCase())}</div>
    <div><b>${esc(p.name)}</b> <span class="sub">· ${did} done</span>${dishes.length ? `<p>Owns: ${dishes.map(esc).join(', ')}</p>` : ''}<p>${doing.length ? 'On: '+doing.map(t=>esc(t.title)).join('; ') : 'Not on a helper job right now'}</p></div></div>`;

function renderOwner(){
  const plan = S.plan, nowMs = now(), mine = myDishes();
  const tasks = plan.tasks.filter(myTask);
  const cook = tasks.filter(t => t.who==='mm' && mine.includes(t.r) && !t.optional && !t.final);
  const p = (() => { let n=0, nd=0, tot=0, dn=0; for(const t of tasks){ if(t.optional) continue; n++; tot+=weight(t); if(isDone(t)){ nd++; dn+=weight(t); } } return {n, nd, pct: tot ? Math.round(dn/tot*100) : 0}; })();
  let finish = 0, slip = 0;
  const dz0 = dinnerAt(plan);
  for(const t of cook){ if(t.day !== 'thu') continue; finish = Math.max(finish, endOf(plan, t)); if(!isDone(t) && sched(plan,t,true) >= dz0 - 150*60000){ const s = prog(t.id), sc = sched(plan,t,true); const late = t.oven && s.inOvenAt ? s.inOvenAt - sc : s.startedAt ? s.startedAt - sc : (sc < nowMs ? nowMs - sc : 0); slip = Math.max(slip, late); } }

    <div class="hero-top"><div><div class="eta-label" id="eta-h">${esc(names.join(', '))} ready by</div><div class="eta tnum">${cook.length && cook.every(isDone) ? 'Done' : esc(fmtTime(eta))}</div></div><div>${eta > dz ? `<span class="pill crit">${dur(mins(eta-dz))} after dinner</span>` : `<span class="pill good">In time for dinner at ${esc(fmtTime(dz))}</span>`}</div></div>

  const pendHtml = pend.length ? `<section class="card"><h2>Waiting for the host</h2>${pend.map(([id,x]) => `<div class="ritem"><span class="tile" aria-hidden="true">${esc((x.recipe.short||'?').slice(0,1).toUpperCase())}</span><div><b>${esc(x.recipe.name)}</b><div class="sub">Sent ${esc(fmtRel(x.at))}. It joins the plan once the host accepts it.</div></div><span></span></div>`).join('')}</section>` : '';
  const empty = !mine.length && !pend.length ? `<section class="card"><h2>No dishes yet</h2><p class="sub" style="margin:0">Pick a dish you're making from the sign-in screen, or add a new one.</p><div class="btns"><button class="btn primary" data-act="go" data-v="addDish">Add a dish</button><button class="btn" data-act="switch">Pick a dish</button></div></section>` : '';
  const al = liveAlerts(myTask);

}

function canEditTask(t){ return isHost() || myDishes().includes(t.r); }
function applyOps(plan, ops, why){

  const lines = [], toolIds = new Set(plan.kitchen.tools.map(x => x.id));

    if(f.t && validHM(f.t) && !t.final) t.t = validHM(f.t);

function relaxHelpers(plan){
  const lines = [];

    if(t.who !== 'h' || !t.from) continue;
    const due = dueOf(plan, t), latest = due - (t.dur||5)*60000, f = at(...t.from);

function ttPlan(id){

function planForAI(plan){

      else { o.from = t.from || [t.day, t.t]; o.dur = t.dur; if(t.for) o.for = t.for; else o.due = t.due; o.neededBy = dayOf(dueOf(plan,t)) + ' ' + hm(dueOf(plan,t)); }

      const u = Object.entries(t.uses||{}).filter(([,q]) => q > 0); if(u.length) o.uses = Object.fromEntries(u);

    if(usesTxt(b.uses) !== usesTxt(t.uses) && t.who === 'mm') L.push(`Equipment: ${usesTxt(b.uses)} → ${usesTxt(t.uses)}`);

}

/* Before/after bars for one dish, per day */
function dishCompare(base, plan, k){
  const M = 60000, H = 3600000;
  const span = (p, t) => { const s = t.who === 'h' ? displayTime(p, t) : sched(p, t); return [s, s + Math.max(1, t.who === 'h' ? (t.dur||5) : len(t)) * M]; };
  const blocksOf = (p, day) => {
    const bl = [];
    for(const t of p.tasks.filter(t => t.r === k && !t.final && dayOf(span(p,t)[0]) === day).sort((a,b) => span(p,a)[0] - span(p,b)[0])){
      const [s, e] = span(p, t), kk = kindOf(t);
      const b = bl.find(x => x.k === kk && s <= x.e + 15*M && (kk !== 'oven' || x.temp === t.oven.temp));
      if(b) b.e = Math.max(b.e, e); else bl.push({k:kk, s, e, temp: t.oven && t.oven.temp});
    }
    return bl.sort((a,b) => a.s - b.s);
  };
  const days = ['wed','thu'].map(day => ({day, a: blocksOf(base, day), b: blocksOf(plan, day)})).filter(x => x.a.length || x.b.length);
  if(!days.length) return '<p class="empty">This dish has no steps.</p>';
  return days.map(({day, a, b}) => {
    const same = JSON.stringify(a.map(x => [x.k,x.s,x.e])) === JSON.stringify(b.map(x => [x.k,x.s,x.e]));
    let a0 = Math.min(...a.concat(b).map(x => x.s)), a1 = Math.max(...a.concat(b).map(x => x.e));
    a0 = Math.floor(a0 / H) * H; a1 = Math.max(a0 + H, Math.ceil(a1 / H) * H);
    const pct = ms => (ms - a0) / (a1 - a0) * 100, step = a1 - a0 > 6*H ? 2*H : H;
    const ticks = []; for(let x = a0; x <= a1; x += step) ticks.push(`<span class="t2-tick" style="left:${pct(x)}%">${esc(fmtShort(x))}</span>`);
    const track = bl => { const ends = []; const bars = bl.map(x => { let row = ends.findIndex(e => e <= x.s); if(row < 0){ row = ends.length; ends.push(x.e); } else ends[row] = x.e; const w = pct(x.e) - pct(x.s); return `<span class="t2-bar todo" style="--kc:${KINDS[x.k].color};--p:0%;left:${pct(x.s)}%;width:max(8px, ${w}%);top:${row*22}px">${x.k === 'oven' && w > 8 ? x.temp + '°' : ''}</span>`; }).join(''); return `<div class="t2-track" style="height:${Math.max(1,ends.length)*22-4}px">${bars || '<span class="sub cmp-none">Nothing this day</span>'}</div>`; };
    if(same) return `<div class="cmp-day"><div class="cmp-dh"><b>${day === 'wed' ? 'Wednesday' : 'Thursday'}</b><span class="sub">No timing changes</span></div></div>`;
    return `<div class="cmp-day"><div class="cmp-dh"><b>${day === 'wed' ? 'Wednesday' : 'Thursday'}</b></div>
      <div class="cmp"><div class="t2-axis"><div class="t2-plot">${ticks.join('')}</div></div>
      <div class="cmp-row"><span class="cmp-l">Before</span>${track(a)}</div>
      <div class="cmp-row"><span class="cmp-l">After</span>${track(b)}</div></div></div>`;
  }).join('');
}

/* ============ DRAFT BINDING ============ */
function setPath(obj, parts, val){
  let o = obj;
  for(let i=0;i<parts.length-1;i++){ const p = parts[i]; if(o[p] == null) o[p] = /^\d+$/.test(parts[i+1]) ? [] : {}; o = o[p]; }
  o[parts[parts.length-1]] = val;
}
function applyBind(el){
  const d = S.draft; if(!d) return false;
  const path = el.dataset.b, type = el.dataset.type;
  let val = el.type === 'checkbox' ? el.checked : el.value;
  if(type === 'num'){ val = Number(val); if(!isFinite(val)) return false; }
  if(type === 'lines') val = String(val).split('\n').map(s=>s.trim()).filter(Boolean);
  const plan = d.plan, parts = path.split('.');
  if(parts[0] === 'r'){ setPath(plan.recipes[d.recipeId], parts.slice(1), val); }
  else if(parts[0] === 'ing'){ setPath(plan.recipes[d.recipeId].ingredients, parts.slice(1), val); }
  else if(parts[0] === 'step'){ setPath(plan.recipes[d.recipeId].steps, parts.slice(1), val); }
  else if(parts[0] === 'k'){ setPath(plan.kitchen, parts.slice(1), val); }
  else if(parts[0] === 'tool'){ setPath(plan.kitchen.tools, parts.slice(1), val); }
  else if(parts[0] === 't'){
    const t = findTask(plan, parts[1]); if(!t) return false;
    const f = parts.slice(2);
    if(f[0] === 'ovenOn'){ if(val){ t.oven = {temp:350, slots:1, min: t.dur||30, max:(t.dur||30)+5, check:''}; } else { t.dur = t.oven ? t.oven.min : t.dur; delete t.oven; } }
    else if(f[0] === 'who'){
      if(val === 'h') makeHelperJob(plan, t);
      else if(val === 'mm') makeHostTask(plan, t);
    }
    else if(f[0] === 'for' && f[1] === 'id'){ if(val){ t.for = {id: val, before: (t.for && t.for.before) || 0}; delete t.due; } else { const due = dueOf(plan,t); t.due = [dayOf(due), hm(due)]; delete t.for; } }
    else if(f[0] === 'forAt'){ const tg = t.for && findTask(plan, t.for.id); if(tg){ const cur = dueOf(plan, t), day = f[1] === 'day' ? val : dayOf(cur), tm = f[1] === 'time' ? validHM(val) : hm(cur); if(tm) t.for.before = Math.round((sched(plan, tg, true) - at(day, tm)) / 60000); } }
    else if(f[0] === 'due'){ const cur = dueOf(plan, t); t.due = f[1] === '0' ? [val, t.due ? t.due[1] : hm(cur)] : [t.due ? t.due[0] : dayOf(cur), val]; }
    else if(f[0] === 'oven' && (f[1] === 'min' || f[1] === 'max')){ setPath(t, f, val); if(t.oven.max < t.oven.min) t.oven[f[1]==='min'?'max':'min'] = val; t.dur = t.oven.min; }
    else setPath(t, f, val);
  }
  return true;
}

  drag = {t, blk, y0: e.clientY, m0: toMin(t.t), top0: parseFloat(blk.style.top), pid: e.pointerId};

document.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.pid) return;
  const delta = Math.round((e.clientY - drag.y0) / PPM / 5) * 5;
  const m = Math.max(0, Math.min(23*60+55, drag.m0 + delta));
  drag.blk.style.top = (drag.top0 + (m - drag.m0) * PPM) + 'px';
  drag.t.t = fromMin(m);
  const lbl = drag.blk.querySelector('.blk-time'); if(lbl) lbl.textContent = fmtTime(at(drag.t.day, drag.t.t));
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    refreshImpact();
    const bad = new Set(planIssues(S.draft.plan).flatMap(i => i.ids));
    document.querySelectorAll('.blk').forEach(b => b.classList.toggle('bad', bad.has(b.dataset.id)));

/* One-time upgrade: plans saved before the steps were rewritten get the new, self-contained step text.
   Only steps whose text is still exactly the original are replaced, so anything edited by hand or by the AI stays as it is. */
function upgradeSteps(plan){
  if(!plan || plan.stepsV >= 2 || typeof LEGACY_STEPS_V1 === 'undefined') return null;
  const p = clone(plan); let n = 0;
  for(const t of p.tasks){
    const old = LEGACY_STEPS_V1[t.id], def = DEFAULT_PLAN.tasks.find(x => x.id === t.id);
    if(!old || !def) continue;
    const cur = JSON.stringify(t.steps || []);
    if(cur === JSON.stringify(old) && cur !== JSON.stringify(def.steps)){ t.steps = clone(def.steps); n++; }
  }
  p.stepsV = 2;
  return {plan: p, n};
}
function applyUpgrade(){
  const u = upgradeSteps(S.plan); if(!u) return;
  S.plan = u.plan;
  if(S.conn !== 'readonly') persist('plan/current', {plan: u.plan, at: Date.now(), by: S.key || 'upgrade'});
}
function validPlan(p){ return p && p.v === 2 && Array.isArray(p.tasks) && p.recipes && p.kitchen && Array.isArray(p.recipeOrder); }
async function boot(){
  render();
  setInterval(() => { if(document.getElementById('modal').innerHTML || drag) return; const a = document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { document.querySelectorAll('.nowtxt').forEach(n => n.textContent = nowText()); return; } render(); }, 15000);
  const C = window.claude;
  const finishLocal = () => {
    S.conn = 'local'; if(!S.key) S.key = localKey();
    const l = lsGet('tg-local2'); if(l){ S.tasks = l.tasks || {}; S.people = l.people || {}; if(validPlan(l.plan)){ S.plan = l.plan; applyUpgrade(); } }
    S.subs = lsGet('tg-subs') || {};
    afterIdentity(); S.ready = true; render();
  };
  let u = null, d = null;
  if(C && typeof C.use === 'function'){ try{ [u, d] = await Promise.all([C.use('user'), C.use('db')]); }catch(e){} }
  else {
    S.noAI = true;
    if(FIREBASE_CONFIG){
      try{
        const [A, F] = window.__testFirebase || await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-firestore.js')]);
        const app = A.initializeApp(FIREBASE_CONFIG);
        let fdb; try{ fdb = F.initializeFirestore ? F.initializeFirestore(app, {experimentalAutoDetectLongPolling: true}) : F.getFirestore(app); }catch(e){ fdb = F.getFirestore(app); }
        d = fsAdapter(F, fdb);
        setupGemini(app);
      }catch(e){ d = null; }
    }
  }
  userCap = u; db = d;
  if(u){ try{ const me = await u.me(); S.key = me.id || null; S.suggestedName = (me.name || '').split(' ')[0]; }catch(e){} }
  if(!S.key) S.key = localKey();
  if(!db) return finishLocal();
  S.conn = 'loading';
  let gotTasks = false, gotPlan = false;
  const loaded = () => { if(gotTasks && gotPlan && !S.ready){ S.ready = true; afterIdentity(); } };
  const loadTimer = setTimeout(() => { if(!S.ready){ S.ready = true; afterIdentity(); } if(S.conn === 'loading'){ S.conn = 'stale'; } render(); }, 10000);
  const onTasks = snap => {
    const m = {}; snap.docs.forEach(x => { if(x.exists) m[x.id] = x.data(); });
    if(S.ready && gotTasks) announceRemote(S.tasks, m);
    S.tasks = m;
    if(!snap.metadata.fromCache){ gotTasks = true; clearTimeout(loadTimer); if(S.conn === 'loading' || S.conn === 'stale') S.conn = 'live'; }
    loaded(); render();
  };
  listen('plan', () => db.doc('plan/current').onSnapshot(snap => {
    if(snap.exists && validPlan((snap.data()||{}).plan)){ S.plan = snap.data().plan; if(!snap.metadata.fromCache) applyUpgrade(); }
    if(!snap.metadata.fromCache){ gotPlan = true; heard(); }
    loaded(); render();
  }, e => { gotPlan = true; loaded(); listenFailed('plan', e); }));
  listen('tasks', () => db.collection('tasks').onSnapshot(snap => { onTasks(snap); if(!snap.metadata.fromCache) heard(); }, e => { clearTimeout(loadTimer); gotTasks = true; loaded(); listenFailed('tasks', e); }));
  listen('subs', () => db.collection('submissions').onSnapshot(snap => { const m = {}; snap.docs.forEach(x => { if(x.exists) m[x.id] = x.data(); }); S.subs = m; heard(); render(); }, e => listenFailed('subs', e)));
  listen('people', () => db.collection('people').onSnapshot(snap => { const m = {}; snap.docs.forEach(x => { if(x.exists) m[x.id] = x.data(); }); S.people = m; heard(); render(); }, e => listenFailed('people', e)));
  listen('rev', () => db.doc('meta/rev').onSnapshot(snap => { S.revSeen = snap.exists ? ((snap.data()||{}).at || 0) : 0; if(!snap.metadata || !snap.metadata.fromCache) heard(); }, e => listenFailed('rev', e)));
  startWatchdog();
}

/* ============ LIVE UPDATES ============
   Firestore pushes every change to everyone straight away. Phones that sleep or switch apps can come back with a dead
   connection, so: listeners restart themselves after an error, every write also stamps meta/rev, and a cheap check
   compares the server's stamp with the last one this device heard. If they don't match, the connection is reopened. */
const LIVE = {unsubs:{}, makers:{}, tries:{}, miss:0, checking:false, revTimer:0, lastCheck:0};
function listen(name, make){ LIVE.makers[name] = make; try{ const u = make(); LIVE.unsubs[name] = typeof u === 'function' ? u : null; }catch(e){ listenFailed(name, e); } }
function listenFailed(name, e){
  if(e && e.code === 'permission-denied'){ if(name === 'rev'){ LIVE.off = true; return; } S.conn = 'readonly'; render(); return; }
  setLive('reconnecting');
  const n = LIVE.tries[name] = (LIVE.tries[name] || 0) + 1;
  setTimeout(() => { try{ LIVE.unsubs[name] && LIVE.unsubs[name](); }catch(_){} listen(name, LIVE.makers[name]); }, Math.min(30000, 1000 * 2 ** Math.min(n, 5)));
}
function heard(){ LIVE.tries = {}; if(S.conn === 'stale') S.conn = 'live'; setLive('live'); }
function setLive(st){
  if(S.live === st) return; S.live = st;
  document.querySelectorAll('.livechip').forEach(el => { el.outerHTML = liveChip(); });
}
function liveChip(){
  if(!db || S.conn === 'local') return '';
  const st = S.live || 'live';
  const label = st === 'live' ? 'Live' : st === 'offline' ? 'Offline' : 'Reconnecting…';
  const tip = st === 'live' ? 'Changes from everyone show up here as they happen' : st === 'offline' ? 'No internet. Your changes will send when you\'re back online' : 'Catching up with everyone else\'s changes';
  return `<span class="livechip ${st}" role="status" title="${tip}"><i aria-hidden="true"></i>${label}</span>`;
}
function bumpRev(){ if(LIVE.off) return; clearTimeout(LIVE.revTimer); LIVE.revTimer = setTimeout(() => { persist('meta/rev', {at: Date.now(), by: S.key || null}); }, 400); }
async function liveCheck(reason){
  if(!db || !db.serverGet || document.hidden || LIVE.checking || LIVE.off) return;
  if(navigator.onLine === false){ setLive('offline'); return; }
  LIVE.checking = true; LIVE.lastCheck = Date.now();
  try{
    const r = await db.serverGet('meta/rev'), at = r.exists ? ((r.data()||{}).at || 0) : 0;
    if(at === (S.revSeen || 0)){ LIVE.miss = 0; setLive('live'); }
    else if(reason === 'back' || ++LIVE.miss >= 2){ LIVE.miss = 0; setLive('reconnecting'); if(db.kick) await db.kick(); setTimeout(() => liveCheck('after'), 3000); }
    else setTimeout(() => liveCheck('again'), 4000);
  }catch(e){ if(e && e.code === 'permission-denied'){ LIVE.off = true; setLive('live'); } else setLive(navigator.onLine === false ? 'offline' : 'reconnecting'); }
  finally{ LIVE.checking = false; }
}
function startWatchdog(){
  setInterval(() => liveCheck('timer'), 20000);
  const back = () => { if(!document.hidden && Date.now() - LIVE.lastCheck > 2000) liveCheck('back'); };
  document.addEventListener('visibilitychange', back);
  window.addEventListener('focus', back);
  window.addEventListener('pageshow', back);
  window.addEventListener('online', () => { setLive('reconnecting'); if(db && db.kick) db.kick().catch(() => {}); setTimeout(() => liveCheck('after'), 2500); });
  window.addEventListener('offline', () => setLive('offline'));
}
/* Tell people when someone else claims, finishes or starts something */
function announceRemote(prev, next){
  const msgs = [];
  for(const [id, n] of Object.entries(next)){
    const o = prev[id] || {};
    if(!n || n.by === S.key || !n.by) continue;
    const t = findTask(S.plan, id); if(!t) continue;
    const who = personName(n.by), title = '"' + t.title + '"';
    if(n.done && !o.done) msgs.push(`${who} finished ${title}`);
    else if(n.offer && n.offer.to === S.key && (!o.offer || o.offer.at !== n.offer.at)) msgs.push(`${personName(n.offer.by)} asked you to do ${title}`);
    else if(n.assignee && n.assignee !== o.assignee) msgs.push(o.offer && o.offer.to === n.assignee ? `${personName(n.assignee)} accepted ${title}` : n.assignee === S.key ? `${who} gave you ${title}` : `${personName(n.assignee)} claimed ${title}`);
    else if(n.declined && (!o.declined || o.declined.at !== n.declined.at)) msgs.push(`${personName(n.declined.by)} said no to ${title}`);
    else if(o.offer && o.offer.to === S.key && !n.offer && !n.assignee) msgs.push(`The request for ${title} was cancelled`);
    else if(!n.assignee && o.assignee && !n.done) msgs.push(`${title} is open again`);
    else if(n.inOvenAt && !o.inOvenAt) msgs.push(`${who} put ${title} in the oven`);
    else if(n.startedAt && !o.startedAt) msgs.push(`${who} started ${title}`);
  }
  if(msgs.length) toast(msgs.length === 1 ? msgs[0] : `${msgs[0]}, plus ${msgs.length - 1} more update${msgs.length > 2 ? 's' : ''}`);
}
function afterIdentity(){
  S.baseKey = S.baseKey || S.key;
  if(S.me && !(S.me.key && S.me.key.startsWith(S.baseKey + '-'))) S.me = null;   // saved identity from another account
  if(S.me) S.key = S.me.key;
  S.view = S.me ? homeView() : 'landing';
}
boot();
